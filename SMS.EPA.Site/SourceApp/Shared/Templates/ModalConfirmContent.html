<div id="confirmPopup">
    <div class="modal-header">
        <div class="popup-header">
            {{"Confirmation" | translate}}
            <span class="close-popup" ng-click="modalConfirmCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        Are you sure you want to {{modalConfirmCtrl.action}} <b>{{modalConfirmCtrl.name}}</b>?
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" ng-click="modalConfirmCtrl.ok()" data-translate="OK"></button>
        <button class="btn btn-default" ng-click="modalConfirmCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
