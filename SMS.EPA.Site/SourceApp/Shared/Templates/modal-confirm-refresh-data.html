<div id="confirmPopup">
    <div class="modal-header">
        <div class="popup-header">
            {{"Confirmation" | translate}}
            <span class="close-popup" ng-click="modalConfirmCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        It looks like you have been editing something. If you refresh before saving, your changes will be lost.
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" ng-click="modalConfirmCtrl.ok()" data-translate="OK"></button>
        <button class="btn btn-cancel" ng-click="modalConfirmCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
