<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th data-translate="SymbolCount"></th>
            <th data-translate="PeriodName"></th>
            <th data-translate="StartDate" class="col-date"></th>
            <th data-translate="EndDate" class="col-date"></th>
            <th class="show-hide-score">
                <span data-translate="FinalScore" ng-show="dashboardCtrl.myEPAs.length == 0"></span>
                <a data-translate="ShowFinalScore" ng-show="!dashboardCtrl.showScore && dashboardCtrl.myEPAs.length > 0"
                   ng-click="dashboardCtrl.showScore = !dashboardCtrl.showScore"></a>
                <a data-translate="HideFinalScore" ng-show="dashboardCtrl.showScore && dashboardCtrl.myEPAs.length > 0"
                   ng-click="dashboardCtrl.showScore = !dashboardCtrl.showScore"></a>
            </th>
            <th data-translate="Action" class="col-action"></th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="myEPA in dashboardCtrl.myEPAs">
            <td class="text-center" ng-bind="$index + 1"></td>
            <td ng-bind="myEPA.Period.Name"></td>
            <td class="text-center col-date" ng-bind="myEPA.Period.StartDate | customDate"></td>
            <td class="text-center col-date" ng-bind="myEPA.Period.EndDate | customDate"></td>
            <td class="text-center col-final-score">
                <div ng-show="dashboardCtrl.showScore">
                    <span ng-show="myEPA.Status.StatusId == 0" ng-bind="'N/A'"></span>
                    <span ng-show="myEPA.Status.StatusId == 1" ng-bind="myEPA.FinalScore | customNumber"></span>
                </div>
            </td>
            <td class="text-center col-action">
                <a class="evaluate-now button" href="" ng-click="dashboardCtrl.viewEPADetail(myEPA)"
                   ng-href="{{dashboardCtrl.viewEPADetailUrl}}"
                   ng-show="!myEPA.IsEndProcessBySelf && myEPA.Status.StatusId == 0">
                    <span data-translate="EvaluateNow"></span>
                    <span class="glyphicon icon-breadcrumb"></span>
                </a>
                <a class="evaluate-now button" href="" ng-click="dashboardCtrl.viewEPAResult(myEPA)"
                   ng-href="{{dashboardCtrl.viewEPAResultUrl}}"
                   ng-show="myEPA.IsEndProcessBySelf || myEPA.Status.StatusId == 1">
                    <span data-translate="View"></span>
                    <span class="glyphicon glyphicon-search"></span>
                </a>
            </td>
        </tr>
    </tbody>
    <tbody ng-show="dashboardCtrl.myEPAs.length == 0">
        <tr>
            <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
        </tr>
    </tbody>
</table>
