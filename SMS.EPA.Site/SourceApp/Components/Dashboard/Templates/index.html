<div class="row dashboard" ng-controller="DashboardController as dashboardCtrl">
    <div class="row">
        <div ng-init="dashboardCtrl.collapses['PersonalProfile'] = false;">
            <div class="boxtitle first" data-translate="PersonalProfile"
                 ng-click="dashboardCtrl.collapses['PersonalProfile'] = !dashboardCtrl.collapses['PersonalProfile']"></div>
            <div class="boxcontent" collapse="dashboardCtrl.collapses['PersonalProfile']"
                 ng-include src="'/SourceApp/Components/Dashboard/Templates/personalProfile.html'"></div>
        </div>
    </div>
    <div class="row">
        <div ng-init="dashboardCtrl.collapses['MyEPA'] = false;">
            <div class="boxtitle" data-translate="MyEPAs"
                 ng-click="dashboardCtrl.collapses['MyEPA'] = !dashboardCtrl.collapses['MyEPA']"></div>
            <div class="boxcontent" collapse="dashboardCtrl.collapses['MyEPA']"
                 ng-include src="'/SourceApp/Components/Dashboard/Templates/myEPA.html'"></div>
        </div>
    </div>
</div>
