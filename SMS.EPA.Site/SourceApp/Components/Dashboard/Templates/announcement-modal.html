<div class="modal-header">
    <div class="popup-header">
        {{"Announcement" | translate}}
        <span class="close-popup" ng-click="announcementCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <ul>
        <li ng-repeat="announcement in announcementCtrl.announcements"><p ng-bind="announcement"></p></li>
    </ul>
</div>
<div class="modal-footer">
    <button class="btn btn-cancel" ng-click="announcementCtrl.cancel()" data-translate="Cancel"></button>
</div>
