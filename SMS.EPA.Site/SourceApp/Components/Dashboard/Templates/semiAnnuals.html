<div class="panel panel-default" ng-if="dashboardCtrl.todoList.SemiAnnuals.length > 0">
    <div class="panel-heading" data-toggle="collapse" data-target=".semiAnnuals">
        <h4 class="panel-title" data-translate="Semi"></h4>
    </div>
    <div class="panel-collapse collapse in semiAnnuals">
        <div class="panel-body">
            <table class="table table-bordered table-striped table-custom">
                <thead>
                    <tr>
                        <th data-translate="SymbolCount" rowspan="2"></th>
                        <th data-translate="Period" rowspan="2"></th>
                        <th data-translate="Evaluator" colspan="2" ng-show="dashboardCtrl.todoList.SemiAnnualHasEvaluator"></th>
                        <th data-translate="Reviewer" colspan="2" ng-show="dashboardCtrl.todoList.SemiAnnualHasReviewer"></th>
                        <th data-translate="Management" colspan="2" ng-show="dashboardCtrl.todoList.SemiAnnualHasManagement"></th>
                    </tr>
                    <tr>
                        <th data-translate="Unfinished" ng-show="dashboardCtrl.todoList.SemiAnnualHasEvaluator"></th>
                        <th data-translate="Finished" ng-show="dashboardCtrl.todoList.SemiAnnualHasEvaluator"></th>
                        <th data-translate="Unfinished" ng-show="dashboardCtrl.todoList.SemiAnnualHasReviewer"></th>
                        <th data-translate="Finished" ng-show="dashboardCtrl.todoList.SemiAnnualHasReviewer"></th>
                        <th data-translate="Unfinished" ng-show="dashboardCtrl.todoList.SemiAnnualHasManagement"></th>
                        <th data-translate="Finished" ng-show="dashboardCtrl.todoList.SemiAnnualHasManagement"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="period in dashboardCtrl.todoList.SemiAnnuals">
                        <td class="text-center" ng-bind="$index + 1"></td>
                        <td ng-bind="period.Period.Name"></td>
                        <td class="text-center" ng-show="dashboardCtrl.todoList.SemiAnnualHasEvaluator">
                            <a href="" ng-bind="period.NumberOfEmployeesUnfinishedByEvaluator"></a>
                        </td>
                        <td class="text-center" ng-show="dashboardCtrl.todoList.SemiAnnualHasEvaluator">
                            <a href="" ng-bind="period.NumberOfEmployeesFinishedByEvaluator"></a>
                        </td>
                        <td class="text-center" ng-show="dashboardCtrl.todoList.SemiAnnualHasReviewer">
                            <a href="" ng-bind="period.NumberOfEmployeesUnfinishedByReviewer"></a>
                        </td>
                        <td class="text-center" ng-show="dashboardCtrl.todoList.SemiAnnualHasReviewer">
                            <a href="" ng-bind="period.NumberOfEmployeesFinishedByReviewer"></a>
                        </td>
                        <td class="text-center" ng-show="dashboardCtrl.todoList.SemiAnnualHasManagement">
                            <a href="" ng-bind="period.NumberOfEmployeesFinishedByManagement"></a>
                        </td>
                        <td class="text-center" ng-show="dashboardCtrl.todoList.SemiAnnualHasManagement">
                            <a href="" ng-bind="period.NumberOfEmployeesUnfinishedByManagement"></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
