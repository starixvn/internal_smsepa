<div class="col-sm-2 text-center">
    <div class="img-user">
        <img class="img-default" src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" alt="User" />
    </div>
</div>
<div class="col-sm-10">
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4" data-translate="EmployeeCode"></div>
            <div class="col-sm-7">
                <strong ng-bind="dashboardCtrl.employee.Code"></strong>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="col-sm-4" data-translate="NickName"></div>
            <div class="col-sm-7">
                <strong ng-bind="dashboardCtrl.employee.NickName"></strong>
            </div>
        </div>
    </div>
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4" data-translate="FullName"></div>
            <div class="col-sm-7">
                <strong ng-bind="dashboardCtrl.employee.FullName"></strong>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="col-sm-4" data-translate="JobTitle"></div>
            <div class="col-sm-7">
                <strong ng-bind="dashboardCtrl.employee.JobTitle.JobTitleName"></strong>
            </div>
        </div>
    </div>
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4" data-translate="Department"></div>
            <div class="col-sm-7">
                <strong ng-bind="dashboardCtrl.employee.Department.Name"></strong>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="col-sm-4" data-translate="Section"></div>
            <div class="col-sm-7">
                <strong ng-bind="dashboardCtrl.employee.Group.GroupName"></strong>
            </div>
        </div>
    </div>
</div>
