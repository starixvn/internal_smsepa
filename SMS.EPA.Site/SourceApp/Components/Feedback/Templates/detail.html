<div ng-controller="FeedbackDetailController as feedbackDetailCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current">360 Degree EPA</li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">
                <span>360 Degree EPA</span>
                <span> - {{feedbackDetailCtrl.feedback.Period}}</span>
            </div>
            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo" data-translate="GeneralInfo"></div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info" ng-include src="'/SourceApp/Components/Feedback/Templates/generalInfo.html'"></div>
                </div>
            </div>
            <div class="panel panel-default" ng-if="feedbackDetailCtrl.feedback.IsViewDetail">
                <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult" data-translate="Result"></div>
                <div class="panel-collapse collapse in performanceResult">
                    <div class="panel-body summary-section">
                        <table class="table table-bordered table-striped table-performance-result table-custom">
                            <thead>
                                <tr>
                                    <th data-translate="Evaluator"></th>
                                    <th data-translate="FinalScore"></th>
                                    <th data-translate="Comment"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="text-center col-score">
                                        <div ng-bind="feedbackDetailCtrl.feedback.Evaluator.Nickname"
                                             popover-avatar avatar-src="{{feedbackDetailCtrl.feedback.Evaluator.Avatar}}"></div>
                                    </td>
                                    <td class="text-center col-score">{{feedbackDetailCtrl.feedback.FinalScore | customScore}} / 100</td>
                                    <td ng-bind="feedbackDetailCtrl.feedback.Comment"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <br />
            <div ng-include src="'/SourceApp/Components/Feedback/Templates/listKPI.html'"></div>
            <br />
            <div class="panel panel-default" ng-if="!feedbackDetailCtrl.feedback.IsViewDetail">
                <div class="panel-heading" data-toggle="collapse" data-target=".summary" data-translate="Summary"></div>
                <div class="panel-collapse collapse in summary">
                    <div class="panel-body summary-section">
                        <div class="lable-comment-if-any" data-translate="CommentsIfAny"></div>
                        <div class="textarea-comment">
                            <textarea class="form-control" maxlength="2000" ng-readonly="!feedbackDetailCtrl.feedback.IsHost"
                                      ng-model="feedbackDetailCtrl.feedback.Comment"></textarea>
                        </div>

                        <table class="table table-bordered table-striped table-custom table-summary">
                            <tbody>
                                <tr class="text-right">
                                    <td><strong data-translate="TotalScore"></strong></td>
                                    <td class="text-center col-score">
                                        <strong>{{feedbackDetailCtrl.feedback.FinalScore | customScore}} / 100</strong>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <label class="error-message">{{"Note" | translate }}: (*) {{"RequiredField" | translate}}!</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="feedbackDetailCtrl.save()"
                        ng-if="feedbackDetailCtrl.feedback && feedbackDetailCtrl.feedback.IsHost" data-translate="Save"></button>
                <button class="btn btn-warning" ng-click="feedbackDetailCtrl.cancel()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
