<div class="col-sm-12 job-description" ng-controller="EditPersonnelSettingController as editPersonnelCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb float-left">
            <li data-translate="JobDescription"></li>
            <li class="current" data-translate="Edit"></li>
        </ul>
        <button ng-click="editPersonnelCtrl.backToList()" class="btn btn-cancel">
            <span class="glyphicon glyphicon-menu-left"></span> <span data-translate="BackToList"></span>
        </button>
    </div>
    <form class="employee-info">
        <div class="row">
            <div class="col-sm-6">
                <div class="col-sm-2" data-translate="EmployeeCode"></div>
                <div class="col-sm-4"><strong ng-bind="editPersonnelCtrl.employeeSettingInfo.Code"></strong></div>
                <div class="col-sm-2" data-translate="NickName"></div>
                <div class="col-sm-4"><strong ng-bind="editPersonnelCtrl.employeeSettingInfo.Nickname"></strong></div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="col-sm-2" data-translate="FullName"></div>
                <div class="col-sm-4"><strong ng-bind="editPersonnelCtrl.employeeSettingInfo.FullName"></strong></div>
                <div class="col-sm-2" data-translate="JobLevel"></div>
                <div class="col-sm-4"><strong ng-bind="editPersonnelCtrl.employeeSettingInfo.JobLevel"></strong></div>
            </div>
        </div>
    </form>
    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table" ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policy.Host">
                <th colspan="7">
                    <a class="pull-left button-icon create-button" ng-click="editPersonnelCtrl.createDescriptionGroupItem()">
                        <span class="glyphicon glyphicon-plus icon-add"></span>
                        <span class="button-text" data-translate="CreateDesciptionGroup"></span>
                    </a>
                </th>
            </tr>
            <tr>
                <th ng-show="jobDescriptionCtrl.permission === jobDescriptionCtrl.policy.Host"></th>
                <th data-translate="Description"></th>
                <th data-translate="Action" ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policy.Host"></th>
            </tr>
        </thead>
        <tbody ng-if="editPersonnelCtrl.employeeSettingInfo.GroupItems.length > 0">
            <tr class="row-highlight" ng-repeat-start="groupItem in editPersonnelCtrl.employeeSettingInfo.GroupItems">
                <td class="text-center">
                    <input type="checkbox" ng-model="groupItem.IsSelectedAll"
                           ng-click="editPersonnelCtrl.checkAll(groupItem.IsSelectedAll, groupItem)"
                           ng-disabled="jobDescriptionCtrl.permission != jobDescriptionCtrl.policyEnum.Host" />
                </td>
                <td><strong ng-bind="groupItem.Name"></strong></td>
                <td class="text-center" ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="editPersonnelCtrl.updateDescriptionGroupItem(groupItem)" ng-attr-title='{{"Edit" | translate}}'></a>
                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="editPersonnelCtrl.deleteDescriptionGroupItem(groupItem)" ng-attr-title='{{"Delete" | translate}}'></a>
                    <a class="glyphicon glyphicon-plus icon-add" href="" ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policyEnum.Host"
                       ng-click="editPersonnelCtrl.createDescriptionItem(groupItem.GroupItemId)" ng-attr-title='{{"AddDescriptonItem" | translate}}'></a>
                </td>
            </tr>
            <tr ng-repeat-end ng-repeat="item in groupItem.Items ">
                <td class="text-center">
                    <input type="checkbox" ng-model="item.IsSelected" ng-click="editPersonnelCtrl.check(groupItem)"
                           ng-disabled="jobDescriptionCtrl.permission != jobDescriptionCtrl.policyEnum.Host" />
                </td>
                <td ng-bind="item.Name"></td>
                <td class="text-center" ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="editPersonnelCtrl.updateDescriptionItem(item)" ng-attr-title='{{"Edit" | translate}}'></a>
                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="editPersonnelCtrl.deleteDescriptionItem(item)" ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
            </tr>
        </tbody>
        <tbody ng-if="editPersonnelCtrl.employeeSettingInfo.GroupItems.length === 0">
            <tr>
                <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
    </table>
    <div class="navbar navbar-default navbar-fixed-bottom action-section">
        <div class="container text-center">
            <button class="btn btn-primary" ng-click="editPersonnelCtrl.save()"
                    ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policy.Host" data-translate="Save"></button>
        </div>
    </div>
</div>
