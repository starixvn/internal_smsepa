<div class="modal-header">
    <div class="popup-header">
        Copy Setting
        <span class="close-popup" ng-click="copyEmployeeSettingCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body copy-setting-modal-body">
    <form class="form-horizontal col-sm-11" role="form">
        <div class="form-group required">
            <label class="col-sm-4 control-label" data-translate="From"></label>
            <div class="col-sm-8 field">
                <select ng-model="copyEmployeeSettingCtrl.fromEmployeeId"
                        ng-options="item.EmployeeId as item.displayName for item in copyEmployeeSettingCtrl.employeeHasSettings"
                        required class="form-control">
                    <option value="" hidden disabled>-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="To"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="copyEmployeeSettingCtrl.employee.displayName" readonly />
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-click="copyEmployeeSettingCtrl.save()" data-translate="Submit"></button>
    <button class="btn btn-cancel" ng-click="copyEmployeeSettingCtrl.cancel()" data-translate="Cancel"></button>
</div>
