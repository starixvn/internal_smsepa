<div ng-controller="TeamSettingController as teamCtrl">
    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="4">
                    <input type="text" ng-model="teamCtrl.searchKey" ng-change="teamCtrl.search()"
                           class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="Section"></th>
                <th data-translate="JobLevel"></th>
                <th data-translate="Action" ng-show="jobDescriptionCtrl.permission === jobDescriptionCtrl.policy.Host"></th>
            </tr>
        </thead>
        <tbody class="table-body" ng-if="teamCtrl.filteredItems.length > 0">
            <tr dir-paginate="team in teamCtrl.filteredItems | itemsPerPage: teamCtrl.pageSize" current-page="teamCtrl.currentPage">
                <td class="text-center" ng-bind="teamCtrl.getIndex($index, teamCtrl.currentPage, teamCtrl.pageSize)"></td>
                <td ng-bind="team.Code"></td>
                <td ng-bind="team.Name"></td>
                <td class="text-center" ng-if="jobDescriptionCtrl.permission === jobDescriptionCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="teamCtrl.editJobDescription(team)"
                       ng-attr-title='{{"Edit" | translate}}'></a>
                </td>
            </tr>
        </tbody>
        <tbody ng-if="teamCtrl.filteredItems.length === 0">
            <tr>
                <td class="empty-result" colspan="4" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="teamCtrl.pageSize"
                            ng-options="entry for entry in teamCtrl.entries" ng-change="teamCtrl.currentPage = 1"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <ul uib-pagination total-items="teamCtrl.filteredItems.length" items-per-page="teamCtrl.pageSize"
                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="teamCtrl.currentPage"
                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
