<div class="col-sm-12 job-description" ng-controller="EditGroupSettingController as editGroupCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb float-left">
            <li data-translate="JobDescription"></li>
            <li class="current">
                <span ng-if="editGroupCtrl.permission === editGroupCtrl.policy.Host" data-translate="Edit"></span>
                <span ng-if="editGroupCtrl.permission !== editGroupCtrl.policy.Host" data-translate="Details"></span>
            </li>
        </ul>
        <button ng-click="editGroupCtrl.backToList()" class="btn btn-cancel">
            <span class="glyphicon glyphicon-menu-left"></span> <span data-translate="BackToList"></span>
        </button>
    </div>
    <form class="employee-info">
        <div class="row">
            <div class="col-sm-6">
                <div class="col-sm-2" data-translate="Code"></div>
                <div class="col-sm-4"><strong ng-bind="editGroupCtrl.settingInfo.Code"></strong></div>
                <div class="col-sm-2" data-translate="Section"></div>
                <div class="col-sm-4"><strong ng-bind="editGroupCtrl.settingInfo.Name"></strong></div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="col-sm-2" data-translate="JobLevel"></div>
                <div class="col-sm-4">
                    <select class="form-control select-form" ng-model="editGroupCtrl.jobLevelId"
                            ng-options="item.JobLevelId as item.Name for item in editGroupCtrl.jobLevels"
                            ng-change="editGroupCtrl.handleChangeJobLevel()">
                    </select>
                </div>
            </div>
        </div>
    </form>
    <table class="table table-bordered table-striped table-hover" id="tblGroup" ng-if="editGroupCtrl.jobLevels.length > 0">
        <thead>
            <tr class="header-table" ng-if="editGroupCtrl.permission === editGroupCtrl.policy.Host">
                <th colspan="4">
                    <a class="pull-left button-icon create-button" ng-click="editGroupCtrl.createDescriptionGroupItem()">
                        <span class="glyphicon glyphicon-plus icon-add"></span>
                        <span class="button-text" data-translate="CreateDesciptionGroup"></span>
                    </a>
                </th>
            </tr>
            <tr>
                <th></th>
                <th data-translate="Description"></th>
                <th data-translate="Action" ng-if="editGroupCtrl.permission === editGroupCtrl.policy.Host"></th>
                <th class="middle-align" data-translate="Priority"></th>
            </tr>
        </thead>
        <tbody ng-repeat="groupItem in editGroupCtrl.settingInfo.GroupItems" list-sortable>
            <tr class="row-highlight unsortable">
                <td class="text-center">
                    <input type="checkbox" ng-model="groupItem.IsSelectedAll"
                           ng-disabled="editGroupCtrl.permission !== editGroupCtrl.policy.Host"
                           ng-click="editGroupCtrl.handleSelectAllGroupItem(groupItem.IsSelectedAll, groupItem)" />
                </td>
                <td><strong ng-bind="groupItem.Name"></strong></td>
                <td class="text-center" ng-if="editGroupCtrl.permission === editGroupCtrl.policy.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" href=""
                       ng-click="editGroupCtrl.editDescriptionGroupItem(groupItem)" ng-attr-title='{{"Edit" | translate}}'></a>
                    <a class="glyphicon glyphicon-remove icon-remove" href=""
                       ng-click="editGroupCtrl.deleteDescriptionGroupItem(groupItem)" ng-attr-title='{{"Delete" | translate}}'></a>
                    <a class="glyphicon glyphicon-plus icon-add" href=""
                       ng-click="editGroupCtrl.createDescriptionItem(groupItem.GroupItemId)" title="Add Descripton Item"></a>
                </td>
                <td></td>
            </tr>
            <tr class="row-data" ng-repeat="item in groupItem.Items">
                <td class="text-center" group-id="{{groupItem.groupItemId}}" item-id="{{item.ItemId}}">
                    <input class="check-group" type="checkbox" ng-model="item.IsSelected"
                           ng-disabled="editGroupCtrl.permission !== editGroupCtrl.policy.Host"
                           ng-click="editGroupCtrl.handleSelectItem(groupItem)" />
                </td>
                <td ng-bind="item.Name"></td>
                <td class="text-center" ng-if="editGroupCtrl.permission === editGroupCtrl.policy.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" href=""
                       ng-click="editGroupCtrl.editDescriptionItem(item)" ng-attr-title='{{"Edit" | translate}}'></a>
                    <a class="glyphicon glyphicon-remove icon-remove" href=""
                       ng-click="editGroupCtrl.deleteDescriptionItem(item)" ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
                <td class="text-center priority-limit">
                    <a href="javascript:;" title="Top" class="glyphicon glyphicon-open groupTop" move-group-row> | </a>
                    <a href="javascript:;" title="Move Up" class="glyphicon glyphicon-arrow-up groupUp" move-group-row> | </a>
                    <a href="javascript:;" title="Move Down" class="glyphicon glyphicon-arrow-down groupDown" move-group-row> | </a>
                    <a href="javascript:;" title="Bottom" class="glyphicon glyphicon-save groupBottom" move-group-row></a>
                </td>
            </tr>
        </tbody>
        <tbody ng-if="editGroupCtrl.settingInfo.GroupItems.length === 0">
            <tr>
                <td class="empty-result" colspan="4" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
    </table>
    <div class="navbar navbar-default navbar-fixed-bottom action-section" ng-if="editGroupCtrl.permission === editGroupCtrl.policy.Host">
        <div class="container text-center">
            <button class="btn btn-primary" ng-click="editGroupCtrl.save()" data-translate="Save"></button>
        </div>
    </div>
</div>
