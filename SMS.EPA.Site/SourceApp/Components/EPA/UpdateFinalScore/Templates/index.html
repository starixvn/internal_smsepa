﻿<div ng-controller="UpdateFinalScoreController as updateCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="UpdateFinalScore"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row form-horizontal filter">
            <div class="form-group">
                <div class="required">
                    <label class="col-sm-1 control-label" data-translate="Period"></label>
                    <div class="col-sm-2">
                        <select class="form-control" ng-model="updateCtrl.filter.periodId"
                                ng-options="opt.PeriodId as opt.Name for opt in updateCtrl.periods">
                            <option style="display: none" value="">-- {{"All" | translate}} --</option>
                        </select>
                    </div>
                </div>
                <label class="col-sm-1 control-label" data-translate="Section"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="updateCtrl.filter.groupId"
                            ng-options="opt.GroupId as opt.GroupName for opt in updateCtrl.groups">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Employee"></label>
                <div class="col-sm-2">
                    <input class="form-control" type="text" placeholder="full name or nick name"
                           ng-model="updateCtrl.searchEmployee" epa-search-auto-complete search-employees="updateCtrl.getEmployee()"
                           ng-change="updateCtrl.unSelectEmployee()" employee="updateCtrl.filter.employee" />
                </div>
                <div class="col-sm-1">
                    <button class="btn btn-primary" ng-click="updateCtrl.getEPAToUpdateFinalScore(updateCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-12">
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table">
                    <th colspan="8">
                        <button class="btn btn-primary pull-left" style="margin: 5px;"
                                ng-show="updateCtrl.filteredItems.length > 0" ng-click="updateCtrl.updateFinalScore()" data-translate="Update"></button>
                        <input type="text" ng-model="updateCtrl.searchKey" ng-change="updateCtrl.search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th>
                        <input type="checkbox" ng-click="updateCtrl.checkAll(updateCtrl.selectedAll)" ng-model="updateCtrl.selectedAll" />
                    </th>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="Code"></th>
                    <th data-translate="NickName"></th>
                    <th data-translate="FullName"></th>
                    <th data-translate="Section"></th>
                    <th data-translate="OldFinalScore"></th>
                    <th data-translate="NewFinalScore"></th>
                </tr>
            </thead>
            <tbody>
                <tr dir-paginate="epaInfo in updateCtrl.filteredItems | itemsPerPage: updateCtrl.pageSize" current-page="updateCtrl.currentPage">
                    <td class="text-center">
                        <input type="checkbox" ng-model="epaInfo.Selected" ng-click="updateCtrl.syncSelectedEPA(epaInfo.EPAId, epaInfo.Selected)" />
                    </td>
                    <td class="text-center" ng-bind="updateCtrl.getIndex($index, updateCtrl.currentPage, updateCtrl.pageSize)"></td>
                    <td ng-bind="epaInfo.Employee.Code"></td>
                    <td ng-bind="epaInfo.Employee.NickName"></td>
                    <td ng-bind="epaInfo.Employee.FullName"></td>
                    <td ng-bind="epaInfo.Employee.GroupName"></td>
                    <td class="text-center">
                        <span ng-show="epaInfo.FinalScore.length > 0" ng-bind="epaInfo.FinalScore | customScore"></span>
                        <span ng-show="epaInfo.FinalScore.length == 0" ng-translate="NotAvailable"></span>
                    </td>
                    <td class="text-center">
                        <span ng-show="epaInfo.NewFinalScore" ng-bind="epaInfo.NewFinalScore | customScore"></span>
                    </td>
                </tr>
                <tr ng-show="!updateCtrl.filteredItems || updateCtrl.filteredItems.length == 0">
                    <td class="empty-result" colspan="8" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot ng-show="updateCtrl.filteredItems.length > 0">
                <tr>
                    <td colspan="8" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="updateCtrl.pageSize"
                                ng-options="entry for entry in updateCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
