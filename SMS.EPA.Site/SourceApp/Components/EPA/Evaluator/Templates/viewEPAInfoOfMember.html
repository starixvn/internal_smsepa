<div class="modal-header">
    <div class="popup-header">
        {{"MemberEPA" | translate}}
        <span class="close-popup" ng-click="memberEPAInfoCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body member-epa-info-modal">
    <form class="epa-form">
        <div class="col-sm-12 list-group-item bottom-buffer" ng-init="memberEPAInfoCtrl.collapses['GeneralInfo'] = false;">
            <div class="boxtitle" data-translate="GeneralInfo"
                 ng-click="memberEPAInfoCtrl.collapses['GeneralInfo'] = !memberEPAInfoCtrl.collapses['GeneralInfo']"></div>
            <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['GeneralInfo']"
                 ng-include src="'/SourceApp/Components/EPA/Templates/generalInformation.html'"></div>
        </div>
        <div class="col-sm-12 list-group-item">
            <div class="list-kpi-rating" ng-repeat="kpiGroup in memberEPAInfoCtrl.epaInfo.KPIGroups"
                 ng-init="memberEPAInfoCtrl.collapses[kpiGroup.Name] = true;"
                 ng-if="kpiGroup.KPIs.length > 0">
                <div class="boxtitle col-sm-12"
                     ng-click="memberEPAInfoCtrl.collapses[kpiGroup.Name] = !memberEPAInfoCtrl.collapses[kpiGroup.Name]">
                    <div class="col-sm-7 kpiGroup-name">{{kpiGroup.Name}} ({{kpiGroup.Weight}} pts)</div>
                    <div class="col-sm-3 text-center" data-translate="Rate"></div>
                    <div class="col-sm-2 text-center" data-translate="Enter pts"></div>
                </div>
                <div class="boxcontent col-sm-12" collapse="memberEPAInfoCtrl.collapses[kpiGroup.Name]">
                    <div class="row row-item" ng-repeat="kpi in kpiGroup.KPIs">
                        <div class="row kpi-name">
                            <div class="col-sm-7">
                                <span>{{$index + 1}}. {{kpi.Name}}</span>
                                <span> ({{kpi.Weight}} pts)</span>
                            </div>
                            <div class="col-sm-3 text-center list-star">
                                <rating ng-model="kpi.Rate" max="memberEPAInfoCtrl.maxStar" readonly="memberEPAInfoCtrl.isReadonly"></rating>
                                <span class="badge percent" ng-show="kpi.Percent > 0">{{kpi.Percent}}%</span>
                                <span class="badge percent" ng-show="kpi.Percent == 0" data-translate="NaN"></span>
                            </div>
                            <div class="col-sm-2">
                                <input type="text" class="form-control text-center kpi-score" maxlength="5" ng-readonly="memberEPAInfoCtrl.isReadonly"
                                       ng-model="kpi.Score" ng-value="kpi.Score" ng-decimal fraction="2" />
                            </div>
                        </div>
                        <div class="row kpi-description" ng-if="kpi.Description.length > 0">
                            <div class="col-sm-7" ng-bind="kpi.Description"></div>
                        </div>
                        <div class="row textarea-comment" ng-if="kpi.HasComment">
                            <div class="col-sm-7">
                                <textarea class="form-control" ng-model="kpi.Comment" ng-readonly="memberEPAInfoCtrl.isReadonly">
                                    {{kpi.Comment}}
                                </textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-12 list-group-item" ng-init="memberEPAInfoCtrl.collapses['Comments'] = false;">
            <div class="boxtitle" data-translate="Comments"
                 ng-click="memberEPAInfoCtrl.collapses['Comments'] = !memberEPAInfoCtrl.collapses['Comments']">
            </div>
            <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['Comments']">
                <div class="row row-item">
                    <div class="col-sm-8 textarea-comment">
                        <textarea class="form-control" ng-readonly="memberEPAInfoCtrl.isReadonly" ng-model="memberEPAInfoCtrl.epaInfo.Comment"></textarea>
                    </div>
                    <div class="col-sm-1"></div>
                    <div class="col-sm-3">
                        <div class="total text-center pull-right">
                            <p data-translate="Total"></p>
                            <p class="totalscore" ng-bind="memberEPAInfoCtrl.epaInfo.TotalScore | customNumber"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button class="btn btn-default customize" ng-click="memberEPAInfoCtrl.cancel()" data-translate="Cancel"></button>
</div>
