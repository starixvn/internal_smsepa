<div class="form-evaluator" ng-controller="EvaluatorDetailController as evaluatorDetailCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MemberEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">
                <span data-translate="EPATilte"></span>
                <span> - {{evaluatorDetailCtrl.epaInfo.Period.Name}}</span>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo">
                    <h4 class="panel-title" data-translate="GeneralInfo"></h4>
                </div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info">
                        <epa-general-infomation data-is-view-detail="evaluatorDetailCtrl.isViewDetail"
                                                data-employee-info="evaluatorDetailCtrl.epaInfo.Employee"
                                                data-evaluated-date="evaluatorDetailCtrl.evaluatedDate"
                                                data-saved="evaluatorDetailCtrl.dataSaved"></epa-general-infomation>
                    </div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".evaluationProcess">
                    <h4 class="panel-title text-uppercase" data-translate="EvaluationProcess"></h4>
                </div>
                <div class="panel-collapse collapse in evaluationProcess" auto-collapse data-collapsed="true">
                    <div class="panel-body evaluation-process-section">
                        <epa-evaluation-process data-epa-info="evaluatorDetailCtrl.epaInfo"></epa-evaluation-process>
                    </div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".ratingInstruction">
                    <h4 class="panel-title" data-translate="RatingInstruction"></h4>
                </div>
                <div class="panel-collapse collapse ratingInstruction">
                    <div class="panel-body rating-instruction-section">
                        <div><span class="note">* {{"RatingCriteria" | translate}}: </span>{{"MessageRatingInstructions" | translate}}</div>
                        <epa-rating-instruction></epa-rating-instruction>
                    </div>
                </div>
            </div>

            <div>&ensp;</div>

            <any ng-switch="evaluatorDetailCtrl.viewBySelf()">
                <any ng-switch-when="true">
                    <div ng-include src="'/SourceApp/Components/EPA/Evaluator/Templates/listKPI.html'"></div>
                </any>
                <any ng-switch-when="false">
                    <div ng-include src="'/SourceApp/Components/EPA/Evaluator/Templates/listKPIToView.html'"></div>
                </any>
            </any>

            <div>&ensp;</div>

            <div class="panel panel-default" ng-if="evaluatorDetailCtrl.epaInfo.ExtendedQuestion.SubQuestions.length">
                <div class="panel-heading" data-toggle="collapse" data-target=".extendedQuestion">
                    <h4 class="panel-title">{{evaluatorDetailCtrl.epaInfo.ExtendedQuestion.QuestionContent}}</h4>
                </div>
                <div class="row panel-collapse collapse-expanse extendedQuestion">
                    <div class="panel-body" ng-repeat="question in evaluatorDetailCtrl.epaInfo.ExtendedQuestion.SubQuestions">
                        <div class="error-message">
                            <span ng-show="question.IsInvalid" data-translate="RequiredEvaluation"></span>
                        </div>
                        <div class="col-md-12">
                            <span>{{$index + 1}}. {{question.SubQuestionContent}}</span>
                        </div>
                        <div class="col-md-12">
                            <div class="col-md-1">
                                <label>
                                    <input type="radio" ng-model="question.IsAgree" ng-value="true" disabled/>
                                    Yes
                                </label>
                            </div>
                            <div class="col-md-1">
                                <label>
                                    <input type="radio" ng-model="question.IsAgree" ng-value="false" disabled/>
                                    No
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>&ensp;</div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".summary">
                    <h4 class="panel-title" data-translate="Summary"></h4>
                </div>
                <div class="panel-collapse collapse in summary">
                    <div class="panel-body summary-section" ng-include src="'/SourceApp/Components/EPA/Evaluator/Templates/summary.html'"></div>
                </div>
            </div>
        </div>
        <div ng-if="evaluatorDetailCtrl.viewBySelf()" class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="evaluatorDetailCtrl.save(evaluatorDetailCtrl.epaInfo)"
                        ng-if="evaluatorDetailCtrl.epaInfo && evaluatorDetailCtrl.epaInfo.IsAllowedToEdit" data-translate="Save"></button>
                <button class="btn btn-warning" ng-if="evaluatorDetailCtrl.viewBackButton()"
                        ng-click="evaluatorDetailCtrl.cancel()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
