<div class="form-evaluator" ng-controller="MemberEPAInfoController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MemberEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form class="epa-form">
            <div class="text-center epa-title" data-translate="EPATilte"></div>
            <div class="col-sm-12 list-group-item bottom-buffer" ng-init="memberEPAInfoCtrl.collapses['GeneralInfo'] = false;">
                <div class="boxtitle" data-translate="GeneralInfo"
                     ng-click="memberEPAInfoCtrl.collapses['GeneralInfo'] = !memberEPAInfoCtrl.collapses['GeneralInfo']"></div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['GeneralInfo']"
                     ng-include src="'/SourceApp/Components/EPA/Templates/generalInformation.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item bottom-buffer" ng-init="memberEPAInfoCtrl.collapses['RatingInstruction'] = true;">
                <div class="boxtitle" data-translate="RatingInstruction"
                     ng-click="memberEPAInfoCtrl.collapses['RatingInstruction'] = !memberEPAInfoCtrl.collapses['RatingInstruction']"></div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['RatingInstruction']">
                    <div class="row row-item">
                        <span class="note">* {{"RatingCriteria" | translate}}:</span>
                        <span data-translate="MessageRatingInstructions"></span>
                        <div ng-include src="'/SourceApp/Components/EPA/Templates/ratingInstruction.html'"></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 list-group-item">
                <div ng-include src="'/SourceApp/Components/EPA/Evaluator/Templates/listKPIRating.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item" ng-init="memberEPAInfoCtrl.collapses['Comments'] = false;">
                <div class="boxtitle" data-translate="Comments"
                     ng-click="memberEPAInfoCtrl.collapses['Comments'] = !memberEPAInfoCtrl.collapses['Comments']">
                </div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['Comments']">
                    <div class="row row-item">
                        <div class="col-sm-6 textarea-comment">
                            <div class="row col-sm-12">
                                <label class="control-label">{{"Comment by employee" | translate}}</label>
                            </div>
                            <div class="col-sm-7 textarea-comment">
                                <textarea class="form-control" ng-readonly="true" ng-model="memberEPAInfoCtrl.epaInfo.CommentBySelf"></textarea>
                            </div>
                            <div class="col-sm-4">
                                <div class="total text-center pull-right">
                                    <p data-translate="TotalRatingScore"></p>
                                    <p class="totalscore" ng-bind="memberEPAInfoCtrl.epaInfo.TotalScoreBySelf | customNumber"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 textarea-comment">
                            <div class="row col-sm-12">
                                <label class="control-label">{{"Comment by me" | translate}}</label>
                            </div>
                            <div class="row col-sm-12 error-message" ng-show="memberEPAInfoCtrl.epaInfo.CommentValid">
                                <div class="control-label" data-translate="RequireComment"></div>
                            </div>
                            <div class="col-sm-7 textarea-comment">
                                <textarea class="form-control" ng-readonly="memberEPAInfoCtrl.isReadonly"
                                          ng-model="memberEPAInfoCtrl.epaInfo.CommentByEvaluator"></textarea>
                            </div>
                            <div class="col-sm-1">
                                <label class="error-message" data-translate="(*)"></label>
                            </div>
                            <div class="col-sm-4">
                                <div class="row total text-center pull-right">
                                    <p data-translate="TotalRatingScore"></p>
                                    <p class="totalscore" ng-bind="memberEPAInfoCtrl.epaInfo.TotalScoreByEvaluator | customNumber"></p>
                                </div>
                                <div class="row total text-center pull-right">
                                    <p data-translate="AttendanceScore"></p>
                                    <p class="totalscore" ng-bind="memberEPAInfoCtrl.epaInfo.AttendanceScore | customNumber"></p>
                                </div>
                                <div class="row total text-center pull-right">
                                    <p data-translate="FinalScore"></p>
                                    <p class="totalscore" ng-bind="memberEPAInfoCtrl.finalScore | customNumber"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="boxcontent">
                    <div class="row row-item">
                        <label class="error-message">{{"Note" | translate }}: (*) {{"RequiredField" | translate}}!</label>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 epa-action-button text-center">
                <button class="button" ng-click="memberEPAInfoCtrl.save(memberEPAInfoCtrl.epaInfo)"
                        ng-if="memberEPAInfoCtrl.epaInfo && !memberEPAInfoCtrl.isReadonly" data-translate="Save"></button>
                <button class="btn btn-default customize" ng-click="memberEPAInfoCtrl.cancel()" data-translate="Cancel"></button>
            </div>
        </form>
    </div>
</div>
