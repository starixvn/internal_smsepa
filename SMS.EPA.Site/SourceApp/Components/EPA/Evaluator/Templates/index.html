<div class="evaluator" ng-controller="EvaluatorController as evaluatorCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="Evaluation"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Section"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="evaluatorCtrl.filter.groupId"
                            ng-options="opt.GroupId as opt.GroupName for opt in evaluatorCtrl.groupOptions"
                            ng-change="evaluatorCtrl.getMember(evaluatorCtrl.filter.groupId)">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Employee"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.members" button-label="EmployeeId"
                                              helper-elements="all reset filter" item-label="FullName" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <div class="col-sm-1">
                    <button class="button" ng-click="evaluatorCtrl.query(evaluatorCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="PeriodName"></th>
                    <th data-translate="Department"></th>
                    <th data-translate="Section"></th>
                    <th data-translate="NickName"></th>
                    <th data-translate="FullName"></th>
                    <th data-translate="JobTitle"></th>
                    <th data-translate="StartDate"></th>
                    <th data-translate="EndDate"></th>
                    <th data-translate="Action" class="col-action"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="memberEPA in evaluatorCtrl.memberEPAs">
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td ng-bind="memberEPA.Period.Name"></td>
                    <td ng-bind="memberEPA.Department.Name"></td>
                    <td class="text-center">
                        <span tooltip="{{memberEPA.Group.GroupName}}" ng-bind="memberEPA.Group.GroupCode"></span>
                    </td>
                    <td class="text-center" ng-bind="memberEPA.Employee.NickName"></td>
                    <td ng-bind="memberEPA.Employee.FullName"></td>
                    <td ng-bind="memberEPA.JobTitle.JobTitleName"></td>
                    <td class="text-center">{{ memberEPA.ProcessByEvaluators[0].StartDate | customDate }}</td>
                    <td class="text-center">{{ memberEPA.ProcessByEvaluators[0].EndDate | customDate }}</td>
                    <td class="text-center text-uppercase col-action">
                        <a class="evaluate-now button" href="" ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPADetailUrl}}"
                           ng-show="!memberEPA.ProcessByEvaluators[0].IsEndProcess && memberEPA.Status.StatusId == 0">
                            <span data-translate="EvaluateNow"></span>
                            <span class="glyphicon icon-breadcrumb"></span>
                        </a>
                        <a class="evaluate-now button" href="" ng-click="evaluatorCtrl.viewEPAResult(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPAResultUrl}}"
                           ng-show="memberEPA.ProcessByEvaluators[0].IsEndProcess && memberEPA.Status.StatusId == 0">
                            <span data-translate="View"></span>
                            <span class="glyphicon glyphicon-search"></span>
                        </a>
                    </td>
                </tr>
                <tr ng-show="evaluatorCtrl.memberEPAs.length == 0">
                    <td class="empty-result" colspan="11" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
