<div class="evaluator" ng-controller="EvaluatorController as evaluatorCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="Evaluation"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="From"></label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="evaluatorCtrl.filter.fromDate" datepicker-popup="{{evaluatorCtrl.dateFormat}}"
                           ng-click="evaluatorCtrl.openPopupStartDate($event, evaluatorCtrl.calendar.startDateOpened)"
                           is-open="evaluatorCtrl.calendar.startDateOpened" />
                    <calendar-image class="calendar-image"
                                    ng-click="evaluatorCtrl.openPopupStartDate($event, evaluatorCtrl.calendar.startDateOpened)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="To"></label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="evaluatorCtrl.filter.toDate" datepicker-popup="{{evaluatorCtrl.dateFormat}}"
                           ng-click="evaluatorCtrl.openPopupEndDate($event, evaluatorCtrl.calendar.endDateOpened)"
                           is-open="evaluatorCtrl.calendar.endDateOpened" />
                    <calendar-image class="calendar-image"
                                    ng-click="evaluatorCtrl.openPopupEndDate($event, evaluatorCtrl.calendar.endDateOpened)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="Target"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="evaluatorCtrl.filter.targetTypeId"
                            ng-options="opt.TargetTypeId as opt.Name for opt in evaluatorCtrl.targetTypes">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Team"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="evaluatorCtrl.filter.groupId"
                            ng-options="opt.GroupId as opt.GroupName for opt in evaluatorCtrl.groupOptions"
                            ng-change="evaluatorCtrl.getMember(evaluatorCtrl.filter.groupId)">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Employee"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.members" button-label="EmployeeId"
                                              helper-elements="all reset filter" item-label="FullName" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 control-label" data-translate="Status"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="evaluatorCtrl.filter.status"
                            ng-options="opt.StatusId as opt.Name for opt in evaluatorCtrl.statusList">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <div class="col-sm-1">
                    <button class="button" ng-click="evaluatorCtrl.query(evaluatorCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
            <th data-translate="SymbolCount"></th>
            <th data-translate="Team"></th>
            <th data-translate="Employee"></th>
            <th data-translate="Target"></th>
            <th data-translate="SelfEvaluationScore" class="col-score"></th>
            <th data-translate="EvaluationScore" class="col-score"></th>
            <th data-translate="EvaluationStatus" class="col-evaluation-status"></th>
            <th data-translate="EvaluationDate" class="col-evaluate-date"></th>
            <th data-translate="Action" class="col-action"></th>
            </thead>
            <tbody>
                <tr ng-repeat="memberEPA in evaluatorCtrl.memberEPAs">
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td class="text-center">
                        <span tooltip="{{memberEPA.Group.GroupName}}" ng-bind="memberEPA.Group.GroupCode"></span>
                    </td>
                    <td>{{memberEPA.Employee.FullName}} ({{memberEPA.Employee.NickName}})</td>
                    <td class="text-center" ng-bind="memberEPA.TargetType.Name"></td>
                    <td class="text-center col-score">
                        <a href="" ng-bind="memberEPA.SelfEvaluationScore | customNumber" ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPADetailUrl}}" ng-if="memberEPA.SelfEvaluationScore" />
                        <a href="" ng-bind="'N/A'" ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPADetailUrl}}" ng-if="!memberEPA.SelfEvaluationScore" />
                    </td>
                    <td class="text-center col-score">
                        <a href="" ng-bind="memberEPA.EvaluationScore | customNumber" ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPADetailUrl}}" ng-if="memberEPA.EvaluationScore" />
                        <a href="" ng-bind="'N/A'" ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPADetailUrl}}" ng-if="!memberEPA.EvaluationScore" />
                    </td>
                    <td class="text-center col-evaluation-status">
                        <span class="dropdown" dropdown on-toggle="evaluatorCtrl.toggled(open)">
                            <a href="javascript:;" class="changeStatus" dropdown-toggle>{{memberEPA.Status.Name}}</a>
                            <ul class="dropdown-menu dropdown-menu-width">
                                <li ng-repeat="item in evaluatorCtrl.epaStatus | filter:{ Name: '!' + memberEPA.Status.Name }">
                                    <a ng-click="evaluatorCtrl.updateStatusEPA(memberEPA, item)" href="javascript:;">{{item.Name}}</a>
                                </li>
                            </ul>
                        </span>
                    </td>
                    <td class="text-center col-evaluate-date">{{ memberEPA.EvaluateDate | customDate }}</td>
                    <td class="text-center text-uppercase col-action">
                        <a class="evaluate-now button" href="" ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{evaluatorCtrl.viewEPADetailUrl}}">
                            <span data-translate="EvaluateNow"></span>
                            <span class="glyphicon icon-breadcrumb"></span>
                        </a>
                    </td>
                </tr>
                <tr ng-if="evaluatorCtrl.memberEPAs.length == 0">
                    <td class="empty-result" colspan="9" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
