<div class="showRatingScoreByStar" ng-show="memberEPAInfoCtrl.hasRatingByStar">
    <div class="checkbox">
        <label>
            <input type="checkbox" ng-model="memberEPAInfoCtrl.showRatingScoreByStar" /> {{"ShowRatingScoreByStar" | translate}}
        </label>
    </div>
</div>
<div class="list-kpi-rating rating-section evaluator-container" ng-repeat="kpiGroup in memberEPAInfoCtrl.epaInfo.KPIGroups"
     ng-show="kpiGroup.KPIs.length > 0">

    <div class="panel panel-default">
        <div class="panel-heading" data-toggle="collapse" data-target=".kpiGroup-{{$index}}">
            <div class="panel-title">
                <div class="kpiGroup-name">{{kpiGroup.Name}} <strong>({{kpiGroup.Weight | customScore}} pts)</strong></div>
                <div class="text-center employee-score" data-translate="EmployeeScore"></div>
                <div class="text-center employee-score" data-translate="EvaluatorScore"></div>
            </div>
        </div>
        <div class="panel-collapse collapse in kpiGroup-{{$index}}">
            <div class="panel-body kpiGroup-box">
                <div class="row-item" ng-repeat="kpi in kpiGroup.KPIs" repeat-end="memberEPAInfoCtrl.generateRatingStar()">
                    <div class="col-sm-12 error-message" ng-show="kpi.CurrentEvaluation.EvaluateInvalid" data-translate="RequiredEvaluation"></div>
                    <div class="col-sm-12 kpi-name">
                        <div class="row">
                            <div class="feature">
                                <span>{{$index + 1}}. {{kpi.Name}}</span>
                                <strong ng-show="kpiGroup.NumberKPIOptional == 0"> ({{kpi.Weight | splitScore}} pts)</strong>
                                <label class="note" ng-show="kpi.IsRequiredEvaluate" data-translate="(*)"></label>
                            </div>
                            <div class="employee-score">
                                <div ng-show="kpi.EvaluationBySelf.Score && memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess">
                                    <span>{{kpi.EvaluationBySelf.Score | splitScore}} pts</span>
                                    <div class="score-star-rating" ng-show="memberEPAInfoCtrl.showRatingScoreByStar &&
                                        (memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Star
                                        || memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.HalfStar
                                        || (memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Score && kpiGroup.NumberKPIOptional > 0))">
                                        / <span ng-show="kpi.EvaluationBySelf.Rate || kpi.EvaluationBySelf.Rate == 0"
                                                ng-bind="kpi.EvaluationBySelf.Rate | splitScore"></span>
                                        <input type="number" class="rating-loading" ng-readonly="true" data-size="xs"
                                               value="1" data-min="0" data-max="1" data-stars="1"
                                               data-show-caption="false" data-show-clear="false">
                                    </div>
                                </div>
                                <span ng-show="!kpi.EvaluationBySelf.Score && memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess" ng-bind="'0'"></span>
                                <strong ng-show="!memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess" data-translate="Pending"></strong>
                            </div>
                            <div class="kpi-start">
                                <div class="rating-by-star" ng-if="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Star
                                    || (memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Score && kpiGroup.NumberKPIOptional > 0)">
                                    <div class="remove-rating">
                                        <a ng-show="memberEPAInfoCtrl.epaInfo.IsAllowedToEdit && kpi.CurrentEvaluation.Rate > 0"
                                           class="glyphicon glyphicon-remove-circle remove-star"
                                           title="Cancel" href="javascript:;" ng-click="memberEPAInfoCtrl.cancelRating(kpiGroup, kpi)"></a>
                                    </div>
                                    <div class="rating-form">
                                        <input id="star_{{kpi.KPIId}}" type="number" class="rating-loading" ng-readonly="!memberEPAInfoCtrl.epaInfo.IsAllowedToEdit" data-size="xs"
                                               data-min=0 data-max={{memberEPAInfoCtrl.maxStar}} data-step=1 ng-model="kpi.CurrentEvaluation.Rate"
                                               data-show-caption="false" data-show-clear="false"
                                               ng-change="memberEPAInfoCtrl.hoveringLeave(kpiGroup, kpi)">
                                    </div>
                                </div>
                                <div ng-if="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Score && kpiGroup.NumberKPIOptional == 0" class="rating-by-score">
                                    <input type="text" maxlength="5" class="form-control text-center kpi-score" ng-readonly="!memberEPAInfoCtrl.epaInfo.IsAllowedToEdit"
                                           ng-show="kpiGroup.NumberKPIOptional == 0" ng-model="kpi.CurrentEvaluation.Score" numeric decimals="2"
                                           ng-change="memberEPAInfoCtrl.inputScore(kpi)" tooltip="{{memberEPAInfoCtrl.getNotificationInputScore(kpi)}}"
                                           tooltip-trigger="focus" />
                                </div>
                                <div class="rating-by-star" ng-if="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.HalfStar">
                                    <div class="remove-rating">
                                        <a ng-show="memberEPAInfoCtrl.epaInfo.IsAllowedToEdit && kpi.CurrentEvaluation.Rate > 0"
                                           class="glyphicon glyphicon-remove-circle remove-star"
                                           title="Cancel" href="javascript:;" ng-click="memberEPAInfoCtrl.cancelRating(kpiGroup, kpi)"></a>
                                    </div>
                                    <div class="rating-form">
                                        <input id="star_{{kpi.KPIId}}" type="number" class="rating-loading" ng-readonly="!memberEPAInfoCtrl.epaInfo.IsAllowedToEdit" data-size="xs"
                                               data-min=0 data-max={{memberEPAInfoCtrl.maxStar}} data-step=0.5 ng-model="kpi.CurrentEvaluation.Rate"
                                               data-show-caption="false" data-show-clear="false"
                                               ng-change="memberEPAInfoCtrl.hoveringLeave(kpiGroup, kpi)">
                                    </div>
                                </div>
                            </div>
                            <div class="kpi-percent" ng-show="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Star
                                || memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.HalfStar
                                || (memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == memberEPAInfoCtrl.ratingTypeEnum.Score && kpiGroup.NumberKPIOptional > 0)">
                                <span class="badge percent" ng-show="kpiGroup.NumberKPIOptional == 0 && kpi.CurrentEvaluation.Rate > 0">
                                    {{kpi.CurrentEvaluation.Score | splitScore}} pts
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="row kpi-description" ng-show="kpi.Description.length > 0">
                        <div class="col-sm-8" ng-bind="kpi.Description"></div>
                    </div>
                    <div class="row kpi-comment comment-by-employee" ng-show="kpi.HasComment">
                        <div>
                            <div class="control-label" data-translate="CommentByEmployee"></div>
                            <div class="collapse-expanse" ng-init="memberEPAInfoCtrl.initCollapseExpandCommentByEmployee(memberEPAInfoCtrl.epaInfo, kpi)">
                                <a class="icon-minus" href="" ng-show="kpi.ExpandedCommentByEmployee"
                                   ng-click="kpi.ExpandedCommentByEmployee = !kpi.ExpandedCommentByEmployee" ng-attr-title='{{"Collapse comment" | translate}}'></a>
                                <a class="icon-plus" href="" ng-show="!kpi.ExpandedCommentByEmployee"
                                   ng-click="kpi.ExpandedCommentByEmployee = !kpi.ExpandedCommentByEmployee" ng-attr-title='{{"Expand comment" | translate}}'></a>
                            </div>
                        </div>
                        <div class="textarea" ng-show="kpi.ExpandedCommentByEmployee">
                            <textarea class="form-control" ng-model="kpi.EvaluationBySelf.Comment"
                                      ng-show="memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess" ng-readonly="true"></textarea>
                            <textarea class="form-control" ng-show="!memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess" ng-readonly="true"></textarea>
                        </div>
                    </div>
                    <div class="row kpi-comment comment-by-evaluator" ng-show="kpi.HasComment">
                        <div>
                            <div class="control-label" data-translate="CommentByEvaluator"></div>
                            <div class="collapse-expanse" ng-init="kpi.ExpandedCommentByEvaluator = true;">
                                <a class="icon-minus" href="" ng-show="kpi.ExpandedCommentByEvaluator"
                                   ng-click="kpi.ExpandedCommentByEvaluator = !kpi.ExpandedCommentByEvaluator" ng-attr-title='{{"Collapse comment" | translate}}'></a>
                                <a class="icon-plus" href="" ng-show="!kpi.ExpandedCommentByEvaluator"
                                   ng-click="kpi.ExpandedCommentByEvaluator = !kpi.ExpandedCommentByEvaluator" ng-attr-title='{{"Expand comment" | translate}}'></a>
                            </div>
                        </div>
                        <div ng-show="kpi.ExpandedCommentByEvaluator">
                            <div class="error-message" ng-show="kpi.CurrentEvaluation.CommentInvalid && kpi.HasComment && kpi.IsRequiredComment"
                                 data-translate="RequiredComment"></div>
                            <div class="error-message" ng-show="kpi.CurrentEvaluation.CommentInvalid && kpi.HasComment && !kpi.IsRequiredComment"
                                 data-translate="RequiredCommentForRatingMaxScore"></div>
                            <div class="textarea">
                                <textarea class="form-control" maxlength="2000"
                                          ng-model="kpi.CurrentEvaluation.Comment"
                                          ng-readonly="!memberEPAInfoCtrl.epaInfo.IsAllowedToEdit"></textarea>
                            </div>
                            <div class="note" data-translate="(*)" ng-show="kpi.HasComment && kpi.IsRequiredComment"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
