<div class="list-kpi-rating rating-section evaluator-container" ng-repeat="kpiGroup in memberEPAInfoCtrl.epaInfo.KPIGroups"
     ng-init="memberEPAInfoCtrl.collapses[kpiGroup.Name] = false;"
     ng-show="kpiGroup.KPIs.length > 0">
    <div class="boxtitle col-sm-12"
         ng-click="memberEPAInfoCtrl.collapses[kpiGroup.Name] = !memberEPAInfoCtrl.collapses[kpiGroup.Name]">
        <div class="kpiGroup-name">{{kpiGroup.Name}} <strong>({{kpiGroup.Weight | customScore}} pts)</strong></div>
        <div class="text-center employee-score" data-translate="EmployeeScore"></div>
    </div>
    <div class="kpiGroup-box col-sm-12" collapse="memberEPAInfoCtrl.collapses[kpiGroup.Name]">
        <div class="row-item" ng-repeat="kpi in kpiGroup.KPIs">
            <div class="col-sm-12 error-message" ng-show="kpi.CurrentEvaluation.EvaluateInvalid" data-translate="RequiredEvaluation"></div>
            <div class="col-sm-12 kpi-name">
                <div class="row">
                    <div class="feature">
                        <span>{{$index + 1}}. {{kpi.Name}}</span>
                        <strong ng-show="kpiGroup.NumberKPIOptional == 0"> ({{kpi.Weight | customScore}} pts)</strong>
                        <label class="note" ng-show="kpi.IsRequiredEvaluate" data-translate="(*)"></label>
                    </div>
                    <div class="employee-score">
                        <strong ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-bind="kpi.EvaluationBySelf.Score | customScore"></strong>
                        <strong ng-show="!memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-bind="'N/A'"></strong>
                    </div>
                    <div class="kpi-start">
                        <div ng-show="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == 1 || (memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == 2 && kpiGroup.NumberKPIOptional > 0)" class="rating-by-star">
                            <div class="remove-rating">
                                <a ng-show="!memberEPAInfoCtrl.isReadonly && kpi.CurrentEvaluation.Rate > 0" class="glyphicon glyphicon-remove-circle remove-star"
                                   title="Cancel" href="javascript:;" ng-click="memberEPAInfoCtrl.cancelRating(kpiGroup, kpi)"></a>
                            </div>
                            <div class="rating">
                                <rating ng-model="kpi.CurrentEvaluation.Rate" max="memberEPAInfoCtrl.maxStar" readonly="memberEPAInfoCtrl.isReadonly"
                                        on-leave="memberEPAInfoCtrl.hoveringLeave(kpiGroup, kpi)"></rating>
                            </div>
                            <div ng-show="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == 2 && kpiGroup.NumberKPIOptional == 0" class="col-sm-2">
                                <div class="col-sm-12">
                                    <input type="text" class="form-control text-center kpi-score" ng-readonly="memberEPAInfoCtrl.isReadonly"
                                           ng-show="kpiGroup.NumberKPIOptional == 0" ng-model="kpi.CurrentEvaluation.Score" numeric decimals="2"
                                           ng-change="memberEPAInfoCtrl.inputScore(kpi)" tooltip="{{memberEPAInfoCtrl.getNotificationInputScore(kpi)}}" tooltip-trigger="focus" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="kpi-percent" ng-show="memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId == 1 || (memberEPAInfoCtrl.epaInfo.RatingType.RatingTypeId ==2 && kpiGroup.NumberKPIOptional > 0)">
                        <span class="badge percent" ng-show="kpiGroup.NumberKPIOptional == 0 && kpi.CurrentEvaluation.Rate > 0">{{kpi.CurrentEvaluation.Score | customScore}} pts</span>
                    </div>
                </div>
            </div>
            <div class="row kpi-description" ng-show="kpi.Description.length > 0">
                <div class="col-sm-8" ng-bind="kpi.Description"></div>
            </div>
            <div class="row kpi-comment comment-by-employee" ng-show="kpi.HasComment">
                <div>
                    <div class="control-label" data-translate="CommentByEmployee"></div>
                    <div class="collapse-expanse" ng-init="kpi.ExpandedCommentByEmployee = false;">
                        <a class="icon-minus" href="" ng-show="kpi.ExpandedCommentByEmployee"
                           ng-click="kpi.ExpandedCommentByEmployee = !kpi.ExpandedCommentByEmployee" ng-attr-title='{{"Collapse comment" | translate}}'></a>
                        <a class="icon-plus" href="" ng-show="!kpi.ExpandedCommentByEmployee"
                           ng-click="kpi.ExpandedCommentByEmployee = !kpi.ExpandedCommentByEmployee" ng-attr-title='{{"Expand comment" | translate}}'></a>
                    </div>
                </div>
                <div class="textarea" ng-show="kpi.ExpandedCommentByEmployee">
                    <textarea class="form-control" ng-model="kpi.EvaluationBySelf.Comment" ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-readonly="true"></textarea>
                    <textarea class="form-control" ng-show="!memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-readonly="true">N/A</textarea>
                </div>
            </div>
            <div class="row kpi-comment comment-by-evaluator" ng-show="kpi.HasComment">
                <div>
                    <div class="control-label" data-translate="CommentByEvaluator"></div>
                    <div class="collapse-expanse" ng-init="kpi.ExpandedCommentByEvaluator = true;">
                        <a class="icon-minus" href="" ng-show="kpi.ExpandedCommentByEvaluator"
                           ng-click="kpi.ExpandedCommentByEvaluator = !kpi.ExpandedCommentByEvaluator" ng-attr-title='{{"Collapse comment" | translate}}'></a>
                        <a class="icon-plus" href="" ng-show="!kpi.ExpandedCommentByEvaluator"
                           ng-click="kpi.ExpandedCommentByEvaluator = !kpi.ExpandedCommentByEvaluator" ng-attr-title='{{"Expand comment" | translate}}'></a>
                    </div>
                </div>
                <div ng-show="kpi.ExpandedCommentByEvaluator">
                    <div class="error-message" ng-show="kpi.CurrentEvaluation.CommentInvalid && kpi.HasComment && kpi.IsRequiredComment" data-translate="RequiredComment"></div>
                    <div class="error-message" ng-show="kpi.CurrentEvaluation.CommentInvalid && kpi.HasComment && !kpi.IsRequiredComment" data-translate="RequiredCommentForMaxScoreRating"></div>
                    <div class="textarea">
                        <textarea class="form-control" ng-model="kpi.CurrentEvaluation.Comment" ng-readonly="memberEPAInfoCtrl.isReadonly"></textarea>
                    </div>
                    <div class="note" data-translate="(*)" ng-show="kpi.HasComment && kpi.IsRequiredComment"></div>
                </div>
            </div>
        </div>
    </div>
</div>
