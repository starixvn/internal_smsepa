<div class="list-kpi-rating" ng-repeat="kpiGroup in memberEPAInfoCtrl.epaInfo.KPIGroups"
     ng-init="memberEPAInfoCtrl.collapses[kpiGroup.Name] = false;"
     ng-show="kpiGroup.KPIs.length > 0">
    <div class="boxtitle col-sm-12"
         ng-click="memberEPAInfoCtrl.collapses[kpiGroup.Name] = !memberEPAInfoCtrl.collapses[kpiGroup.Name]">
        <div class="col-sm-7 kpiGroup-name">{{kpiGroup.Name}} <strong>({{kpiGroup.Weight | customScore}} pts)</strong></div>
        <div class="col-sm-1 text-center employee-score" data-translate="EmployeeScore"></div>
        <div class="col-sm-2 text-center" data-translate="EvaluatorRating"></div>
        <div class="col-sm-2 text-center title-score" ng-show="kpiGroup.TotalKPIOptional == 0" data-translate="EvaluatorScore"></div>
    </div>
    <div class="boxcontent col-sm-12" collapse="memberEPAInfoCtrl.collapses[kpiGroup.Name]">
        <div class="row row-item" ng-repeat="kpi in kpiGroup.KPIs">
            <div class="row col-sm-12 error-message" ng-show="kpi.CurrentEvaluation.EvaluateValid" data-translate="RequireEvaluate"></div>
            <div class="row kpi-name">
                <div class="col-sm-7">
                    <span>{{$index + 1}}. {{kpi.Name}}</span>
                    <strong ng-show="kpiGroup.TotalKPIOptional == 0"> ({{kpi.Weight | customScore}} pts)</strong>
                    <label class="note" ng-show="kpi.IsRequiredEvaluate" data-translate="(*)"></label>
                </div>
                <div class="col-sm-1 text-center employee-score">
                    <strong ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-bind="kpi.EvaluationBySelf.Score | customScore"></strong>
                    <strong ng-show="!memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-bind="'N/A'"></strong>
                </div>
                <div class="col-sm-2 text-center list-star">
                    <div class="col-sm-2 cancel-rating">
                        <a ng-show="!memberEPAInfoCtrl.isReadonly && kpi.CurrentEvaluation.Rate > 0" class="glyphicon glyphicon-remove-circle remove-star"
                           title="Cancel" href="javascript:;" ng-click="memberEPAInfoCtrl.cancelRating(kpiGroup, kpi)"></a>
                    </div>
                    <div class="col-sm-7 rating">
                        <rating ng-model="kpi.CurrentEvaluation.Rate" max="memberEPAInfoCtrl.maxStar" readonly="memberEPAInfoCtrl.isReadonly"
                                on-hover="memberEPAInfoCtrl.hoveringOver(value, kpi)"
                                on-leave="memberEPAInfoCtrl.hoveringLeave(kpiGroup, kpi)"></rating>
                    </div>
                    <div class="col-sm-3 percent-rating">
                        <span class="badge percent" ng-show="kpi.CurrentEvaluation.Percent > 0">{{kpi.CurrentEvaluation.Percent}}%</span>
                        <span class="badge percent" ng-show="kpi.CurrentEvaluation.Percent == 0" ng-bind="'N/A'"></span>
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="col-sm-12">
                        <input type="text" class="form-control text-center kpi-score" ng-readonly="memberEPAInfoCtrl.isReadonly"
                               ng-show="kpiGroup.TotalKPIOptional == 0" ng-model="kpi.CurrentEvaluation.Score" numeric decimals="2"
                               ng-change="memberEPAInfoCtrl.inputScore(kpi)" tooltip="{{memberEPAInfoCtrl.getNotificationInputScore(kpi)}}" tooltip-trigger="focus" />
                    </div>
                </div>
            </div>
            <div class="row kpi-description" ng-show="kpi.Description.length > 0">
                <div class="col-sm-8" ng-bind="kpi.Description"></div>
            </div>
            <div class="row textarea-comment comment-by-employee" ng-show="kpi.HasComment">
                <div class="col-sm-11">
                    <label class="control-label" data-translate="CommentByEmployee"></label>
                    <textarea class="form-control" ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess"
                              ng-model="kpi.EvaluationBySelf.Comment" ng-readonly="true"></textarea>
                    <textarea class="form-control" ng-show="!memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" ng-readonly="true">N/A</textarea>
                </div>
            </div>
            <div class="row textarea-comment comment-by-evaluator" ng-show="kpi.HasComment">
                <label class="col-sm-12 control-label" data-translate="CommentByEvaluator"></label>
                <div class="col-sm-12 error-message" ng-show="kpi.CurrentEvaluation.CommentValid" data-translate="RequireComment"></div>
                <div class="col-sm-11">
                    <textarea class="form-control" ng-model="kpi.CurrentEvaluation.Comment" ng-readonly="memberEPAInfoCtrl.isReadonly"></textarea>
                </div>
                <div class="col-sm-1 note required-comment" ng-show="kpi.HasComment && kpi.IsRequiredComment">
                    <label class="note" data-translate="(*)"></label>
                </div>
            </div>
        </div>
    </div>
</div>
