<div class="list-kpi-rating" ng-repeat="kpiGroup in memberEPAInfoCtrl.epaInfo.KPIGroups"
     ng-init="memberEPAInfoCtrl.collapses[kpiGroup.Name] = false;"
     ng-if="kpiGroup.KPIs.length > 0">
    <div class="boxtitle col-sm-12"
         ng-click="memberEPAInfoCtrl.collapses[kpiGroup.Name] = !memberEPAInfoCtrl.collapses[kpiGroup.Name]">
        <div class="col-sm-8 kpiGroup-name">{{kpiGroup.Name}} <strong>({{kpiGroup.Weight}} pts)</strong></div>
        <div class="col-sm-1 text-center employee-score" data-translate="Employee pts"></div>
        <div class="col-sm-2 text-center" data-translate="Rate"></div>
        <div class="col-sm-1 text-center" data-translate="Enter pts"></div>
    </div>
    <div class="boxcontent col-sm-12" collapse="memberEPAInfoCtrl.collapses[kpiGroup.Name]">
        <div class="row row-item" ng-repeat="kpi in kpiGroup.KPIs">
            <div class="row col-sm-12 error-message" ng-if="kpi.EvaluateValid" data-translate="RequireEvaluate"></div>
            <div class="row kpi-name">
                <div class="col-sm-8">
                    <span>{{$index + 1}}. {{kpi.Name}}</span>
                    <strong> ({{kpi.Weight}} pts)</strong>
                    <label class="error-message" ng-if="kpi.IsRequiredEvaluate" data-translate="(*)"></label>
                </div>
                <div class="col-sm-1 text-center employee-score"><strong ng-bind="kpi.ScoreBySelf | customNumber"></strong></div>
                <div class="col-sm-2 text-center list-star">
                    <a ng-if="!memberEPAInfoCtrl.isReadonly && kpi.RateByEvaluator > 0" class="glyphicon glyphicon-remove-circle remove-star"
                       title="Cancel" href="javascript:;" ng-click="memberEPAInfoCtrl.cancelRating(kpi)"></a>
                    <rating ng-model="kpi.RateByEvaluator" max="memberEPAInfoCtrl.maxStar" readonly="memberEPAInfoCtrl.isReadonly"
                            on-hover="memberEPAInfoCtrl.hoveringOver(value, kpi)"
                            on-leave="memberEPAInfoCtrl.hoveringLeave(kpiGroup, kpi)"></rating>
                    <span class="badge percent" ng-if="kpi.PercentByEvaluator > 0">{{kpi.PercentByEvaluator}}%</span>
                    <span class="badge percent" ng-if="kpi.PercentByEvaluator == 0" data-translate="NaN"></span>
                </div>
                <div class="col-sm-1">
                    <input type="text" class="form-control text-center kpi-score" maxlength="5" ng-readonly="memberEPAInfoCtrl.isReadonly"
                           ng-model="kpi.ScoreByEvaluator" ng-value="kpi.ScoreByEvaluator" ng-decimal fraction="2"
                           ng-change="memberEPAInfoCtrl.inputScore(kpi)" />
                </div>
            </div>
            <div class="row kpi-description" ng-if="kpi.Description.length > 0">
                <div class="col-sm-8" ng-bind="kpi.Description"></div>
            </div>
            <div class="row textarea-comment" ng-if="kpi.HasComment">
                <div class="col-sm-4">
                    <label class="control-label">{{"Comment by employee" | translate}}</label>
                    <textarea class="form-control" ng-model="kpi.CommentBySelf" ng-readonly="true">
                        {{kpi.CommentBySelf}}
                    </textarea>
                </div>
                <div class="col-sm-5">
                    <div class="row">
                        <label class="col-sm-12 control-label">{{"Comment by me" | translate}}</label>
                    </div>
                    <div class="row col-sm-12 error-message" ng-if="kpi.CommentValid" data-translate="RequireComment"></div>
                    <div class="row">
                        <div class="col-sm-10">
                            <textarea class="form-control" ng-model="kpi.CommentByEvaluator" ng-readonly="memberEPAInfoCtrl.isReadonly">
                                {{kpi.CommentByEvaluator}}
                            </textarea>
                        </div>
                        <div class="row col-sm-1" ng-if="kpi.HasComment && kpi.IsRequiredComment">
                            <label class="error-message" data-translate="(*)"></label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
