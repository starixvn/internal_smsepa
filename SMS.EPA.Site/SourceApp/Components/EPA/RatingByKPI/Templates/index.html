<div class="row rating-by-kpi" ng-controller="RatingByKPIController as ratingByKPICtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="RatingPerformanceByKPI"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="form-filter" role="form">
            <div class="form-group">
                <label class="label-form required" data-translate="Period"></label>
                <select class="form-control select-form" ng-model="ratingByKPICtrl.filter.periodId"
                        ng-options="opt.PeriodId as opt.Name for opt in ratingByKPICtrl.periods"
                        ng-change="ratingByKPICtrl.getTargetTemplateByPeriod(ratingByKPICtrl.filter.periodId)">
                    <option style="display: none" value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group" ng-show="ratingByKPICtrl.filter.periodId > 0">
                <label class="label-form label-form--l required" data-translate="TargetTemplate"></label>
                <select class="form-control select-form" ng-model="ratingByKPICtrl.filter.targetTemplateId"
                        ng-options="opt.TargetTemplateId as opt.Name for opt in ratingByKPICtrl.targetTemplates"
                        ng-change="ratingByKPICtrl.getKPIByTargetTemplate()">
                    <option style="display: none" value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
        </form>
    </div>
    <div class="department-management">
        <div class="col-sm-12">
            <div class="col-sm-3 treeview" tree-event>
                <div class="tree">
                    <span ng-if="ratingByKPICtrl.kpis.length == 0" class="empty-result" data-translate="EmptyResult"></span>
                    <ul>
                        <li ng-repeat="(key,value) in ratingByKPICtrl.kpis | groupBy: 'KPIGroup.Name'">
                            <span><i class="glyphicon glyphicon-minus-sign" ng-click="ratingByKPICtrl.toggleCollapseExpand()"></i></span>
                            <a href="javascript:;">
                                {{key}}
                            </a>
                            <ul>
                                <li ng-repeat="kpi in ratingByKPICtrl.kpis" ng-if="kpi.KPIGroup.Name === key">
                                    <span class="glyphicon glyphicon-ok" ng-if="kpi.Evaluated"></span>
                                    <a href="javascript:;" ng-click="ratingByKPICtrl.KPIChange(kpi.KPIId)" ng-class="ratingByKPICtrl.getCSSSelected(kpi.KPIId)">
                                        {{kpi.Name}}
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-sm-9">
                <div class="boxcontent">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr class="showRatingScoreByStar" ng-show="ratingByKPICtrl.hasRatingByStar">
                                <th colspan="9">
                                    <div class="checkbox">
                                        <label>
                                            <input type="checkbox" ng-model="ratingByKPICtrl.showRatingScoreByStar" /> {{"ShowRatingScoreByStar" | translate}}
                                        </label>
                                    </div>
                                </th>
                            </tr>
                            <tr class="header-table">
                                <th colspan="9">
                                    <div class="col-sm-12">
                                        <label class="kpi-selected">
                                            {{ratingByKPICtrl.kpiSelected.Name}}
                                            <label ng-show="ratingByKPICtrl.kpiSelected.KPIGroup.NumberKPIOptional === 0"> ({{ratingByKPICtrl.kpiSelected.Weight | splitScore}} pts)</label>
                                            <label class="note" ng-show="ratingByKPICtrl.kpiSelected.IsRequiredEvaluate" data-translate="(*)"></label>
                                        </label>
                                        <input type="text" ng-model="ratingByKPICtrl.searchKey" ng-change="ratingByKPICtrl.search()"
                                               class="search-inline-textbox search pull-right">
                                    </div>
                                </th>
                            </tr>
                            <tr>
                                <th></th>
                                <th data-translate="Section"></th>
                                <th data-translate="Team"></th>
                                <th data-translate="NickName"></th>
                                <th data-translate="EmployeeScore"></th>
                                <th class="col-score">
                                    <div class="col-sm-10" data-translate="CurrentScore"></div>
                                    <div class="col-sm-2" ng-show="ratingByKPICtrl.epaInfos.length > 1">
                                        <a class="icon-sorting-bg" ng-class="ratingByKPICtrl.selectedCls('CurrentScore')"
                                           ng-click="ratingByKPICtrl.changeSorting('CurrentScore')"></a>
                                    </div>
                                </th>
                                <th class="col-adjust-score">
                                    <div class="col-sm-10" data-translate="AdjustScore"></div>
                                    <div class="col-sm-2" ng-show="ratingByKPICtrl.epaInfos.length > 1">
                                        <a class="icon-sorting-bg" ng-class="ratingByKPICtrl.selectedCls('AdjustScore')"
                                           ng-click="ratingByKPICtrl.changeSorting('AdjustScore')"></a>
                                    </div>
                                </th>
                                <th data-translate="Comment"></th>
                                <th data-translate="PerformanceScore" class="col-score"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr dir-paginate="epaInfo in ratingByKPICtrl.filteredItems | itemsPerPage: ratingByKPICtrl.pageSize"
                                current-page="ratingByKPICtrl.currentPage" repeat-end="ratingByKPICtrl.generateRatingStar()">
                                <td class="text-center">
                                    <div ng-repeat="kpi in epaInfo.KPIGroup.KPIs" ng-show="kpi.KPIId === ratingByKPICtrl.kpiIdOriginal">
                                        <span class="glyphicon glyphicon-ok" ng-if="kpi.Score != ''"></span>
                                    </div>
                                </td>
                                <td class="text-center" ng-bind="epaInfo.Employee.DepartmentName"></td>
                                <td class="text-center" ng-bind="epaInfo.Employee.GroupName"></td>
                                <td class="text-center">
                                    <span ng-bind="epaInfo.Employee.NickName" popover-avatar avatar-src="{{epaInfo.Employee.Avatar}}"></span>
                                </td>
                                <td class="col-score employee-score">
                                    <div class="row text-center list-star" ng-repeat="kpi in epaInfo.KPIGroup.KPIsBySelf"
                                         ng-if="kpi.KPIId === ratingByKPICtrl.kpiIdOriginal">
                                        <div uib-tooltip="{{kpi.Comment}}">
                                            <span>{{kpi.Score | splitScore}} pts</span>
                                            <div class="score-star-rating" ng-show="ratingByKPICtrl.showRatingScoreByStar && (epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.Star || epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.HalfStar || (epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.Score && epaInfo.KPIGroup.NumberKPIOptional > 0))">
                                                / <span ng-show="kpi.Rate || kpi.Rate == 0" ng-bind="kpi.Rate | splitScore"></span>
                                                <input type="number" class="rating-loading" ng-readonly="true" data-size="xs"
                                                       value="1" data-min="0" data-max="1" data-stars="1"
                                                       data-show-caption="false" data-show-clear="false">
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center col-score">
                                    <div ng-repeat="kpi in epaInfo.KPIGroup.KPIs" ng-show="kpi.KPIId === ratingByKPICtrl.kpiIdOriginal">
                                        <span ng-show="kpi.Score !== ''" ng-bind="kpi.Score | splitScore"></span>
                                        <span ng-show="kpi.Score === ''" data-translate="NotAvailable"></span>
                                    </div>
                                </td>
                                <td class="col-adjust-score">
                                    <div class="row text-center list-star" ng-repeat="kpi in epaInfo.KPIGroup.KPIs"
                                         ng-if="kpi.KPIId === ratingByKPICtrl.kpiIdOriginal">
                                        <div ng-if="epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.Star || (epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.Score && epaInfo.KPIGroup.NumberKPIOptional > 0)">
                                            <div class="col-sm-2 cancel-rating">
                                                <a ng-show="kpi.AdjustRate > 0" class="glyphicon glyphicon-remove-circle remove-star"
                                                   title="Cancel" href="javascript:;" ng-click="ratingByKPICtrl.cancelRating(epaInfo, kpi)"></a>
                                            </div>
                                            <div class="col-sm-7 rating-form">
                                                <input id="star_{{epaInfo.Employee.EmployeeId}}" type="number" class="rating-loading"
                                                       ng-readonly="ratingByKPICtrl.permission !== ratingByKPICtrl.policyEnum.Host" data-size="xs"
                                                       data-min=0 data-max={{ratingByKPICtrl.maxStar}} data-step=1 ng-model="kpi.AdjustRate"
                                                       data-show-caption="false" data-show-clear="false"
                                                       ng-change="ratingByKPICtrl.hoveringLeave(epaInfo, kpi)">
                                            </div>
                                            <div class="col-sm-3 percent-rating">
                                                <span class="badge percent" ng-show="epaInfo.KPIGroup.NumberKPIOptional === 0 && kpi.AdjustRate > 0">
                                                    {{kpi.AdjustScore | splitScore}} pts
                                                </span>
                                            </div>
                                        </div>
                                        <div ng-if="epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.Score && epaInfo.KPIGroup.NumberKPIOptional === 0" class="input-score">
                                            <input type="text" maxlength="5" class="form-control text-center epa-input-score"
                                                   ng-readonly="ratingByKPICtrl.permission != ratingByKPICtrl.policyEnum.Host" ng-model="kpi.AdjustScore" numeric decimals="2"
                                                   ng-change="ratingByKPICtrl.inputScore(epaInfo, kpi)" />
                                        </div>
                                        <div ng-if="epaInfo.RatingType.RatingTypeId === ratingByKPICtrl.ratingTypeEnum.HalfStar">
                                            <div class="col-sm-2 cancel-rating">
                                                <a ng-show="kpi.AdjustRate > 0" class="glyphicon glyphicon-remove-circle remove-star"
                                                   title="Cancel" href="javascript:;" ng-click="ratingByKPICtrl.cancelRating(epaInfo, kpi)"></a>
                                            </div>
                                            <div class="col-sm-7 rating-form">
                                                <input id="star_{{epaInfo.Employee.EmployeeId}}" type="number" class="rating-loading"
                                                       ng-readonly="ratingByKPICtrl.permission != ratingByKPICtrl.policyEnum.Host" data-size="xs"
                                                       data-min=0 data-max={{ratingByKPICtrl.maxStar}} data-step=0.5 ng-model="kpi.AdjustRate"
                                                       data-show-caption="false" data-show-clear="false"
                                                       ng-change="ratingByKPICtrl.hoveringLeave(epaInfo, kpi)">
                                            </div>
                                            <div class="col-sm-3 percent-rating">
                                                <span class="badge percent" ng-show="epaInfo.KPIGroup.NumberKPIOptional === 0 && kpi.AdjustRate > 0">
                                                    {{kpi.AdjustScore | splitScore}} pts
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td class="col-comment">
                                    <div ng-repeat="kpi in epaInfo.KPIGroup.KPIs" ng-if="kpi.KPIId === ratingByKPICtrl.kpiIdOriginal">
                                        <div class="required-comment" ng-show="kpi.HasComment && kpi.IsRequiredComment">
                                            <div class="textarea">
                                                <textarea class="form-control" maxlength="2000" ng-show="kpi.HasComment" ng-model="kpi.Comment"
                                                          ng-readonly="ratingByKPICtrl.permission !== ratingByKPICtrl.policyEnum.Host"></textarea>
                                            </div>
                                            <div class="note" data-translate="(*)"></div>
                                        </div>
                                        <div class="optional-comment" ng-show="kpi.HasComment && !kpi.IsRequiredComment">
                                            <textarea class="form-control" maxlength="2000" ng-show="kpi.HasComment" ng-model="kpi.Comment"
                                                      ng-readonly="ratingByKPICtrl.permission !== ratingByKPICtrl.policyEnum.Host"></textarea>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center col-score">
                                    <strong>
                                        <a ng-show="epaInfo.TotalScore !== ''" ng-bind="epaInfo.TotalScore | customScore"
                                           ng-click="ratingByKPICtrl.viewDetail(epaInfo, $event)"></a>
                                    </strong>
                                    <strong>
                                        <a ng-show="epaInfo.TotalScore === ''" data-translate="NotAvailable"
                                           ng-click="ratingByKPICtrl.viewDetail(epaInfo, $event)"></a>
                                    </strong>
                                </td>
                            </tr>
                        </tbody>
                        <tbody ng-show="!ratingByKPICtrl.filteredItems || ratingByKPICtrl.filteredItems.length === 0">
                            <tr>
                                <td class="empty-result" colspan="9" data-translate="EmptyResult"></td>
                            </tr>
                        </tbody>
                        <tfoot ng-show="ratingByKPICtrl.filteredItems && ratingByKPICtrl.filteredItems.length > 0">
                            <tr>
                                <td colspan="9" class="paging">
                                    <span data-translate="Show"></span>
                                    <select class="dropdown-entry form-control" ng-model="ratingByKPICtrl.pageSize"
                                            ng-options="entry for entry in ratingByKPICtrl.entries" ng-change="ratingByKPICtrl.currentPage = 1"></select>
                                    <span data-translate="entries"></span>
                                    <div class="pull-right custom-paging">
                                        <ul uib-pagination total-items="ratingByKPICtrl.filteredItems.length" items-per-page="ratingByKPICtrl.pageSize"
                                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="ratingByKPICtrl.currentPage"
                                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                                    </div>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                    <div class="navbar navbar-default navbar-fixed-bottom action-section">
                        <div class="container text-center">
                            <button class="btn btn-primary" ng-click="ratingByKPICtrl.save()"
                                    ng-if="ratingByKPICtrl.filteredItems.length > 0 && ratingByKPICtrl.permission === ratingByKPICtrl.policyEnum.Host" data-translate="Save"></button>
                            <button class="btn btn-warning" ng-click="ratingByKPICtrl.back()" data-translate="Back"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
