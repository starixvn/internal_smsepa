﻿<div class="form-horizontal">
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="Score"></label>
        <div class="col-sm-1 total-score-reviewer">
            <input type="text" class="form-control text-center" maxlength="5" ng-readonly="memberEPAInfoCtrl.isReadonly"
                   ng-model="memberEPAInfoCtrl.epaInfo.ProcessByMangements[0].TotalScore" ng-decimal fraction="2" />
        </div>
        <div class="col-sm-1">
            <label class="error-message" data-translate="(*)"></label>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="Comment"></label>
        <div class="col-sm-4 textarea-comment">
            <textarea class="form-control" ng-readonly="memberEPAInfoCtrl.isReadonly"
                      ng-model="memberEPAInfoCtrl.epaInfo.ProcessByMangements[0].Comment"></textarea>
        </div>
        <div class="col-sm-1">
            <label class="error-message" data-translate="(*)"></label>
        </div>
    </div>
</div>
