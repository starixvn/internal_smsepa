<div class="form-reviewer" ng-controller="MemberEPAInfoOfManagentController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MemberEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form class="epa-form">
            <div class="text-center epa-title" data-translate="EPATilte"></div>
            <div class="col-sm-12 list-group-item bottom-buffer" ng-init="memberEPAInfoCtrl.collapses['GeneralInfo'] = true;">
                <div class="boxtitle" data-translate="GeneralInfo"
                     ng-click="memberEPAInfoCtrl.collapses['GeneralInfo'] = !memberEPAInfoCtrl.collapses['GeneralInfo']"></div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['GeneralInfo']"
                     ng-include src="'/SourceApp/Components/EPA/Templates/generalInformation.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item">
                <div ng-include src="'/SourceApp/Components/EPA/Management/Templates/listKPI.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item" ng-init="memberEPAInfoCtrl.collapses['Summary'] = true;">
                <div class="boxtitle" data-translate="Summary"
                     ng-click="memberEPAInfoCtrl.collapses['Summary'] = !memberEPAInfoCtrl.collapses['Summary']">
                </div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['Summary']">
                    <div class="row row-item">
                        <div ng-include src="'/SourceApp/Components/EPA/Management/Templates/summary.html'"></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 list-group-item" ng-init="memberEPAInfoCtrl.collapses['Evaluation'] = false;">
                <div class="boxtitle" data-translate="Evaluation"
                     ng-click="memberEPAInfoCtrl.collapses['Evaluation'] = !memberEPAInfoCtrl.collapses['Evaluation']">
                </div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['Evaluation']">
                    <div class="row row-item">
                        <div class="col-sm-8">
                            <div ng-include src="'/SourceApp/Components/EPA/Management/Templates/evaluation.html'"></div>
                        </div>
                        <div class="col-sm-4">
                            <div class="row total text-center pull-right">
                                <p data-translate="AttendanceScore"></p>
                                <p class="totalscore" ng-bind="memberEPAInfoCtrl.epaInfo.AttendanceScore | customNumber"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="boxcontent">
                    <div class="row row-item">
                        <label class="error-message">{{"Note" | translate }}: (*) {{"RequiredField" | translate}}!</label>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 epa-action-button text-center">
                <button class="button" ng-click="memberEPAInfoCtrl.save(memberEPAInfoCtrl.epaInfo)"
                        ng-show="memberEPAInfoCtrl.epaInfo && !memberEPAInfoCtrl.isReadonly" data-translate="Save"></button>
                <button class="btn btn-default customize" ng-click="memberEPAInfoCtrl.cancel()" data-translate="Cancel"></button>
            </div>
        </form>
    </div>
</div>
