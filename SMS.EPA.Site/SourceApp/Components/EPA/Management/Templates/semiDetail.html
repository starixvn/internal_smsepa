<div class="form-reviewer" ng-controller="MemberEPAInfoOfManagentController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MemberEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title" data-translate="EPATilte"></div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo">
                    <h4 class="panel-title" data-translate="GeneralInfo"></h4>
                </div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info" ng-include src="'/SourceApp/Components/EPA/Templates/generalInformation.html'"></div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".evaluationProcess">
                    <h4 class="panel-title text-uppercase" data-translate="EvaluationProcess"></h4>
                </div>
                <div class="panel-collapse collapse in evaluationProcess" auto-collapse data-collapsed="true">
                    <div class="panel-body evaluation-process-section" ng-include src="'/SourceApp/Components/EPA/Templates/evaluationProcess.html'"></div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult">
                    <h4 class="panel-title" data-translate="PerformanceResult"></h4>
                </div>
                <div class="panel-collapse collapse in performanceResult">
                    <div class="panel-body summary-section" ng-include src="'/SourceApp/Components/EPA/Management/Templates/semiPerformanceResult.html'"></div>
                </div>
            </div>

            <div>&ensp;</div>

            <div class="col-sm-12 list-group-item summary-section" ng-init="memberEPAInfoCtrl.collapses['monthlyEPAs'] = false;">
                <div class="boxtitle" data-translate="monthlyEPAs"
                     ng-click="memberEPAInfoCtrl.collapses['monthlyEPAs'] = !memberEPAInfoCtrl.collapses['monthlyEPAs']">
                </div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['monthlyEPAs']"
                     ng-include src="'/SourceApp/Components/EPA/Templates/monthlyEPAs.html'">
                </div>
            </div>
        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="memberEPAInfoCtrl.save(memberEPAInfoCtrl.epaInfo)"
                        ng-if="memberEPAInfoCtrl.epaInfo && memberEPAInfoCtrl.epaInfo.IsAllowedToEdit" data-translate="Save"></button>
                <button class="btn btn-warning" ng-click="memberEPAInfoCtrl.cancel()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
