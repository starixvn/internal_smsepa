<div class="management" ng-controller="ManagementController as managementCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ReviewAndUpdateScore"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Section"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="managementCtrl.filter.groupId"
                            ng-options="opt.GroupId as opt.GroupName for opt in managementCtrl.groupOptions"
                            ng-change="managementCtrl.getMember(managementCtrl.filter.groupId)">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Employee"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="managementCtrl.members" button-label="EmployeeId"
                                              helper-elements="all reset filter" item-label="NickName" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <div class="col-sm-1">
                    <button class="button" ng-click="managementCtrl.query(managementCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table" ng-show="managementCtrl.memberEPAs.length > 0">
                    <th colspan="14">
                        <a class="pull-left button-icon" ng-click="managementCtrl.adjustScore()">
                            <span class="icon-edit glyphicon glyphicon-edit"></span>
                            <span class="button-text" data-translate="AdjustScore"></span>
                        </a>
                        <a class="pull-left button-icon" ng-click="managementCtrl.saveAdjustScore()">
                            <span class="icon-save-submit"></span>
                            <span class="button-text" data-translate="Save"></span>
                        </a>
                    </th>
                </tr>
                <tr class="headerName">
                    <th ng-show="managementCtrl.memberEPAs.length > 0">
                        <input type="checkbox" ng-model="managementCtrl.selectedAll" ng-click="managementCtrl.checkAll(managementCtrl.selectedAll)" />
                    </th>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="PeriodName"></th>
                    <th data-translate="Section"></th>
                    <th data-translate="NickName"></th>
                    <th data-translate="JobTitle"></th>
                    <th data-translate="SelfScore"></th>
                    <th data-translate="EvaluatorScore"></th>
                    <th data-translate="ReviewerScore"></th>
                    <th data-translate="PerformanceScore"></th>
                    <th data-translate="Comment"></th>
                    <th data-translate="AttendanceScore"></th>
                    <th data-translate="TotalScore"></th>
                    <th data-translate="Detail" class="col-action"></th>
                </tr>
            </thead>
            <tbody ng-repeat="memberEPA in managementCtrl.memberEPAs">
                <tr>
                    <td class="text-center">
                        <input type="checkbox" ng-model="memberEPA.Selected" />
                    </td>
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td ng-bind="memberEPA.Period.Name"></td>
                    <td class="text-center">
                        <span tooltip="{{memberEPA.Employee.Group.GroupName}}" ng-bind="memberEPA.Employee.Group.GroupCode"></span>
                    </td>
                    <td class="text-center">
                        <span ng-bind="memberEPA.Employee.NickName" tooltip="{{memberEPA.Employee.FullName}}"></span>
                    </td>
                    <td ng-bind="memberEPA.Employee.JobTitle.JobTitleName"></td>
                    <td class="text-center">
                        <div ng-show="memberEPA.ProcessBySelf.IsEndProcess">
                            <span ng-show="memberEPA.ProcessBySelf.TotalScore" ng-bind="memberEPA.ProcessBySelf.TotalScore | customNumber"></span>
                        </div>
                        <div ng-show="!memberEPA.ProcessBySelf.IsEndProcess" data-translate="NaN"></div>
                    </td>
                    <td class="text-center">
                        <div ng-show="memberEPA.ProcessByEvaluators[0].IsEndProcess">
                            <span ng-show="memberEPA.AverageScoreByEvaluators" ng-bind="memberEPA.AverageScoreByEvaluators | customNumber"></span>
                            <span ng-show="!memberEPA.AverageScoreByEvaluators" ng-bind="0"></span>
                        </div>
                        <div ng-show="!memberEPA.ProcessByEvaluators[0].IsEndProcess" data-translate="NaN"></div>
                    </td>
                    <td class="text-center">
                        <div ng-show="memberEPA.ProcessByReviewers[0].IsEndProcess">
                            <span ng-show="memberEPA.AverageScoreByReviewers" ng-bind="memberEPA.AverageScoreByReviewers | customNumber"></span>
                            <span ng-show="!memberEPA.AverageScoreByReviewers" ng-bind="0"></span>
                        </div>
                        <div ng-show="!memberEPA.ProcessByEvaluators[0].IsEndProcess" data-translate="NaN"></div>
                    </td>
                    <td class="text-center">
                        <input type="text" class="form-control text-center epa-input-score" ng-readonly="memberEPA.ProcessByManagements[0].IsEndProcess"
                               ng-model="memberEPA.ProcessByManagements[0].TotalScore" numeric decimals="2"
                               ng-change="managementCtrl.inputScore(memberEPA, memberEPA.ProcessByManagements[0])"
                               tooltip="{{managementCtrl.getNotificationInputScore(memberEPA.ProcessByManagements[0])}}" tooltip-trigger="focus" />
                    </td>
                    <td class="text-center">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-attr-title='{{"Edit" | translate}}'
                           ng-click="managementCtrl.updateComment(memberEPA, memberEPA.ProcessByManagements[0].Comment, true)"
                           ng-show="!memberEPA.ProcessByManagements[0].IsEndProcess && memberEPA.Status.StatusId == 0"></a>
                        <a class="glyphicon icon-view" href="" ng-attr-title='{{"View" | translate}}'
                           ng-click="managementCtrl.updateComment(memberEPA, memberEPA.ProcessByManagements[0].Comment, false)"
                           ng-show="memberEPA.ProcessByManagements[0].IsEndProcess && memberEPA.Status.StatusId != 0"></a>
                    </td>
                    <td class="text-center">
                        <span ng-show="memberEPA.HasAttendanceScore" ng-bind="memberEPA.AttendanceScore | customNumber"></span>
                    </td>
                    <td class="text-center">
                        <span ng-bind="memberEPA.FinalScore | customNumber"></span>
                    </td>
                    <td class="text-center col-action">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="managementCtrl.viewEPADetail(memberEPA)"
                           ng-show="!memberEPA.ProcessByManagements[0].IsEndProcess && memberEPA.Status.StatusId == 0"
                           ng-href="{{managementCtrl.viewEPADetailUrl}}" ng-attr-title='{{"EvaluateNow" | translate}}'></a>
                        <a class="glyphicon icon-view" href="" ng-click="managementCtrl.viewEPAResult(memberEPA)"
                           ng-show="memberEPA.ProcessByManagements[0].IsEndProcess && memberEPA.Status.StatusId != 0"
                           ng-href="{{managementCtrl.viewEPAResultUrl}}" ng-attr-title='{{"ViewEPAResult" | translate}}'></a>
                    </td>
                </tr>
            </tbody>
            <tbody ng-show="managementCtrl.memberEPAs.length == 0">
                <tr>
                    <td class="empty-result" colspan="14" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
