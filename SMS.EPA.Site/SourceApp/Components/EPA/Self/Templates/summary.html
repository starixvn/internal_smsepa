<table class="table table-bordered table-striped table-custom table-summary">
    <thead>
        <tr>
            <th></th>
            <th data-translate="EmployeeScore"></th>
            <th data-translate="LastRating"></th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="text-right"><strong data-translate="PerformanceScore"></strong></td>
            <td class="text-center col-score">
                <strong>
                    {{empDetailCtrl.epaInfo.Process.CurrentProcess.TotalScore | customScore}} / {{empDetailCtrl.epaInfo.Process.CurrentProcess.MaxTotalScore | customScore}}
                </strong>
            </td>
            <td class="text-center col-score">
                <strong ng-show="empDetailCtrl.epaInfo.LastPerformanceScore != null" ng-bind="empDetailCtrl.epaInfo.LastPerformanceScore | customScore"></strong>
                <strong ng-show="empDetailCtrl.epaInfo.LastPerformanceScore == null" ng-bind="'-'"></strong>
            </td>
        </tr>
        <tr class="text-right" ng-if="!empDetailCtrl.epaInfo.IsMonthly">
            <td><strong data-translate="DisciplineScore"></strong></td>
            <td class="text-center col-score">
                <strong ng-show="empDetailCtrl.epaInfo.HasDisciplineScore">
                    <span ng-class="empDetailCtrl.epaInfo.DisciplineScore < 0 ? 'red' : ''"
                          ng-bind="empDetailCtrl.epaInfo.DisciplineScore | customScore"></span> / <span ng-bind="empDetailCtrl.epaInfo.MaxDisciplineScore | customScore"></span>
                </strong>
                <div ng-show="!empDetailCtrl.epaInfo.HasDisciplineScore">
                    <strong ng-show="empDetailCtrl.epaInfo.DisciplineScore"
                            ng-class="empDetailCtrl.epaInfo.DisciplineScore < 0 ? 'red' : ''"
                            ng-bind="empDetailCtrl.epaInfo.DisciplineScore | customScore"></strong>
                    <strong ng-show="!empDetailCtrl.epaInfo.DisciplineScore" ng-bind="'-'"></strong>
                </div>
            </td>
            <td class="text-center col-score">
                <div ng-show="empDetailCtrl.epaInfo.HasDisciplineScore">
                    <strong ng-show="empDetailCtrl.epaInfo.LastPerformanceScore != null" ng-bind="empDetailCtrl.epaInfo.LastDisciplineScore | customScore"></strong>
                    <strong ng-show="empDetailCtrl.epaInfo.LastPerformanceScore == null" ng-bind="'-'"></strong>
                </div>
                <div ng-show="!empDetailCtrl.epaInfo.HasDisciplineScore">
                    <strong ng-show="empDetailCtrl.epaInfo.LastPerformanceScore != null" ng-bind="empDetailCtrl.epaInfo.LastDisciplineScore | customScore"></strong>
                    <strong ng-show="empDetailCtrl.epaInfo.LastPerformanceScore == null" ng-bind="'-'"></strong>
                </div>
            </td>
        </tr>
        <tr class="text-right" ng-if="!empDetailCtrl.epaInfo.IsMonthly">
            <td><strong data-translate="TotalScore"></strong></td>
            <td class="text-center col-score">
                <strong>{{empDetailCtrl.finalScore | customScore}} / {{empDetailCtrl.epaInfo.Process.CurrentProcess.MaxPerformanceScore | customScore}}</strong>
            </td>
            <td class="text-center col-score">
                <strong ng-show="empDetailCtrl.epaInfo.LastFinalScore != null" ng-bind="empDetailCtrl.epaInfo.LastFinalScore | customScore"></strong>
                <strong ng-show="empDetailCtrl.epaInfo.LastFinalScore == null" ng-bind="'-'"></strong>
            </td>
        </tr>
        <tr class="text-right" ng-if="!empDetailCtrl.epaInfo.IsMonthly">
            <td><strong data-translate="Grade"></strong></td>
            <td class="text-center col-score">
                <strong ng-bind="empDetailCtrl.epaInfo.Grade"></strong>
            </td>
            <td class="text-center col-score">
                <strong ng-show="empDetailCtrl.epaInfo.LastGrade" ng-bind="empDetailCtrl.epaInfo.LastGrade"></strong>
                <strong ng-show="!empDetailCtrl.epaInfo.LastGrade" ng-bind="'-'"></strong>
            </td>
        </tr>
    </tbody>
</table>
