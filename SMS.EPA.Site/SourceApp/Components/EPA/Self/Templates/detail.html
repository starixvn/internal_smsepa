<div ng-controller="EmployeeEPAInfoController as empDetailCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MyEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">
                <span data-translate="EPATilte"></span>
                <span> - {{empDetailCtrl.epaInfo.Period.Name}}</span>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo" data-translate="GeneralInfo"></div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info">
                        <epa-general-infomation data-is-view-detail="empDetailCtrl.isViewDetail"
                                                data-employee-info="empDetailCtrl.epaInfo.Employee"
                                                data-evaluated-date="empDetailCtrl.evaluatedDate"
                                                data-saved="empDetailCtrl.dataSaved"></epa-general-infomation>
                    </div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".evaluationProcess" data-translate="EvaluationProcess"></div>
                <div class="panel-collapse collapse in evaluationProcess" auto-collapse data-collapsed="true">
                    <div class="panel-body evaluation-process-section">
                        <epa-evaluation-process data-epa-info="empDetailCtrl.epaInfo"></epa-evaluation-process>
                    </div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".ratingInstruction" data-translate="RatingInstruction"></div>
                <div class="panel-collapse collapse ratingInstruction">
                    <div class="panel-body rating-instruction-section">
                        <div><span class="note">* {{"RatingCriteria" | translate}}: </span>{{"MessageRatingInstructions" | translate}}</div>
                        <epa-rating-instruction></epa-rating-instruction>
                    </div>
                </div>
            </div>

            <div>&ensp;</div>

            <div ng-include src="'/SourceApp/Components/EPA/Self/Templates/listKPI.html'"></div>

            <div>&ensp;</div>

            <div class="panel panel-default" ng-if="empDetailCtrl.epaInfo.ExtendedQuestion != null && empDetailCtrl.epaInfo.ExtendedQuestion.SubQuestions.length">
                <div class="panel-heading" data-toggle="collapse" data-target=".extendedQuestion">
                    {{empDetailCtrl.epaInfo.ExtendedQuestion.QuestionContent}}
                </div>
                <div class="row panel-collapse collapse-expanse extendedQuestion">
                    <div class="panel-body" ng-repeat="question in empDetailCtrl.epaInfo.ExtendedQuestion.SubQuestions">
                        <div class="error-message col-md-12">
                            <span ng-show="question.IsInvalid" data-translate="RequiredAnswer"></span>
                          </div>
                        <div class="col-md-12">
                            <span>{{$index + 1}}. {{question.SubQuestionContent}}</span>
                            <span class="note" data-translate="(*)"></span>
                        </div>
                        <div class="col-md-12">
                            <div class="col-md-1">
                                <label>
                                    <input type="radio" ng-model="question.IsAgree" ng-value="true" />
                                    <span data-translate="Yes"></span>
                                </label>
                            </div>
                            <div class="col-md-1">
                                <label>
                                    <input type="radio" ng-model="question.IsAgree" ng-value="false"/>
                                    <span data-translate="No"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>&ensp;</div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".summary" data-translate="Summary"></div>
                <div class="panel-collapse collapse in summary">
                    <div class="panel-body summary-section" ng-include src="'/SourceApp/Components/EPA/Self/Templates/summary.html'"></div>
                </div>
            </div>
        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="empDetailCtrl.save(empDetailCtrl.epaInfo)"
                        ng-if="empDetailCtrl.epaInfo && empDetailCtrl.epaInfo.IsAllowedToEdit" data-translate="Save"></button>
                <button class="btn btn-warning" ng-click="empDetailCtrl.cancel()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
