<div class="my-epa" ng-controller="EmployeeEPAController as empEPACtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ManageMyEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <table class="row table table-bordered table-striped">
            <thead>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="PeriodName"></th>
                    <th data-translate="StartDate"></th>
                    <th data-translate="EndDate"></th>
                    <th data-translate="Detail"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="epaInfo in empEPACtrl.epaInfos">
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td ng-bind="epaInfo.Period.Name"></td>
                    <td class="text-center">{{ epaInfo.Process.CurrentProcess.StartDate | customDate }}</td>
                    <td class="text-center">{{ epaInfo.Process.CurrentProcess.EndDate | customDate }}</td>
                    <td class="text-center col-action" ng-switch="epaInfo.IsAllowedToEdit">
                        <a ng-switch-when="true" class="glyphicon glyphicon-edit icon-edit" href="" ng-click="empEPACtrl.viewEPADetail(epaInfo)"
                           ng-attr-title='{{"EvaluateNow" | translate}}'></a>
                        <a ng-switch-default class="glyphicon icon-view" href="" ng-click="empEPACtrl.viewEPAResult(epaInfo)"
                           ng-attr-title='{{"ViewEPAResult" | translate}}'></a>
                    </td>
                </tr>
                <tr ng-show="empEPACtrl.epaInfos.length == 0">
                    <td class="empty-result" colspan="5" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
