<div class="reviewer" ng-controller="ReviewerController as reviewerCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ReviewAndUpdateScore"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Section"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="reviewerCtrl.filter.groupId"
                            ng-options="opt.GroupId as opt.GroupName for opt in reviewerCtrl.groupOptions"
                            ng-change="reviewerCtrl.getMember(reviewerCtrl.filter.groupId)">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Employee"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="reviewerCtrl.members" button-label="EmployeeId"
                                              helper-elements="all reset filter" item-label="NickName" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <div class="col-sm-1">
                    <button class="button" ng-click="reviewerCtrl.query(reviewerCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table" ng-show="reviewerCtrl.memberEPAs.length > 0">
                    <th colspan="13">
                        <a class="pull-left button-icon" ng-click="reviewerCtrl.adjustScore()">
                            <span class="icon-edit glyphicon glyphicon-edit"></span>
                            <span class="button-text" data-translate="AdjustScore"></span>
                        </a>
                        <a class="pull-left button-icon" ng-click="reviewerCtrl.saveAdjustScore()">
                            <span class="icon-save-submit"></span>
                            <span class="button-text" data-translate="Save"></span>
                        </a>
                        <div class="manage-column pull-right" hidden>
                            <span class="text-related">Manage Columns</span>
                            <a class="glyphicon glyphicon-list" href=""></a>
                        </div>
                    </th>
                </tr>
                <tr class="headerName">
                    <th ng-show="reviewerCtrl.memberEPAs.length > 0">
                        <input type="checkbox" ng-model="reviewerCtrl.selectedAll" ng-click="reviewerCtrl.checkAll(reviewerCtrl.selectedAll)" />
                    </th>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="PeriodName"></th>
                    <th data-translate="Section"></th>
                    <th data-translate="NickName"></th>
                    <th data-translate="JobTitle"></th>
                    <th data-translate="SelfScore"></th>
                    <th data-translate="EvaluatorScore"></th>
                    <th data-translate="PerformanceScore"></th>
                    <th data-translate="Comment"></th>
                    <th data-translate="AttendanceScore"></th>
                    <th data-translate="TotalScore"></th>
                    <th data-translate="Detail" class="col-action"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="memberEPA in reviewerCtrl.memberEPAs">
                    <td class="text-center">
                        <input type="checkbox" ng-model="memberEPA.Selected" />
                    </td>
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td ng-bind="memberEPA.Period.Name"></td>
                    <td class="text-center">
                        <span tooltip="{{memberEPA.Employee.Group.GroupName}}" ng-bind="memberEPA.Employee.Group.GroupCode"></span>
                    </td>
                    <td class="text-center">
                        <span ng-bind="memberEPA.Employee.NickName" tooltip="{{memberEPA.Employee.FullName}}"></spanng-bind>
                    </td>
                    <td ng-bind="memberEPA.Employee.JobTitle.JobTitleName"></td>
                    <td class="text-center">
                        <strong ng-show="memberEPA.ProcessBySelf.TotalScore" ng-bind="memberEPA.ProcessBySelf.TotalScore | customNumber"></strong>
                        <strong ng-show="!memberEPA.ProcessBySelf.TotalScore" ng-bind="0"></strong>
                    </td>
                    <td class="text-center">
                        <strong ng-show="memberEPA.AverageScoreByEvaluators" ng-bind="memberEPA.AverageScoreByEvaluators | customNumber"></strong>
                        <strong ng-show="!memberEPA.AverageScoreByEvaluators" ng-bind="0"></strong>
                    </td>
                    <td class="text-center">
                        <input type="text" class="form-control text-center epa-input-score" ng-readonly="memberEPA.ProcessByReviewers[0].IsEndProcess"
                               ng-model="memberEPA.ProcessByReviewers[0].TotalScore" numeric decimals="2"
                               ng-change="reviewerCtrl.inputScore(memberEPA, memberEPA.ProcessByReviewers[0])"
                               tooltip="{{reviewerCtrl.getNotificationInputScore(memberEPA.ProcessByReviewers[0])}}" tooltip-trigger="focus" />
                    </td>
                    <td class="text-center">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-attr-title='{{"Edit" | translate}}'
                           ng-click="reviewerCtrl.updateComment(memberEPA, memberEPA.ProcessByReviewers[0].Comment, true)"
                           ng-show="!memberEPA.ProcessByReviewers[0].IsEndProcess && memberEPA.Status.StatusId == 0"></a>
                        <a class="glyphicon icon-view" href="" ng-attr-title='{{"View" | translate}}'
                           ng-click="reviewerCtrl.updateComment(memberEPA, memberEPA.ProcessByReviewers[0].Comment, false)"
                           ng-show="memberEPA.ProcessByReviewers[0].IsEndProcess && memberEPA.Status.StatusId != 0"></a>
                    </td>
                    <td class="text-center">
                        <strong ng-show="memberEPA.HasAttendanceScore" ng-bind="memberEPA.AttendanceScore | customNumber"></strong>
                    </td>
                    <td class="text-center">
                        <strong ng-show="memberEPA.FinalScore" ng-bind="memberEPA.FinalScore | customNumber"></strong>
                        <strong ng-show="!memberEPA.FinalScore" ng-bind="0"></strong>
                    </td>
                    <td class="text-center col-action">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="reviewerCtrl.viewEPADetail(memberEPA)"
                           ng-show="!memberEPA.ProcessByReviewers[0].IsEndProcess && memberEPA.Status.StatusId == 0"
                           ng-href="{{reviewerCtrl.viewEPADetailUrl}}" ng-attr-title='{{"EvaluateNow" | translate}}'></a>
                        <a class="glyphicon icon-view" href="" ng-click="reviewerCtrl.viewEPAResult(memberEPA)"
                           ng-show="memberEPA.ProcessByReviewers[0].IsEndProcess && memberEPA.Status.StatusId != 0"
                           ng-href="{{reviewerCtrl.viewEPAResultUrl}}" ng-attr-title='{{"ViewEPAResult" | translate}}'></a>
                    </td>
                </tr>
            </tbody>
            <tbody ng-show="reviewerCtrl.memberEPAs.length == 0">
                <tr>
                    <td class="empty-result" colspan="13" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
