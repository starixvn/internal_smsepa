<div class="evaluator" ng-controller="ReviewerController as reviewerCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ReviewAndUpdateScore"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="From"></label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="reviewerCtrl.filter.fromDate" datepicker-popup="{{reviewerCtrl.dateFormat}}"
                           ng-click="reviewerCtrl.openPopupStartDate($event, reviewerCtrl.calendar.startDateOpened)"
                           is-open="reviewerCtrl.calendar.startDateOpened" />
                    <calendar-image class="calendar-image"
                                    ng-click="reviewerCtrl.openPopupStartDate($event, reviewerCtrl.calendar.startDateOpened)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="To"></label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="reviewerCtrl.filter.toDate" datepicker-popup="{{reviewerCtrl.dateFormat}}"
                           ng-click="reviewerCtrl.openPopupEndDate($event, reviewerCtrl.calendar.endDateOpened)"
                           is-open="reviewerCtrl.calendar.endDateOpened" />
                    <calendar-image class="calendar-image"
                                    ng-click="reviewerCtrl.openPopupEndDate($event, reviewerCtrl.calendar.endDateOpened)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="Target"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="reviewerCtrl.filter.targetTypeId"
                            ng-options="opt.TargetTypeId as opt.Name for opt in reviewerCtrl.targetTypes">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Section"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="reviewerCtrl.filter.groupId"
                            ng-options="opt.GroupId as opt.GroupName for opt in reviewerCtrl.groupOptions"
                            ng-change="reviewerCtrl.getMember(reviewerCtrl.filter.groupId)">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Employee"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="reviewerCtrl.members" button-label="EmployeeId"
                                              helper-elements="all reset filter" item-label="FullName" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-1 control-label" data-translate="Status"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="reviewerCtrl.filter.status"
                            ng-options="opt.StatusId as opt.Name for opt in reviewerCtrl.statusList">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <div class="col-sm-1">
                    <button class="button" ng-click="reviewerCtrl.query(reviewerCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Section"></th>
                <th data-translate="Employee"></th>
                <th data-translate="Target"></th>
                <th data-translate="Evaluator"></th>
                <th data-translate="EvaluationScore"></th>
                <th data-translate="ReviewerScore"></th>
                <th data-translate="ReviewDate"></th>
                <th data-translate="Status"></th>
                <th data-translate="Action" class="col-action"></th>
            </thead>
            <tbody>
                <tr ng-repeat="memberEPA in reviewerCtrl.memberEPAs">
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td class="text-center">
                        <span tooltip="{{memberEPA.Group.GroupName}}" ng-bind="memberEPA.Group.GroupCode"></span>
                    </td>
                    <td>{{memberEPA.Employee.FullName}} ({{memberEPA.Employee.NickName}})</td>
                    <td class="text-center" ng-bind="memberEPA.TargetType.Name"></td>
                    <td class="epa-evaluator">
                        <div ng-if="memberEPA.Evaluators.length == 1">
                            <span ng-bind="memberEPA.Evaluators[0].NickName" tooltip="{{memberEPA.Evaluators[0].FullName}}"></span>
                        </div>
                        <div ng-show="memberEPA.Evaluators.length > 1">
                            <ul>
                                <li ng-repeat="evaluator in memberEPA.Evaluators">
                                    <span ng-bind="evaluator.NickName" tooltip="{{evaluator.FullName}}"></span>
                                </li>
                            </ul>
                        </div>
                    </td>
                    <td class="text-center">
                        <span ng-if="memberEPA.EvaluationScore" ng-bind="memberEPA.EvaluationScore"></span>
                        <span ng-if="!memberEPA.EvaluationScore" ng-bind="'N/A'"></span>
                    </td>
                    <td class="text-center col-score">
                        <a href="" ng-bind="memberEPA.ReviewerScore | customNumber" ng-click="reviewerCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{reviewerCtrl.viewEPADetailUrl}}" ng-if="memberEPA.ReviewerScore" />
                        <a href="" ng-bind="'N/A'" ng-click="reviewerCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{reviewerCtrl.viewEPADetailUrl}}" ng-if="!memberEPA.ReviewerScore" />
                    </td>
                    <td class="text-center col-evaluate-date">{{ memberEPA.EvaluateDate | customDate }}</td>
                    <td class="text-center col-evaluation-status">
                        <span class="dropdown" dropdown on-toggle="reviewerCtrl.toggled(open)">
                            <a href="javascript:;" class="changeStatus" dropdown-toggle>{{memberEPA.Status.Name}}</a>
                            <ul class="dropdown-menu dropdown-menu-width">
                                <li ng-repeat="item in reviewerCtrl.epaStatus | filter:{ Name: '!' + memberEPA.Status.Name }">
                                    <a ng-click="reviewerCtrl.updateStatusEPA(memberEPA, item)" href="javascript:;">{{item.Name}}</a>
                                </li>
                            </ul>
                        </span>
                    </td>
                    <td class="text-center text-uppercase col-action">
                        <a class="evaluate-now button" href="" ng-click="reviewerCtrl.viewEPADetail(memberEPA)"
                           ng-href="{{reviewerCtrl.viewEPADetailUrl}}">
                            <span data-translate="EvaluateNow"></span>
                            <span class="glyphicon icon-breadcrumb"></span>
                        </a>
                    </td>
                </tr>
            </tbody>
            <tbody ng-if="reviewerCtrl.memberEPAs.length == 0">
                <tr>
                    <td class="empty-result" colspan="10" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
