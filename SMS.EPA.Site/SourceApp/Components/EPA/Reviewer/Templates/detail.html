<div class="form-reviewer" ng-controller="MemberEPAInfoOfReviewerController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MemberEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form class="epa-form">
            <div class="text-center epa-title" data-translate="EPATilte"></div>
            <div class="col-sm-12 list-group-item bottom-buffer" ng-init="memberEPAInfoCtrl.collapses['GeneralInfo'] = false;">
                <div class="boxtitle" data-translate="GeneralInfo"
                     ng-click="memberEPAInfoCtrl.collapses['GeneralInfo'] = !memberEPAInfoCtrl.collapses['GeneralInfo']"></div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['GeneralInfo']"
                     ng-include src="'/SourceApp/Components/EPA/Templates/generalInformation.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item">
                <div ng-include src="'/SourceApp/Components/EPA/Reviewer/Templates/listKPIRating.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item" ng-init="memberEPAInfoCtrl.collapses['Comments'] = false;">
                <div class="boxtitle" data-translate="Comments"
                     ng-click="memberEPAInfoCtrl.collapses['Comments'] = !memberEPAInfoCtrl.collapses['Comments']">
                </div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['Comments']">
                    <div class="row row-item">
                        <div class="col-sm-9">
                            <table class="table table-bordered table-striped">
                                <thead>
                                    <tr>
                                        <th colspan="2" data-translate="Employee"></th>
                                        <th colspan="3" data-translate="Evaluator"></th>
                                        <th rowspan="2" data-translate="AverageScoreByEvaluators"></th>
                                    </tr>
                                    <tr>
                                        <th data-translate="TotalScore" class="col-score"></th>
                                        <th data-translate="Comment"></th>
                                        <th data-translate="NickName"></th>
                                        <th data-translate="TotalScore"></th>
                                        <th data-translate="Comment"></th>
                                    </tr>
                                </thead>
                                <tbody ng-class-odd="'oddRow'" ng-class-even="'evenRow'">
                                    <tr ng-repeat="evaluator in memberEPAInfoCtrl.epaInfo.ProcessByEvaluators">
                                        <td rowspan="{{memberEPAInfoCtrl.epaInfo.NumberEvaluators}}" class="text-center col-total-score"
                                            ng-bind="memberEPAInfoCtrl.epaInfo.ProcessBySelf.TotalScore | customNumber" ng-show="$first"></td>
                                        <td rowspan="{{memberEPAInfoCtrl.epaInfo.NumberEvaluators}}" class="text-center" ng-show="$first">
                                            <span class="glyphicon icon-description"
                                                  ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.Comment.length > 0" tooltip="{{memberEPAInfoCtrl.epaInfo.ProcessBySelf.Comment}}"></span>
                                        </td>
                                        <td ng-bind="evaluator.NickName"></td>
                                        <td ng-bind="evaluator.TotalScore | customNumber" class="text-center col-total-score"></td>
                                        <td class="text-center">
                                            <span class="glyphicon icon-description"
                                                  ng-show="evaluator.Comment.length > 0" tooltip="{{evaluator.Comment}}"></span>
                                        </td>
                                        <td ng-bind="memberEPAInfoCtrl.epaInfo.AverageScoreByEvaluators | customNumber" class="text-center col-total-score"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="col-sm-3">
                            <div class="row total text-center pull-right">
                                <p data-translate="AttendanceScore"></p>
                                <p class="totalscore" ng-bind="memberEPAInfoCtrl.epaInfo.AttendanceScore | customNumber"></p>
                            </div>
                        </div>
                    </div>
                    <div class="row row-item">
                        <div class="form-horizontal">
                            <div class="form-group">
                                <label class="col-sm-1 control-label" data-translate="Score"></label>
                                <div class="col-sm-1 total-score-reviewer">
                                    <input type="text" class="form-control text-center" maxlength="5" ng-readonly="memberEPAInfoCtrl.isReadonly"
                                           ng-model="memberEPAInfoCtrl.epaInfo.ProcessByReviewers[0].TotalScore" ng-decimal fraction="2" />
                                </div>
                                <div class="col-sm-1">
                                    <label class="error-message" data-translate="(*)"></label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label" data-translate="Comment"></label>
                                <div class="col-sm-4 textarea-comment">
                                    <textarea class="form-control" ng-readonly="memberEPAInfoCtrl.isReadonly"
                                              ng-model="memberEPAInfoCtrl.epaInfo.ProcessByReviewers[0].Comment"></textarea>
                                </div>
                                <div class="col-sm-1">
                                    <label class="error-message" data-translate="(*)"></label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="boxcontent">
                    <div class="row row-item">
                        <label class="error-message">{{"Note" | translate }}: (*) {{"RequiredField" | translate}}!</label>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 epa-action-button text-center">
                <button class="button" ng-click="memberEPAInfoCtrl.save(memberEPAInfoCtrl.epaInfo)"
                        ng-show="memberEPAInfoCtrl.epaInfo && !memberEPAInfoCtrl.isReadonly" data-translate="Save"></button>
                <button class="btn btn-default customize" ng-click="memberEPAInfoCtrl.cancel()" data-translate="Cancel"></button>
            </div>
        </form>
    </div>
</div>
