<div class="form-reviewer" ng-controller="ReviewerDetailController as reviewerDetailCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MemberEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">
                <span data-translate="EPATilte"></span>
                <span> - {{reviewerDetailCtrl.epaInfo.Period.Name}}</span>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo">
                    <h4 class="panel-title" data-translate="GeneralInfo"></h4>
                </div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info">
                        <epa-general-infomation data-is-view-detail="reviewerDetailCtrl.isViewDetail"
                                                data-employee-info="reviewerDetailCtrl.epaInfo.Employee"
                                                data-evaluated-date="reviewerDetailCtrl.evaluatedDate"
                                                data-saved="reviewerDetailCtrl.dataSaved"></epa-general-infomation>
                    </div>
                </div>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".evaluationProcess">
                    <h4 class="panel-title text-uppercase" data-translate="EvaluationProcess"></h4>
                </div>
                <div class="panel-collapse collapse in evaluationProcess" auto-collapse data-collapsed="true">
                    <div class="panel-body evaluation-process-section">
                        <epa-evaluation-process data-epa-info="reviewerDetailCtrl.epaInfo"></epa-evaluation-process>
                    </div>
                </div>
            </div>

            <!-- performance result -->
            <any ng-switch="reviewerDetailCtrl.epaInfo.IsSemiHasMonthly">
                <any ng-switch-when="true">
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult">
                            <h4 class="panel-title" data-translate="PerformanceResult"></h4>
                        </div>
                        <div class="panel-collapse collapse in performanceResult">
                            <div class="panel-body summary-section">
                                <any ng-include src="'/SourceApp/Components/EPA/Reviewer/Templates/semiPerformanceResult.html'"></any>
                                <epa-performance-grade data-standard-grades="reviewerDetailCtrl.standardGrades"></epa-performance-grade>
                            </div>
                        </div>
                    </div>
                </any>

                <any ng-switch-default>
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult">
                            <h4 class="panel-title text-uppercase" data-translate="PerformanceResult"></h4>
                        </div>
                        <div class="panel-collapse collapse in performanceResult">
                            <div class="panel-body summary-section">
                                <any ng-include src="'/SourceApp/Components/EPA/Reviewer/Templates/performanceResult.html'"></any>
                                <epa-performance-grade data-standard-grades="reviewerDetailCtrl.standardGrades"
                                                       ng-if="!reviewerDetailCtrl.epaInfo.IsMonthly"></epa-performance-grade>
                            </div>
                        </div>
                    </div>
                </any>
            </any>

            <!-- recommendation -->
            <any ng-if="reviewerDetailCtrl.epaInfo.Recommendation && reviewerDetailCtrl.epaInfo.Recommendation.EPAId > 0">
                <any ng-if="reviewerDetailCtrl.epaInfo.IsProbation || reviewerDetailCtrl.epaInfo.IsPromotion">
                    <div ng-include src="'/SourceApp/Components/EPA/Reviewer/Templates/recommendationForProbationAndPromotion.html'"></div>
                </any>
                <any ng-if="reviewerDetailCtrl.epaInfo.IsSemiAnnual">
                    <div ng-include src="'/SourceApp/Components/EPA/Reviewer/Templates/recommendationForSemi.html'"></div>
                </any>
            </any>

            <div>&ensp;</div>

            <!-- performance detail -->
            <any ng-switch="reviewerDetailCtrl.epaInfo.IsSemiHasMonthly">
                <any ng-switch-when="true">
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".monthlyEPAs">
                            <h4 class="panel-title" data-translate="monthlyEPAs"></h4>
                        </div>
                        <div class="panel-collapse collapse in monthlyEPAs">
                            <div class="panel-body">
                                <epa-monthly-result data-epa-info="reviewerDetailCtrl.epaInfo"></epa-monthly-result>
                            </div>
                        </div>
                    </div>
                </any>

                <any ng-switch-default>
                    <epa-performance-detail data-epa-info="reviewerDetailCtrl.epaInfo"></epa-performance-detail>
                </any>
            </any>

        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="reviewerDetailCtrl.save(reviewerDetailCtrl.epaInfo)"
                        ng-if="reviewerDetailCtrl.epaInfo && reviewerDetailCtrl.epaInfo.IsAllowedToEdit" data-translate="Save"></button>
                <button class="btn btn-warning" ng-click="reviewerDetailCtrl.cancel()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
