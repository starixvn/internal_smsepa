<div class="panel panel-default">
    <div class="panel-heading" data-toggle="collapse" data-target=".recommendation">
        <h4 class="panel-title text-uppercase" data-translate="Recommendation"></h4>
    </div>
    <div class="panel-collapse collapse in recommendation">
        <div class="panel-body recommendation-section">
            <table class="table">
                <tbody>
                    <tr>
                        <td colspan="2">
                            <div class="checkbox" ng-class="{'disabled': !reviewerDetailCtrl.epaInfo.IsAllowedToEdit}">
                                <label>
                                    <input type="checkbox"
                                           ng-model="reviewerDetailCtrl.epaInfo.Recommendation.Promoted"
                                           ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit">
                                    {{"Promotion" | translate}}
                                </label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <div class="checkbox" ng-class="{'disabled': !reviewerDetailCtrl.epaInfo.IsAllowedToEdit}">
                                <label>
                                    <input type="checkbox"
                                           ng-model="reviewerDetailCtrl.epaInfo.Recommendation.PayIncreased"
                                           ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit">
                                    {{"AnnualIncrement" | translate}}
                                </label>
                            </div>
                        </td>
                    </tr>
                    <tr ng-show="reviewerDetailCtrl.epaInfo.Recommendation.Invalid">
                        <td colspan="2" class="error-message" data-translate="SemiRecommendationWarning"></td>
                    </tr>
                    <tr>
                        <td class="width-250">
                            <div class="checkbox" ng-class="{'disabled': !reviewerDetailCtrl.epaInfo.IsAllowedToEdit}">
                                <label>
                                    <input type="checkbox"
                                           ng-model="reviewerDetailCtrl.epaInfo.Recommendation.JobGradeIncreased"
                                           ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit">
                                    {{"JobGrade" | translate}}
                                </label>
                            </div>
                        </td>
                        <td ng-show="reviewerDetailCtrl.epaInfo.Recommendation.JobGradeIncreased">
                            <select class="jobGrades"
                                    ng-model="reviewerDetailCtrl.epaInfo.Recommendation.JobGrade.JobGradeId"
                                    ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit"
                                    ng-options="opt.JobGradeId as opt.Name for opt in reviewerDetailCtrl.jobGrades">
                                <option style="display: none" value="">-- Select a job grade --</option>
                            </select>
                            <label class="error-message">(*)</label>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
