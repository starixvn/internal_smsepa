<div class="panel panel-default">
    <div class="panel-heading" data-toggle="collapse" data-target=".recommendation">
        <h4 class="panel-title text-uppercase" data-translate="Recommendation"></h4>
    </div>
    <div class="panel-collapse collapse in recommendation">
        <div class="panel-body recommendation-section">
            <div>Based on the evaluation above, I recommend the employee:</div>
            <table class="table table-bordered table-custom" style="width: auto">
                <thead>
                    <tr>
                        <th class="width-250"></th>
                        <th style="min-width: 150px; max-width: 250px">{{"Evaluator" | translate}}</th>
                        <th style="min-width: 150px; max-width: 250px">{{"Reviewer" | translate}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>{{"Promotion" | translate}}</td>
                        <td class="text-center">
                            <input type="checkbox" disabled
                                   ng-model="reviewerDetailCtrl.epaInfo.EvaluatorRecommendation.Promoted" />
                        </td>
                        <td class="text-center">
                            <input type="checkbox"
                                   ng-model="reviewerDetailCtrl.epaInfo.Recommendation.Promoted"
                                   ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit" />
                        </td>
                    </tr>
                    <tr>
                        <td>{{"AnnualIncrement" | translate}}</td>
                        <td class="text-center">
                            <input type="checkbox" disabled
                                   ng-model="reviewerDetailCtrl.epaInfo.EvaluatorRecommendation.PayIncreased" />
                        </td>
                        <td class="text-center">
                            <input type="checkbox"
                                   ng-model="reviewerDetailCtrl.epaInfo.Recommendation.PayIncreased"
                                   ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit" />
                        </td>
                    </tr>
                    <tr>
                        <td>{{"JobLevel" | translate}}</td>
                        <td class="text-center">
                            <div>
                                <input type="checkbox" disabled
                                       ng-model="reviewerDetailCtrl.epaInfo.EvaluatorRecommendation.JobLevelIncreased" />
                            </div>
                            <div ng-if="reviewerDetailCtrl.epaInfo.EvaluatorRecommendation.JobLevelIncreased">
                                <select class="jobLevels" disabled
                                        ng-model="reviewerDetailCtrl.epaInfo.EvaluatorRecommendation.JobLevel.JobLevelId"
                                        ng-options="opt.JobLevelId as opt.Name for opt in reviewerDetailCtrl.jobLevels">
                                    <option style="display: none" value="">-- Select a job level --</option>
                                </select>
                            </div>
                        </td>
                        <td class="text-center">
                            <div>
                                <input type="checkbox"
                                       ng-model="reviewerDetailCtrl.epaInfo.Recommendation.JobLevelIncreased"
                                       ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit" />
                            </div>
                            <div ng-show="reviewerDetailCtrl.epaInfo.Recommendation.JobLevelIncreased">
                                <select class="jobLevels"
                                        ng-model="reviewerDetailCtrl.epaInfo.Recommendation.JobLevel.JobLevelId"
                                        ng-disabled="!reviewerDetailCtrl.epaInfo.IsAllowedToEdit"
                                        ng-options="opt.JobLevelId as opt.Name for opt in reviewerDetailCtrl.jobLevels">
                                    <option style="display: none" value="">-- Select a job level --</option>
                                </select>
                                <label class="error-message">(*)</label>
                                <span class="error-message"
                                      ng-show="reviewerDetailCtrl.epaInfo.Recommendation.Invalid"
                                      data-translate="JobLevelRequired"></span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
