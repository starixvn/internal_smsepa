<div class="row">
    <div class="col-sm-2 text-center">
        <div class="row pull-left">
            <div class="img-user">
                <img class="img-default" ng-src="{{memberEPAInfoCtrl.epaInfo.Employee.Avatar}}" alt="User" />
            </div>
        </div>
    </div>
    <div class="col-sm-10">
        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="EmployeeCode"></div>
                <div class="col-sm-7">
                    <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.Code"></strong>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="NickName"></div>
                <div class="col-sm-7">
                    <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.NickName"></strong>
                </div>
            </div>
        </div>
        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="FullName"></div>
                <div class="col-sm-7">
                    <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.FullName"></strong>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="JobTitle"></div>
                <div class="col-sm-7">
                    <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.JobTitle.JobTitleName"></strong>
                </div>
            </div>
        </div>
        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="Department"></div>
                <div class="col-sm-7">
                    <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.Department.Name"></strong>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="Section"></div>
                <div class="col-sm-7">
                    <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.Group.GroupName"></strong>
                </div>
            </div>
        </div>
        <div class="row row-item line" ng-show="!memberEPAInfoCtrl.isViewDetail">
            <div class="col-sm-6">
                <div class="col-sm-4" data-translate="Evaluated"></div>
                <div class="col-sm-7">
                    <span class="glyphicon glyphicon-saved epa-saved"
                          ng-show="memberEPAInfoCtrl.evaluatedDate || memberEPAInfoCtrl.dataSaved"></span>
                    <span class="glyphicon glyphicon-list-alt epa-unsaved"
                          ng-show="memberEPAInfoCtrl.evaluatedDate == null && !memberEPAInfoCtrl.dataSaved"></span>
                </div>
            </div>
        </div>
    </div>
</div>
