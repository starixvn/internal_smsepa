<div id="adjustScorePopup">
    <div class="modal-header">
        <div class="popup-header">
            {{"AdjustScore" | translate}}
            <span class="close-popup" ng-click="modalAdjustScoreCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body modal-adjust-score">
        <div class="row">
            <form class="row form-horizontal col-sm-11" role="form">
                <div class="form-group required">
                    <label class="col-sm-4 control-label" data-translate="Score"></label>
                    <div class="col-sm-4 field">
                        <input type="text" maxlength="7" class="form-control text-center epa-input-score" ng-model="modalAdjustScoreCtrl.adjust.Score" required numeric decimals="2" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-4 control-label" data-translate="Comment"></label>
                    <div class="col-sm-8 field">
                        <textarea type="text" maxlength="2000" class="form-control comment" ng-model="modalAdjustScoreCtrl.adjust.Comment"></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" ng-click="modalAdjustScoreCtrl.ok()" data-translate="OK"></button>
        <button class="btn btn-cancel" ng-click="modalAdjustScoreCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
