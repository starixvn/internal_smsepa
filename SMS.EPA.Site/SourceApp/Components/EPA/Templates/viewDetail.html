<div ng-controller="ViewEPADetailController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header" id="titleSection">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EPAResult"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form" ng-class="{removePadding:memberEPAInfoCtrl.isRemovedPadding}">
            <div class="text-center epa-title">
                <span data-translate="EPATilte"></span>
                <span> - {{memberEPAInfoCtrl.epaInfo.Period.Name}}</span>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo">
                    <h4 class="panel-title" data-translate="GeneralInfo"></h4>
                </div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info" ng-include src="'/SourceApp/Components/EPA/Templates/generalInformation.html'"></div>
                </div>
            </div>

            <div class="col-sm-12 list-group-item bottom-buffer summary-section" ng-init="memberEPAInfoCtrl.collapses['PerformanceResult'] = false;">
                <div class="boxtitle text-uppercase" data-translate="PerformanceResult"
                     ng-click="memberEPAInfoCtrl.collapses['PerformanceResult'] = !memberEPAInfoCtrl.collapses['PerformanceResult']"></div>
                <div class="boxcontent" collapse="memberEPAInfoCtrl.collapses['PerformanceResult']"
                     ng-include src="'/SourceApp/Components/EPA/Templates/performanceResult.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item">
                <div ng-include src="'/SourceApp/Components/EPA/Templates/performanceDetails.html'"></div>
            </div>
        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section" id="footerSection">
            <div class="container text-center">
                <button class="btn btn-warning customize" ng-click="memberEPAInfoCtrl.back()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
