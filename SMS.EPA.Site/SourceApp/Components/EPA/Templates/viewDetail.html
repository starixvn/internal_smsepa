<div ng-controller="ViewEPADetailController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EPAResult"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">
                <span data-translate="EPATilte"></span>
                <span> - {{memberEPAInfoCtrl.epaInfo.Period.Name}}</span>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo">
                    <h4 class="panel-title" data-translate="GeneralInfo"></h4>
                </div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info">
                        <epa-general-infomation data-is-view-detail="memberEPAInfoCtrl.isViewDetail"
                                                data-employee-info="memberEPAInfoCtrl.epaInfo.Employee"
                                                data-evaluated-date="memberEPAInfoCtrl.evaluatedDate"
                                                data-saved="memberEPAInfoCtrl.dataSaved"></epa-general-infomation>
                    </div>
                </div>
            </div>

            <!-- performance result -->
            <any ng-switch="memberEPAInfoCtrl.epaInfo.IsSemiHasMonthly">
                <any ng-switch-when="true">
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult">
                            <h4 class="panel-title text-uppercase" data-translate="PerformanceResult"></h4>
                        </div>
                        <div class="panel-collapse collapse in performanceResult">
                            <div class="panel-body summary-section" ng-include src="'/SourceApp/Components/EPA/Templates/semiPerformanceResult.html'"></div>
                        </div>
                    </div>
                </any>

                <any ng-switch-default>
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult">
                            <h4 class="panel-title text-uppercase" data-translate="PerformanceResult"></h4>
                        </div>
                        <div class="panel-collapse collapse in performanceResult">
                            <div class="panel-body summary-section" ng-include src="'/SourceApp/Components/EPA/Templates/performanceResult.html'"></div>
                        </div>
                    </div>
                </any>
            </any>

            <!-- recommendation -->
            <any ng-if="memberEPAInfoCtrl.epaInfo.Recommendation && memberEPAInfoCtrl.epaInfo.Recommendation.EPAId > 0">
                <any ng-if="memberEPAInfoCtrl.epaInfo.IsProbation || memberEPAInfoCtrl.epaInfo.IsPromotion">
                    <div ng-include src="'/SourceApp/Components/EPA/Templates/recommendationForProbationAndPromotion.html'"></div>
                </any>
                <any ng-if="memberEPAInfoCtrl.epaInfo.IsSemiAnnual">
                    <div ng-include src="'/SourceApp/Components/EPA/Templates/recommendationForSemi.html'"></div>
                </any>
            </any>

            <div>&ensp;</div>

            <!-- performance detail -->
            <any ng-switch="memberEPAInfoCtrl.epaInfo.IsSemiHasMonthly">
                <any ng-switch-when="true">
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".monthlyEPAs">
                            <h4 class="panel-title">{{"Monthly EPAs" | translate}}</h4>
                        </div>
                        <div class="panel-collapse collapse in monthlyEPAs">
                            <div class="panel-body summary-section" ng-include src="'/SourceApp/Components/EPA/Templates/monthlyEPAs.html'"></div>
                        </div>
                    </div>
                </any>

                <any ng-switch-default>
                    <div ng-include src="'/SourceApp/Components/EPA/Templates/performanceDetails.html'"></div>
                </any>
            </any>
        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="memberEPAInfoCtrl.exportPdf()" data-translate="ExportPdf"
                        ng-show="memberEPAInfoCtrl.allowedExportPdf && memberEPAInfoCtrl.epaInfo.Period.IsEndPeriod"></button>
                <button class="btn btn-warning" ng-click="memberEPAInfoCtrl.back()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
