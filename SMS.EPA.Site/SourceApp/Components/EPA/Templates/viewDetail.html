<div ng-controller="EPADetailController as epaDetailCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EPAResult"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">
                <span data-translate="EPATilte"></span>
                <span> - {{epaDetailCtrl.epaInfo.Period.Name}}</span>
            </div>

            <div class="panel panel-default">
                <div class="panel-heading" data-toggle="collapse" data-target=".generalInfo" data-translate="GeneralInfo"></div>
                <div class="panel-collapse collapse in generalInfo">
                    <div class="panel-body general-info">
                        <epa-general-infomation data-is-view-detail="epaDetailCtrl.isViewDetail"
                                                data-employee-info="epaDetailCtrl.epaInfo.Employee"
                                                data-evaluated-date="epaDetailCtrl.evaluatedDate"
                                                data-saved="epaDetailCtrl.dataSaved"></epa-general-infomation>
                    </div>
                </div>
            </div>

            <!-- performance result -->
            <any ng-switch="epaDetailCtrl.epaInfo.IsSemiHasMonthly">
                <any ng-switch-when="true">
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult" data-translate="PerformanceResult"></div>
                        <div class="panel-collapse collapse in performanceResult">
                            <div class="panel-body summary-section">
                                <epa-semi-performance-result data-epa-info="epaDetailCtrl.epaInfo"></epa-semi-performance-result>
                                <epa-performance-grade data-standard-grades="epaDetailCtrl.standardGrades"></epa-performance-grade>
                            </div>
                        </div>
                    </div>
                </any>

                <any ng-switch-default>
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".performanceResult" data-translate="PerformanceResult"></div>
                        <div class="panel-collapse collapse in performanceResult">
                            <div class="panel-body summary-section">
                                <epa-performance-result data-epa-info="epaDetailCtrl.epaInfo"></epa-performance-result>
                                <epa-performance-grade data-standard-grades="epaDetailCtrl.standardGrades"></epa-performance-grade>
                            </div>
                        </div>
                    </div>
                </any>
            </any>

            <!-- recommendation -->
            <epa-recommendation data-epa-info="epaDetailCtrl.epaInfo"
                                data-job-grades="epaDetailCtrl.jobGrades"
                                ng-if="epaDetailCtrl.epaInfo.Recommendations && epaDetailCtrl.epaInfo.Recommendations.length > 0"></epa-recommendation>

            <div>&ensp;</div>

            <!-- performance detail -->
            <any ng-switch="epaDetailCtrl.epaInfo.IsSemiHasMonthly">
                <any ng-switch-when="true">
                    <div class="panel panel-default">
                        <div class="panel-heading" data-toggle="collapse" data-target=".monthlyEPAs">{{"Monthly EPAs" | translate}}</div>
                        <div class="panel-collapse collapse in monthlyEPAs">
                            <div class="panel-body">
                                <epa-monthly-result data-epa-info="epaDetailCtrl.epaInfo"></epa-monthly-result>
                            </div>
                        </div>
                    </div>
                </any>

                <any ng-switch-default>
                    <epa-performance-detail data-epa-info="epaDetailCtrl.epaInfo"></epa-performance-detail>
                </any>
            </any>
        </div>
        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <div class="container text-center">
                <button class="btn btn-primary" ng-click="epaDetailCtrl.exportPdf()" data-translate="ExportPdf"
                        ng-show="epaDetailCtrl.allowedExportPdf"></button>
                <button class="btn btn-warning" ng-click="epaDetailCtrl.back()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
