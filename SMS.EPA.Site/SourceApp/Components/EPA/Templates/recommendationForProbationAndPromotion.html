<div class="panel panel-default">
    <div class="panel-heading" data-toggle="collapse" data-target=".recommendation">
        <h4 class="panel-title text-uppercase" data-translate="Recommendation"></h4>
    </div>
    <div class="panel-collapse collapse in recommendation">
        <div class="panel-body recommendation-section">
            <div class="radio disabled">
                <label>
                    <input type="radio" name="optionsRadios" ng-checked="memberEPAInfoCtrl.epaInfo.Recommendation.PassedProbation" disabled>
                    {{"PassProbation" | translate}}
                </label>
            </div>
            <div class="radio disabled">
                <label>
                    <input type="radio" name="optionsRadios" ng-checked="memberEPAInfoCtrl.epaInfo.Recommendation.ExtendedProbation" disabled>
                    {{"ExtendProbation" | translate}}
                </label>
            </div>
            <div class="radio disabled">
                <label>
                    <input type="radio" name="optionsRadios" ng-checked="memberEPAInfoCtrl.epaInfo.Recommendation.FailedProbation" disabled>
                    {{"FailProbation" | translate}}
                </label>
            </div>
        </div>
    </div>
</div>
