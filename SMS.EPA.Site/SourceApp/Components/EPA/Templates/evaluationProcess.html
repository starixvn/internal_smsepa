<ul class="evaluation-process" class="evaluation-process">
    <li ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.ProcessBySelf.StatusEndProcess)" class="process-item">
        <div><strong data-translate="Self"></strong></div>
        <div>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.ProcessBySelf.StartDate | customDate"></span>
            <span> - </span>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.ProcessBySelf.EndDate | customDate"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.StatusEndProcess == 1">
            <label data-translate="EndProcess"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.StatusEndProcess == 0">
            <label data-translate="InProgress"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.StatusEndProcess == 2">
            <label data-translate="Open"></label><span class="icon-process"></span>
        </div>
    </li>
    <li ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.Evaluators[0].StatusEndProcess)" class="process-item">
        <div>
            <strong>{{"Evaluator" | translate}}: </strong>
            <span ng-show="memberEPAInfoCtrl.epaInfo.Evaluators.length == 1" ng-bind="memberEPAInfoCtrl.epaInfo.Evaluators[0].NickName"
                  popover-avatar avatar-src="{{memberEPAInfoCtrl.epaInfo.Evaluators[0].Avatar}}"></span>
            <span ng-show="memberEPAInfoCtrl.epaInfo.Evaluators.length > 1" ng-repeat="evaluator in memberEPAInfoCtrl.epaInfo.Evaluators">
                <span ng-show="!$last" popover-avatar avatar-src="{{evaluator.Avatar}}">{{evaluator.NickName}}, </span>
                <span ng-show="$last" popover-avatar avatar-src="{{evaluator.Avatar}}">{{evaluator.NickName}}</span>
            </span>
        </div>
        <div>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.Evaluators[0].StartDate | customDate"></span>
            <span> - </span>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.Evaluators[0].EndDate | customDate"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Evaluators[0].StatusEndProcess == 1">
            <label data-translate="EndProcess"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Evaluators[0].StatusEndProcess == 0">
            <label data-translate="InProgress"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Evaluators[0].StatusEndProcess == 2">
            <label data-translate="Open"></label><span class="icon-process"></span>
        </div>
    </li>
    <li ng-show="memberEPAInfoCtrl.epaInfo.Reviewers.length > 0"
        ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.Reviewers[0].StatusEndProcess)" class="process-item">
        <div>
            <strong>{{"Reviewer" | translate}}:</strong>
            <span ng-show="memberEPAInfoCtrl.epaInfo.Reviewers.length == 1" ng-bind="memberEPAInfoCtrl.epaInfo.Reviewers[0].NickName"
                  popover-avatar avatar-src="{{memberEPAInfoCtrl.epaInfo.Reviewers[0].Avatar}}">></span>
            <span ng-show="memberEPAInfoCtrl.epaInfo.Reviewers.length > 1" ng-repeat="reviewer in memberEPAInfoCtrl.epaInfo.Reviewers">
                <span ng-show="!$last" popover-avatar avatar-src="{{reviewer.Avatar}}">{{reviewer.NickName}}, </span>
                <span ng-show="$last" popover-avatar avatar-src="{{reviewer.Avatar}}">{{reviewer.NickName}}</span>
            </span>
        </div>
        <div>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.Reviewers[0].StartDate | customDate"></span>
            <span> - </span>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.Reviewers[0].EndDate | customDate"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Reviewers[0].StatusEndProcess == 1">
            <label data-translate="EndProcess"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Reviewers[0].StatusEndProcess == 0">
            <label data-translate="InProgress"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Reviewers[0].StatusEndProcess == 2">
            <label data-translate="Open"></label><span class="icon-process"></span>
        </div>
    </li>
    <li ng-show="memberEPAInfoCtrl.epaInfo.Managements.length > 0"
        ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.Managements[0].StatusEndProcess)" class="process-item">
        <div>
            <strong>{{"Management" | translate}}:</strong>
            <span ng-show="memberEPAInfoCtrl.epaInfo.Managements.length == 1" ng-bind="memberEPAInfoCtrl.epaInfo.Managements[0].NickName"
                  popover-avatar avatar-src="{{memberEPAInfoCtrl.epaInfo.Managements[0].Avatar}}"></span>
            <span ng-show="memberEPAInfoCtrl.epaInfo.Managements.length > 1" ng-repeat="management in memberEPAInfoCtrl.epaInfo.Managements">
                <span ng-show="!$last" popover-avatar avatar-src="{{management.Avatar}}">{{management.NickName}}, </span>
                <span ng-show="$last" popover-avatar avatar-src="{{management.Avatar}}">{{management.NickName}}</span>
            </span>
        </div>
        <div>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.Managements[0].StartDate | customDate"></span>
            <span> - </span>
            <span ng-bind="memberEPAInfoCtrl.epaInfo.Managements[0].EndDate | customDate"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Managements[0].StatusEndProcess == 1">
            <label data-translate="EndProcess"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Managements[0].StatusEndProcess == 0">
            <label data-translate="InProgress"></label><span class="icon-process"></span>
        </div>
        <div ng-show="memberEPAInfoCtrl.epaInfo.Managements[0].StatusEndProcess == 2">
            <label data-translate="Open"></label><span class="icon-process"></span>
        </div>
    </li>
    <li ng-show="memberEPAInfoCtrl.epaInfo.Period.TargetTypeId == 3" class="process-item final">
        <div><strong data-translate="FinalScore"></strong></div>
        <div>
            <span data-translate="EndPeriod"></span>: <span ng-bind="memberEPAInfoCtrl.epaInfo.Period.EndDate | customDate"></span>
        </div>
    </li>
</ul>
