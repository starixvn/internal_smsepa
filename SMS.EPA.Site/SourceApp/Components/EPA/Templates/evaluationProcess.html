<table class="table table-evaluation-process">
    <tbody>
        <tr>
            <td class="text-center" data-translate="Self"></td>
            <td class="text-center">
                <div ng-bind="memberEPAInfoCtrl.epaInfo.ProcessBySelf.StartDate | customDate"></div>
                <progressbar ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess)">
                    <div ng-show="memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" data-translate="EndProcess"></div>
                    <div ng-show="!memberEPAInfoCtrl.epaInfo.ProcessBySelf.IsEndProcess" data-translate="InProgress"></div>
                </progressbar>
                <div ng-bind="memberEPAInfoCtrl.epaInfo.ProcessBySelf.EndDate | customDate"></div>
            </td>
            <td class="text-center" data-translate="Evaluator"></td>
            <td class="text-center">
                <div ng-bind="memberEPAInfoCtrl.epaInfo.Evaluators[0].StartDate | customDate"></div>
                <progressbar ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.Evaluators[0].IsEndProcess)">
                    <div ng-show="memberEPAInfoCtrl.epaInfo.Evaluators[0].IsEndProcess" data-translate="EndProcess"></div>
                    <div ng-show="!memberEPAInfoCtrl.epaInfo.Evaluators[0].IsEndProcess" data-translate="InProgress"></div>
                </progressbar>
                <div ng-bind="memberEPAInfoCtrl.epaInfo.Evaluators[0].EndDate | customDate"></div>
            </td>
            <td class="text-center col-evaluator" ng-show="memberEPAInfoCtrl.epaInfo.Reviewers.length > 0" data-translate="Reviewer"></td>
            <td class="text-center" ng-show="memberEPAInfoCtrl.epaInfo.Reviewers.length > 0">
                <div ng-bind="memberEPAInfoCtrl.epaInfo.Reviewers[0].StartDate | customDate"></div>
                <progressbar ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.Reviewers[0].IsEndProcess)">
                    <div ng-show="memberEPAInfoCtrl.epaInfo.Reviewers[0].IsEndProcess" data-translate="EndProcess"></div>
                    <div ng-show="!memberEPAInfoCtrl.epaInfo.Reviewers[0].IsEndProcess" data-translate="InProgress"></div>
                </progressbar>
                <div ng-bind="memberEPAInfoCtrl.epaInfo.Reviewers[0].EndDate | customDate"></div>
            </td>
            <td class="text-center col-evaluator" ng-show="memberEPAInfoCtrl.epaInfo.Managements.length > 0" data-translate="Management"></td>
            <td class="text-center" ng-show="memberEPAInfoCtrl.epaInfo.Managements.length > 0">
                <div ng-bind="memberEPAInfoCtrl.epaInfo.Managements[0].StartDate | customDate"></div>
                <progressbar ng-class="memberEPAInfoCtrl.getClassProgress(memberEPAInfoCtrl.epaInfo.Managements[0].IsEndProcess)">
                    <div ng-show="memberEPAInfoCtrl.epaInfo.Managements[0].IsEndProcess" data-translate="EndProcess"></div>
                    <div ng-show="!memberEPAInfoCtrl.epaInfo.Managements[0].IsEndProcess" data-translate="InProgress"></div>
                </progressbar>
                <div ng-bind="memberEPAInfoCtrl.epaInfo.Managements[0].EndDate | customDate"></div>
            </td>
        </tr>
    </tbody>
</table>
