<div id="notificationPopup">
    <div class="modal-header">
        <div class="popup-header">
            {{"Notification" | translate}}
            <span class="close-popup" ng-click="modalNotificationCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body modal-notification">
        <div ng-bind="modalNotificationCtrl.message"></div>
    </div>
    <div class="modal-footer">
        <button class="button" ng-click="modalNotificationCtrl.cancel()" data-translate="OK"></button>
    </div>
</div>
