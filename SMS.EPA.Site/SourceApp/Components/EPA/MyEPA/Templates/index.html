<div class="my-epa" ng-controller="EmployeeEPAController as empEPACtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ManageMyEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <table class="row table table-bordered table-striped">
            <thead>
                <tr>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="PeriodName"></th>
                    <th data-translate="StartDate"></th>
                    <th data-translate="EndDate"></th>
                    <th data-translate="Detail"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="myEPA in empEPACtrl.myEPAs">
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td ng-bind="myEPA.Period.Name"></td>
                    <td class="text-center">{{ myEPA.ProcessBySelf.StartDate | customDate }}</td>
                    <td class="text-center">{{ myEPA.ProcessBySelf.EndDate | customDate }}</td>
                    <td class="text-center col-action">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="empEPACtrl.viewEPADetail(myEPA)"
                           ng-if="!myEPA.HasMonthlyEPA && !myEPA.ProcessBySelf.IsEndProcess && !myEPA.Period.IsEndPeriod"
                           ng-href="{{empEPACtrl.viewEPADetailUrl}}" ng-attr-title='{{"EvaluateNow" | translate}}'></a>
                        <a class="glyphicon icon-view" href="" ng-click="empEPACtrl.viewEPAResult(myEPA)"
                           ng-if="!myEPA.HasMonthlyEPA && myEPA.ProcessBySelf.IsEndProcess || myEPA.Period.IsEndPeriod"
                           ng-href="{{empEPACtrl.viewEPAResultUrl}}" ng-attr-title='{{"ViewEPAResult" | translate}}'></a>
                        <a class="glyphicon icon-view" href="" ng-click="empEPACtrl.viewSemiEPAResult(myEPA)"
                           ng-if="myEPA.HasMonthlyEPA"
                           ng-href="{{empEPACtrl.viewEPAResultUrl}}" ng-attr-title='{{"ViewEPAResult" | translate}}'></a>

                    </td>
                </tr>
                <tr ng-show="empEPACtrl.myEPAs.length == 0">
                    <td class="empty-result" colspan="10" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
