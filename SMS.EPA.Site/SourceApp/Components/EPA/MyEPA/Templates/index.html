<div class="my-epa" ng-controller="EmployeeEPAController as empEPACtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ManageMyEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-inline" role="form">
            <div class="form-group">
                <label data-translate="Status"></label>
                <select class="form-control" ng-model="empEPACtrl.filter.status"
                        ng-options="opt.StatusId as opt.Name for opt in empEPACtrl.statusList">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <button class="button" ng-click="empEPACtrl.query(empEPACtrl.filter)" data-translate="Submit"></button>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
            <th data-translate="SymbolCount"></th>
            <th data-translate="Department"></th>
            <th data-translate="Team"></th>
            <th data-translate="Target"></th>
            <th data-translate="Score" class="epa-score"></th>
            <th data-translate="Status"></th>
            <th data-translate="Evaluator"></th>
            <th data-translate="EvaluateDate"></th>
            </thead>
            <tbody>
                <tr ng-repeat="item in empEPACtrl.listEPA">
                    <td class="text-center" ng-bind="$index + 1"></td>
                    <td ng-bind="item.Department.Name"></td>
                    <td class="text-center">
                        <span tooltip="{{item.Group.GroupName}}" ng-bind="item.Group.GroupCode"></span>
                    </td>
                    <td></td>
                    <td class="text-center epa-score">
                        <a href="" ng-bind="item.Score | customNumber" ng-click="empEPACtrl.viewEPADetail(item)"
                           ng-href="{{empEPACtrl.viewEPADetailUrl}}" ng-if="item.Score" />
                        <a href="" ng-bind="'N/A'" ng-click="empEPACtrl.viewEPADetail(item)"
                           ng-href="{{empEPACtrl.viewEPADetailUrl}} ng-if=" !item.score" />
                    </td>
                    <td class="text-center" ng-bind="item.Status.Name"></td>
                    <td>
                        <span ng-bind="item.Evaluator.NickName" tooltip="{{item.Evaluator.FullName}}"></span>
                    </td>
                    <td class="text-center">
                        {{item.evaluateDate | customDate }}
                    </td>
                </tr>
                <tr ng-if="empEPACtrl.listEPA.length == 0">
                    <td class="empty-result" colspan="8" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
