<div ng-controller="EmployeeEPAInfoController as empEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MyEPA"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form class="epa-form">
            <div class="text-center epa-title" data-translate="EPATilte"></div>
            <div class="col-sm-12 list-group-item bottom-buffer" ng-init="empEPAInfoCtrl.collapses['GeneralInfo'] = false;">
                <div class="boxtitle" data-translate="GeneralInfo"
                     ng-click="empEPAInfoCtrl.collapses['GeneralInfo'] = !empEPAInfoCtrl.collapses['GeneralInfo']"></div>
                <div class="boxcontent" collapse="empEPAInfoCtrl.collapses['GeneralInfo']"
                     ng-include src="'/SourceApp/Components/EPA/MyEPA/Templates/generalInformation.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item bottom-buffer" ng-init="empEPAInfoCtrl.collapses['RatingInstruction'] = true;">
                <div class="boxtitle" data-translate="RatingInstruction"
                     ng-click="empEPAInfoCtrl.collapses['RatingInstruction'] = !empEPAInfoCtrl.collapses['RatingInstruction']"></div>
                <div class="boxcontent" collapse="empEPAInfoCtrl.collapses['RatingInstruction']">
                    <div class="row row-item">
                        <span class="note">* {{"RatingCriteria" | translate}}:</span>
                        <span data-translate="MessageRatingInstructions"></span>
                        <div ng-include src="'/SourceApp/Components/EPA/MyEPA/Templates/ratingInstruction.html'"></div>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 list-group-item">
                <div ng-include src="'/SourceApp/Components/EPA/MyEPA/Templates/listKPIRating.html'"></div>
            </div>
            <div class="col-sm-12 list-group-item" ng-init="empEPAInfoCtrl.collapses['Comments'] = false;">
                <div class="boxtitle" data-translate="Comments"
                     ng-click="empEPAInfoCtrl.collapses['Comments'] = !empEPAInfoCtrl.collapses['Comments']">
                </div>
                <div class="boxcontent" collapse="empEPAInfoCtrl.collapses['Comments']">
                    <div class="row row-item">
                        <div class="col-sm-8 textarea-comment">
                            <div class="error-message" ng-show="empEPAInfoCtrl.epaInfo.CommentValid" data-translate="FieldRequire"></div>
                            <textarea class="form-control" ng-model="empEPAInfoCtrl.epaInfo.Comment"></textarea>
                        </div>
                        <div class="col-sm-1">
                            <label class="error-message" data-translate="*"></label>
                        </div>
                        <div class="col-sm-3">
                            <div class="total text-center pull-right">
                                <p data-translate="Total"></p>
                                <p class="finalscore" ng-bind="empEPAInfoCtrl.epaInfo.FinalScore"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="boxcontent">
                    <div class="row row-item">
                        <label class="error-message">{{"Note" | translate }}: (*) {{"RequiredField" | translate}}!</label>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 epa-action-button text-center">
                <button class="button" ng-click="empEPAInfoCtrl.save(empEPAInfoCtrl.epaInfo)" data-translate="Save"></button>
                <button class="btn btn-default customize" ng-click="empEPAInfoCtrl.cancel()" data-translate="Cancel"></button>
            </div>
        </form>
    </div>
</div>
