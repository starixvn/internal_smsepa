<div class="col-sm-12" ng-controller="UpdatePeriodController as updateCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb float-left">
            <li class="current" data-translate="UpdatePeriod"></li>
        </ul>
        <button ng-click="updateCtrl.backToList()" class="btn btn-cancel">
            <span class="glyphicon glyphicon-menu-left"></span> <span data-translate="BackToList"></span>
        </button>
    </div>
    <div class="target-tabset">
        <uib-tabset id="PeriodTab" active="updateCtrl.dataTab">
            <uib-tab heading="BASIC INFO" class="tab-cursor" index="1" select="updateCtrl.dataTab = 1">
                <div ng-include src="'/SourceApp/Components/Period/Templates/basicInformation.html'"></div>
            </uib-tab>
            <uib-tab heading="PROCESS SETTING" class="tab-cursor" index="2" select="updateCtrl.dataTab = 2">
                <div ng-include src="'/SourceApp/Components/Period/Templates/processSetting.html'"></div>
            </uib-tab>
            <uib-tab heading="EMPLOYEE SETTING" class="tab-cursor" index="3" select="updateCtrl.dataTab = 3">
                <div ng-include src="'/SourceApp/Components/Period/Templates/employeeSetting.html'"></div>
            </uib-tab>
        </uib-tabset>
    </div>
</div>
