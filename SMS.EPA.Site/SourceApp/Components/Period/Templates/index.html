<div class="col-sm-12" ng-controller="PeriodController as periodCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EvaluationPeriod"></li>
        </ul>
    </div>

    <form novalidate class="row form-inline filter">
        <div class="form-group">
            <label data-translate="TargetType"></label>
            <select class="form-control lstBox-limit" ng-model="periodCtrl.filter.model.targetTypeId"
                    ng-options="opt.TargetTypeId as opt.Name for opt in periodCtrl.targetTypes">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="Status"></label>
            <select class="form-control" ng-model="periodCtrl.filter.model.isActive">
                <option value="">-- {{"All" | translate}} --</option>
                <option selected value="true" data-translate="Active"></option>
                <option value="false" data-translate="InActive"></option>
            </select>
        </div>
        <div class="form-group">
            <button class="button" ng-click="periodCtrl.query(periodCtrl.filter.model)" data-translate="Search"></button>
        </div>
    </form>

    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="8">
                    <a class="pull-left button-icon create-button" href="" ng-click="periodCtrl.create()" ng-show="periodCtrl.permission == periodCtrl.policyEnum.Host">
                        <span class="icon plus"></span>
                        <span class="button-text" data-translate="CreateEvaluationPeriod"></span>
                    </a>
                    <input type="text" ng-model="periodCtrl.searchKey" ng-change="periodCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount">
                </th>
                <th data-translate="Name">
                </th>
                <th data-translate="TargetType">
                </th>
                <th data-translate="StartDate">
                </th>
                <th data-translate="EndDate">
                </th>
                <th data-translate="NumberEmployees">
                </th>
                <th data-translate="Active">
                </th>
                <th data-translate="Action">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr dir-paginate="period in periodCtrl.filteredItems | itemsPerPage: periodCtrl.pageSize" current-page="periodCtrl.currentPage">
                <td class="text-center" ng-bind="periodCtrl.getIndex($index, periodCtrl.currentPage, periodCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="period.Name"></td>
                <td class="text-center" ng-bind="period.TargetType.Name"></td>
                <td class="text-center" ng-bind="period.StartDate | date: periodCtrl.dateFormat"></td>
                <td class="text-center" ng-bind="period.EndDate | date: periodCtrl.dateFormat"></td>
                <td class="text-center">
                    <a href="{{periodCtrl.viewEmployeeSettingUrl}}" ng-click="periodCtrl.viewEmployeeSetting(period)">{{period.NumberEmployees}}</a>
                </td>
                <td class="text-center">
                    <input type="checkbox" ng-checked="period.IsActive" ng-click="periodCtrl.confirmActive(period)" ng-disabled="periodCtrl.permission != periodCtrl.policyEnum.Host" />
                </td>
                <td class="text-center">
                    <div class="btn-group">
                        <a class="glyphicon glyphicon-edit icon-edit" title="Edit" ng-click="periodCtrl.update(period.PeriodId)"
                           href="{{periodCtrl.updatePeriodUrl}}"></a>
                        <a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" title="Delete" ng-click="periodCtrl.delete(period)"
                           ng-show="periodCtrl.permission == periodCtrl.policyEnum.Host"></a>
                    </div>
                </td>
            </tr>
            <tr ng-show="periodCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="8" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="8" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="periodCtrl.pageSize"
                            ng-options="entry for entry in periodCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
