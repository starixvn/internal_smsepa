
<div id="confirmPopup">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="EditEmployeeSetting"></span>
            <span class="close-popup" ng-click="updatePeriodSettingCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form novalidate class="row form-horizontal form-multiLine filter check-assignment-filter" evaluator-chosen>
            <div class="form-group">
                <label class="col-sm-2 control-label" data-translate="TargetTemplate">
                </label>
                <div class="col-sm-3">
                    <select ng-model="updatePeriodSettingCtrl.employeeOptions.targetTemplateId" ng-options="opt.TargetTemplateId as opt.Name for opt in updatePeriodSettingCtrl.targetTemplates"
                            class="form-control lstBox-limit">
                        <option value="">-- {{"None" | translate}} --</option>
                    </select>
                </div>
            </div>
        </form>

        <table class="row table table-bordered table-striped table-period-setting">
            <thead>
                <tr class="headerName">
                    <th class="width200" data-translate="SymbolCount">
                    </th>
                    <th class="width200 text-center" data-translate="SelfEvaluator">
                    </th>
                    <th class="width200 text-center" data-translate="Evaluator">
                    </th>
                    <th class="width200 text-center" data-translate="Reviewer">
                    </th>
                    <th class="width200 text-center" data-translate="Management">
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-translate="Evaluator"></td>
                    <td></td>
                    <td>
                        <select class="form-control" multiple chosen
                                options="updatePeriodSettingCtrl.employeeOptions.evaluatorEmployees"
                                ng-model="updatePeriodSettingCtrl.employeeOptions.evaluator.ids"
                                data-placeholder="Select the evaluator" name="evaluatorSelect"
                                ng-options="opt.EmployeeId as opt.NickName + ' (' + opt.FullName + ')' for opt in updatePeriodSettingCtrl.employeeOptions.evaluatorEmployees"
                                on-show-dropdown="updatePeriodSettingCtrl.updateTrigger()"></select>
                    </td>
                    <td>
                        <select class="form-control" multiple chosen
                                options="updatePeriodSettingCtrl.employeeOptions.reviewerEmployees"
                                ng-model="updatePeriodSettingCtrl.employeeOptions.reviewer.ids"
                                data-placeholder="Select the reviewer" name="reviewerSelect"
                                ng-options="opt.EmployeeId as opt.NickName + ' (' + opt.FullName + ')' for opt in updatePeriodSettingCtrl.employeeOptions.reviewerEmployees"
                                on-show-dropdown="updatePeriodSettingCtrl.updateTrigger()"></select>
                    </td>
                    <td>
                        <select class="form-control" multiple chosen
                                options="updatePeriodSettingCtrl.employeeOptions.management" employees"
                                ng-model="updatePeriodSettingCtrl.employeeOptions.management.ids"
                                data-placeholder="Select the management" name="managementSelect"
                                ng-options="opt.EmployeeId as opt.NickName + ' (' + opt.FullName + ')' for opt in updatePeriodSettingCtrl.employeeOptions.managementEmployees"
                                on-show-dropdown="updatePeriodSettingCtrl.updateTrigger()"></select>
                    </td>
                </tr>
                <tr>
                    <td data-translate="RemindDay"></td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.selfEvaluator.RemindDay"
                                ng-options="opt for opt in updatePeriodSettingCtrl.remindDay"></select>
                    </td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.evaluator.RemindDay"
                                ng-options="opt for opt in updatePeriodSettingCtrl.remindDay"></select>
                    </td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.reviewer.RemindDay"
                                ng-options="opt for opt in updatePeriodSettingCtrl.remindDay"></select>
                    </td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.management.RemindDay"
                                ng-options="opt for opt in updatePeriodSettingCtrl.remindDay"></select>
                    </td>
                </tr>
                <tr>
                    <td data-translate="Email"></td>
                    <td class="text-center">
                        <input type="checkbox" ng-model="updatePeriodSettingCtrl.employeeOptions.selfEvaluator.HasSendMail" />
                    </td>
                    <td class="text-center">
                        <input type="checkbox" ng-model="updatePeriodSettingCtrl.employeeOptions.evaluator.HasSendMail" />
                    </td>
                    <td class="text-center">
                        <input type="checkbox" ng-model="updatePeriodSettingCtrl.employeeOptions.reviewer.HasSendMail" />
                    </td>
                    <td class="text-center">
                        <input type="checkbox" ng-model="updatePeriodSettingCtrl.employeeOptions.management.HasSendMail" />
                    </td>
                </tr>
                <tr>
                    <td data-translate="Duration"></td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.selfEvaluator.Duration"
                                ng-change="updatePeriodSettingCtrl.updateDate(updatePeriodSettingCtrl.employeeOptions.selfEvaluator)"
                                ng-options="opt for opt in [] | range:30"></select>
                    </td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.evaluator.Duration"
                                ng-change="updatePeriodSettingCtrl.updateDate(updatePeriodSettingCtrl.employeeOptions.evaluator)"
                                ng-options="opt for opt in [] | range:30"></select>
                    </td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.reviewer.Duration"
                                ng-change="updatePeriodSettingCtrl.updateDate(updatePeriodSettingCtrl.employeeOptions.reviewer)"
                                ng-options="opt for opt in [] | range:30"></select>
                    </td>
                    <td class="text-center">
                        <select ng-model="updatePeriodSettingCtrl.employeeOptions.management.Duration"
                                ng-change="updatePeriodSettingCtrl.updateDate(updatePeriodSettingCtrl.employeeOptions.management)"
                                ng-options="opt for opt in [] | range:30"></select>
                    </td>
                </tr>
                <tr>
                    <td data-translate="StartDate"></td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.selfEvaluator.StartDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image period-calendar"></calendar-image>
                    </td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.evaluator.StartDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image period-calendar"></calendar-image>
                    </td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.reviewer.StartDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image period-calendar"></calendar-image>
                    </td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.management.StartDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image period-calendar"></calendar-image>
                    </td>
                </tr>
                <tr>
                    <td data-translate="EndDate"></td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.selfEvaluator.EndDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image"></calendar-image>
                    </td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.evaluator.EndDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image"></calendar-image>
                    </td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.reviewer.EndDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image"></calendar-image>
                    </td>
                    <td class="text-center">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="updatePeriodSettingCtrl.employeeOptions.management.EndDate"
                               datepicker-popup="{{updatePeriodSettingCtrl.periodDateFormat}}" />
                        <calendar-image class="calendar-image"></calendar-image>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modal-footer">
        <button class="button" ng-click="updatePeriodSettingCtrl.save()" data-translate="OK"></button>
        <button class="btn btn-default customize" ng-click="updatePeriodSettingCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
