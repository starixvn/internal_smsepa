<div ng-controller="EmployeeSettingPeriodController as employeeSettingPeriodCtrl">
    <form class="row form-inline filter">
        <div class="form-group">
            <label class="control-label" data-translate="Department">
            </label>
            <select ng-model="employeeSettingPeriodCtrl.filter.departmentId"
                    ng-options="opt.DepartmentId as opt.Name for opt in employeeSettingPeriodCtrl.departmentOptions"
                    class="form-control lstBox-limit">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ShowExcludedEmployee">
            </label>
            <input class="form-control" type="checkbox" ng-model="employeeSettingPeriodCtrl.filter.isExcludedEmployee" />
        </div>
        <div class="form-group">
            <button class="button" ng-click="employeeSettingPeriodCtrl.query(employeeSettingPeriodCtrl.filter)" data-translate="Search"></button>
        </div>
    </form>

    <table class="row table table-bordered table-striped" id="data">
        <thead>
            <tr class="header-table">
                <th colspan="11">
                    <div class="pull-left div-period-department-setting" name="multiSelectOption">
                        <label class="control-label" data-translate="Department"></label>
                        <add-class-to-role-filter multi-select input-model="employeeSettingPeriodCtrl.departments" button-label="Name" helper-elements="all reset"
                                                  item-label="Name" tick-property="ticked" max-labels="3" class="multi-select period-department-select">
                        </add-class-to-role-filter>
                    </div>
                    <div class="pull-left div-period-employee-setting">
                        <label class="control-label" data-translate="Employee"></label>
                        <input class="form-control period-employee" ng-model="employeeSettingPeriodCtrl.searchEmployee"
                               placeholder="Enter full name or nick name" search-auto-complete search-employees="employeeSettingPeriodCtrl.getEmployee()"
                               ng-change="employeeSettingPeriodCtrl.unSelectEmployee()" employee="employeeSettingPeriodCtrl.filterAssign.employee" />
                    </div>
                    <button class="button pull-left period-add" ng-click="employeeSettingPeriodCtrl.addEmployee(employeeSettingPeriodCtrl.filterAssign)" data-translate="Add"></button>
                    <input class="btnExcel pull-right" export-employee-setting-report 
                           ng-click="employeeSettingPeriodCtrl.exportReport(employeeSettingPeriodCtrl.filter)" 
                           type="button" title="Export to Excel">
                    <input type="text" ng-model="employeeSettingPeriodCtrl.searchKey" ng-change="employeeSettingPeriodCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount">
                </th>
                <th data-translate="Group">
                </th>
                <th data-translate="Employee">
                </th>
                <th data-translate="TargetType">
                </th>
                <th data-translate="TargetTemplate">
                </th>
                <th data-translate="Step">
                </th>
                <th data-translate="Name">
                </th>
                <th data-translate="StartDate">
                </th>
                <th data-translate="EndDate">
                </th>
                <th data-translate="Include">
                </th>
                <th data-translate="Edit">
                </th>
            </tr>
        </thead>
        <tbody class="table-body" dir-paginate="employee in employeeSettingPeriodCtrl.filteredItems | itemsPerPage: employeeSettingPeriodCtrl.pageSize"
               current-page="employeeSettingPeriodCtrl.currentPage">
            <tr ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                <td class="text-center" ng-bind="employeeSettingPeriodCtrl.getIndex($index, employeeSettingPeriodCtrl.currentPage, employeeSettingPeriodCtrl.pageSize)"
                    rowspan="{{employee.NumberEvaluators}}"></td>
                <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                    <span tooltip="{{employee.Group.GroupName}}" ng-bind="employee.Group.GroupCode"></span>
                </td>
                <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                    <div ng-bind="employee.FullName"></div>
                    <div ng-bind="employee.Code"></div>
                    <div>({{employee.NickName}})</div>
                    <div ng-bind="employee.JobTitle.JobTitleName"></div>
                </td>
                <td class="text-center" ng-bind="employee.TargetTemplate.TargetTypeName" rowspan="{{employee.NumberEvaluators}}"></td>
                <td ng-bind="employee.TargetTemplate.Name" rowspan="{{employee.NumberEvaluators}}"></td>
                <td data-translate="Evaluator"></td>
                <td>
                    <div ng-show="employee.Evaluators && employee.Evaluators.length == 1
                         && employee.Evaluators[0].EvaluatorInfo && employee.Evaluators[0].EvaluatorInfo.EmployeeId != -1">
                        <span ng-bind="employee.Evaluators[0].EvaluatorInfo.FullName +' ('+ employee.Evaluators[0].EvaluatorInfo.NickName + ')'"></span>
                    </div>
                    <div ng-show="employee.Evaluators && employee.Evaluators.length > 1">
                        <ul>
                            <li ng-repeat="evaluator in employee.Evaluators"
                                ng-bind="evaluator.EvaluatorInfo.FullName +' ('+ evaluator.EvaluatorInfo.NickName + ')'"></li>
                        </ul>
                    </div>
                </td>
                <td ng-bind="employee.Evaluators[0].StartDate | date: employeeSettingPeriodCtrl.periodDateFormat"></td>
                <td ng-bind="employee.Evaluators[0].EndDate | date: employeeSettingPeriodCtrl.periodDateFormat"></td>
                <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                    <input type="checkbox" ng-checked="employee.IsIncluded" ng-click="employeeSettingPeriodCtrl.includeExcludeEmployee(employee)" />
                </td>
                <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                    <div class="btn-group">
                        <a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="" ng-click="employeeSettingPeriodCtrl.updateEmployeeSetting(employee)"></a>
                    </div>
                </td>
            </tr>
            <tr ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                <td data-translate="Reviewer"></td>
                <td>
                    <div ng-show="employee.Reviewers && employee.Reviewers.length == 1
                         && employee.Reviewers[0].EvaluatorInfo && employee.Reviewers[0].EvaluatorInfo.EmployeeId != -1">
                        <span ng-bind="employee.Reviewers[0].EvaluatorInfo.FullName +' ('+ employee.Reviewers[0].EvaluatorInfo.NickName + ')'"></span>
                    </div>
                    <div ng-show="employee.Reviewers && employee.Reviewers.length > 1">
                        <ul>
                            <li ng-repeat="reviewer in employee.Reviewers"
                                ng-bind="reviewer.EvaluatorInfo.FullName +' ('+ reviewer.EvaluatorInfo.NickName + ')'"></li>
                        </ul>
                    </div>
                </td>
                <td ng-bind="employee.Reviewers[0].StartDate | date: employeeSettingPeriodCtrl.periodDateFormat"></td>
                <td ng-bind="employee.Reviewers[0].EndDate | date: employeeSettingPeriodCtrl.periodDateFormat"></td>
            </tr>
            <tr ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                <td data-translate="Management"></td>
                <td>
                    <div ng-show="employee.Managements.length == 1
                         && employee.Managements[0].EvaluatorInfo && employee.Managements[0].EvaluatorInfo.EmployeeId != -1">
                        <span ng-bind="employee.Managements[0].EvaluatorInfo.FullName +' ('+ employee.Managements[0].EvaluatorInfo.NickName + ')'"></span>
                    </div>
                    <div ng-show="employee.Managements.length > 1">
                        <ul>
                            <li ng-repeat="management in employee.Managements"
                                ng-bind="management.EvaluatorInfo.FullName +' ('+ management.EvaluatorInfo.NickName + ')'"></li>
                        </ul>
                    </div>
                </td>
                <td ng-bind="employee.Managements[0].StartDate | date: employeeSettingPeriodCtrl.periodDateFormat"></td>
                <td ng-bind="employee.Managements[0].EndDate | date: employeeSettingPeriodCtrl.periodDateFormat"></td>
            </tr>
        </tbody>
        <tbody ng-show="employeeSettingPeriodCtrl.filteredItems.length == 0">
            <tr>
                <td class="empty-result" colspan="11" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="11" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="employeeSettingPeriodCtrl.pageSize"
                            ng-options="entry for entry in employeeSettingPeriodCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
