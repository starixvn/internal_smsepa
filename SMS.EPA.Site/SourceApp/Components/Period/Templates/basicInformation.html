<div ng-controller="UpdateBasicInformationPeriodController as basicInfoPeriodCtrl">
    <form class="col-sm-8 form-horizontal common-form info-form" novalidate>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Name">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" maxlength="200" ng-model="basicInfoPeriodCtrl.period.Name" required />
            </div>
        </div>
        <div class="form-group top-buffer required">
            <label class="col-sm-3 control-label" data-translate="TargetType"></label>
            <div class="col-sm-8 field">
                <select class="form-control lstBox-limit" ng-model="basicInfoPeriodCtrl.period.TargetTypeId" ng-disabled="true"
                        ng-options="opt.TargetTypeId as opt.Name for opt in basicInfoPeriodCtrl.targetTypes">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group top-buffer">
            <label class="col-sm-3 control-label required-label" data-translate="StartDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId == 3 || basicInfoPeriodCtrl.period.TargetTypeId == 5">
            </label>
            <label class="col-sm-3 control-label" data-translate="StartDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId != 3 && basicInfoPeriodCtrl.period.TargetTypeId != 5">
            </label>
            <div class="col-sm-3">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="basicInfoPeriodCtrl.period.RawStartDate" datepicker-popup
                       ng-click="basicInfoPeriodCtrl.openPopupStartDate($event)" min-date="{{basicInfoPeriodCtrl.calendar.minDate}}"
                       is-open="basicInfoPeriodCtrl.calendar.startDateOpened" />
                <epa-calendar-image class="calendar-image" ng-click="basicInfoPeriodCtrl.openPopupStartDate($event)"></epa-calendar-image>
            </div>
            <label class="col-sm-3 control-label required-label" data-translate="EndDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId == 3">
            </label>
            <label class="col-sm-3 control-label" data-translate="EndDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId != 3">
            </label>
            <div class="col-sm-3">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="basicInfoPeriodCtrl.period.RawEndDate" datepicker-popup
                       ng-click="basicInfoPeriodCtrl.openPopupEndDate($event)" min-date="{{basicInfoPeriodCtrl.calendar.minDate}}"
                       is-open="basicInfoPeriodCtrl.calendar.endDateOpened" />
                <epa-calendar-image class="calendar-image" ng-click="basicInfoPeriodCtrl.openPopupEndDate($event)"></epa-calendar-image>
            </div>
        </div>
        <div class="form-group top-buffer">
            <label class="col-sm-3 control-label required-label" data-translate="DisciplineStartDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId == 3">
            </label>
            <label class="col-sm-3 control-label" data-translate="DisciplineStartDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId != 3">
            </label>
            <div class="col-sm-3">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="basicInfoPeriodCtrl.period.RawAttendanceStartDate" datepicker-popup
                       ng-click="basicInfoPeriodCtrl.openPopupAttendanceStartDate($event)" min-date="{{basicInfoPeriodCtrl.calendar.minDate}}"
                       is-open="basicInfoPeriodCtrl.calendar.attendanceStartDateOpened" />
                <epa-calendar-image class="calendar-image" ng-click="basicInfoPeriodCtrl.openPopupAttendanceStartDate($event)"></epa-calendar-image>
            </div>
            <label class="col-sm-3 control-label required-label" data-translate="DisciplineEndDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId == 3">
            </label>
            <label class="col-sm-3 control-label" data-translate="DisciplineEndDate"
                   ng-show="basicInfoPeriodCtrl.period.TargetTypeId != 3">
            </label>
            <div class="col-sm-3">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="basicInfoPeriodCtrl.period.RawAttendanceEndDate" datepicker-popup
                       ng-click="basicInfoPeriodCtrl.openPopupAttendanceEndDate($event)" min-date="{{basicInfoPeriodCtrl.calendar.minDate}}"
                       is-open="basicInfoPeriodCtrl.calendar.attendanceEndDateOpened" />
                <epa-calendar-image class="calendar-image" ng-click="basicInfoPeriodCtrl.openPopupAttendanceEndDate($event)"></epa-calendar-image>
            </div>
        </div>
        <div class="form-group top-buffer">
            <label class="col-sm-3 control-label" data-translate="Active"></label>
            <div class="col-sm-8 field active-label">
                <input type="checkbox" ng-model="basicInfoPeriodCtrl.period.IsActive" />
            </div>
        </div>
        <div class="form-group top-buffer">
            <label class="col-sm-3 control-label" data-translate="Description"></label>
            <div class="col-sm-8 field description">
                <textarea type="text" class="form-control" maxlength="2000" ng-model="basicInfoPeriodCtrl.period.Description"></textarea>
            </div>
        </div>
        <div class="col-sm-offset-5 top-buffer">
            <button class="btn btn-primary" data-translate="Save" ng-click="basicInfoPeriodCtrl.save(basicInfoPeriodCtrl.period)"
                    ng-show="updateCtrl.permission == updateCtrl.policyEnum.Host"></button>
            <button class="btn btn-default" ng-click="basicInfoPeriodCtrl.cancel()" data-translate="Cancel"></button>
        </div>
    </form>
</div>
