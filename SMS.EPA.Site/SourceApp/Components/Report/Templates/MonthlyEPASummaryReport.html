<div class="epa-summary-report" ng-controller="MonthlyEPASummaryReportController as monthlySummaryReportCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MonthlyEPASummaryReport"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group last">
                <label class="col-sm-2 col-percent-14 control-label" data-translate="EvaluationPeriod"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="monthlySummaryReportCtrl.periods" button-label="Name"
                                              helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-2 col-percent-14 control-label" data-translate="DepartmentSection"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="monthlySummaryReportCtrl.filter.departmentId"
                            ng-options="opt.DepartmentId as opt.Name for opt in monthlySummaryReportCtrl.treeDepartment">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Category"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="monthlySummaryReportCtrl.filter.isLocal">
                        <option value="">-- {{"All" | translate}} --</option>
                        <option value="false">{{"Expat" | translate}}</option>
                        <option value="true">{{"Local" | translate}}</option>
                    </select>
                </div>
                <div class="col-sm-1">
                    <button class="button" ng-click="monthlySummaryReportCtrl.query()" data-translate="Search"></button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-12">
        <div class="freegrid" data-export-monthly-epa-summary-report data-grid-epa-summary-report
             data-grid-data="monthlySummaryReportCtrl.epaSummary"
             data-grid-expand-height="300"
             data-on-page-changing="monthlySummaryReportCtrl.pageChanging"
             data-on-sort-changing="monthlySummaryReportCtrl.sortChanging"
             data-sort-column-name="monthlySummaryReportCtrl.filter.sortColumnName"
             data-sort-direction="monthlySummaryReportCtrl.filter.sortDirection"
             data-export-report="monthlySummaryReportCtrl.exportReport"
             data-page-option="monthlySummaryReportCtrl.filter"></div>
    </div>
</div>
