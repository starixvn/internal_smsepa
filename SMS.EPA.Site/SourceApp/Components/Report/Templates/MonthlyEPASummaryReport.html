<div class="epa-summary-report" ng-controller="MonthlyEPASummaryReportController as monthlySummaryReportCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MonthlyEPASummaryReport"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="form-filter" role="form">
            <div class="form-group">
                <label class="label-form" data-translate="EvaluationPeriod"></label>
                <div class="select-form">
                    <epa-add-class-to-role-filter class="multi-select" multi-select input-model="monthlySummaryReportCtrl.periods" button-label="Name"
                                                  helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </epa-add-class-to-role-filter>
                </div>
            </div>
            <div class="form-group">
                <label class="label-form" data-translate="Team"></label>
                <div class="select-form">
                    <multi-select-tree-view selected-items="monthlySummaryReportCtrl.filter.teamIds"
                                            is-selected-all="true"
                                            options="monthlySummaryReportCtrl.orgChart" on-select="monthlySummaryReportCtrl.onSelectTeam"></multi-select-tree-view>
                </div>
            </div>
            <div class="form-group">
                <label class="label-form" data-translate="Category"></label>
                <select class="form-control select-form" ng-model="monthlySummaryReportCtrl.filter.isLocal">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option value="false">{{"Expat" | translate}}</option>
                    <option value="true">{{"Local" | translate}}</option>
                </select>
            </div>
            <div class="form-group">
                <button class="btn btn-primary" ng-click="monthlySummaryReportCtrl.query()" data-translate="Search"></button>
            </div>
        </form>
    </div>
    <div class="col-sm-12">
        <div class="freegrid" data-export-monthly-epa-summary-report data-grid-epa-summary-report
             data-grid-data="monthlySummaryReportCtrl.epaSummary"
             data-grid-expand-height="300"
             data-on-sort-changing="monthlySummaryReportCtrl.sortChanging"
             data-sort-column-name="monthlySummaryReportCtrl.filter.sortColumnName"
             data-sort-direction="monthlySummaryReportCtrl.filter.sortDirection"
             data-export-report="monthlySummaryReportCtrl.exportReport"
             data-page-option="monthlySummaryReportCtrl.filter"></div>
    </div>
</div>
