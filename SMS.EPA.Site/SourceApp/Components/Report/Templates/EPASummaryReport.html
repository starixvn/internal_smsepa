<div class="epa-summary-report" ng-controller="EPASummaryReportController as epaSummaryReportCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EPASummaryReport"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group last">
                <label class="col-sm-2 control-label" data-translate="EvaluationPeriod"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="epaSummaryReportCtrl.periods" button-label="Name"
                                              helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-2 control-label" data-translate="DepartmentSection"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="epaSummaryReportCtrl.filter.departmentId"
                            ng-options="opt.DepartmentId as opt.Name for opt in epaSummaryReportCtrl.treeDepartment">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <div class="col-sm-1">
                    <button class="button btn-search" ng-click="epaSummaryReportCtrl.query(epaSummaryReportCtrl.filter)" data-translate="Search"></button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-12">
        <div class="freegrid" data-export-epa-summary-report data-grid-epa-summary-report data-grid-data="epaSummaryReportCtrl.epaSummary" data-grid-expand-height="300"
             data-on-page-changing="epaSummaryReportCtrl.pageChanging" data-export-report="epaSummaryReportCtrl.exportReport" data-page-option="epaSummaryReportCtrl.filter"></div>
    </div>
</div>
