<div class="epa-summary-report" ng-controller="EPASummaryReportController as epaSummaryReportCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EPAReport"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Period"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="epaSummaryReportCtrl.periods" button-label="EmployeeId"
                                              helper-elements="all reset filter" item-label="Name" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
                <label class="col-sm-2 control-label" data-translate="DepartmentSection"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="epaSummaryReportCtrl.filter.departmentId"
                            ng-options="opt.DepartmentId as opt.Name for opt in epaSummaryReportCtrl.treeDepartment">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <div class="col-sm-1">
                    <button class="button btn-search" ng-click="epaSummaryReportCtrl.query(epaSummaryReportCtrl.filter)" data-translate="Search"></button>
                </div>
                <div class="col-sm-2">
                    <a class="button btn-export-excel" ng-click="epaSummaryReportCtrl.exportToExcel(epaSummaryReportCtrl.filter)">
                        <div class="button-label" data-translate="Excel"></div>
                        <div class="glyphicon icon-excel"></div>
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
