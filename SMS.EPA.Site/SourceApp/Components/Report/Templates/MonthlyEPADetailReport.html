<div class="epa-detail-report" ng-controller="MonthlyEPADetailReportController as monthlyReportCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MonthlyEPADetailReport"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-2 control-label" data-translate="EvaluationPeriod"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="monthlyReportCtrl.filter.periodId"
                            ng-options="opt.PeriodId as opt.Name group by opt.Year for opt in monthlyReportCtrl.periods">
                        <option style="display: none" value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-2 control-label" data-translate="ScoredBy"></label>
                <div class="col-sm-2">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="monthlyReportCtrl.scoredBy" button-label="Name"
                                              helper-elements="all reset" item-label="Name" tick-property="ticked" max-labels="0">
                    </add-class-to-role-filter>
                </div>
            </div>
            <div class="form-group last">
                <label class="col-sm-2 control-label" data-translate="DepartmentSection"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="monthlyReportCtrl.filter.departmentId"
                            ng-options="opt.DepartmentId as opt.Name for opt in monthlyReportCtrl.treeDepartment">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
                <label class="col-sm-2 control-label" data-translate="Category"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="monthlyReportCtrl.filter.isLocal">
                        <option value="">-- {{"All" | translate}} --</option>
                        <option value="false">{{"Expat" | translate}}</option>
                        <option value="true">{{"Local" | translate}}</option>
                    </select>
                </div>
                <div class="col-sm-offset-1 col-sm-1">
                    <button class="button btn-search" ng-click="monthlyReportCtrl.query(monthlyReportCtrl.filter)" data-translate="Search"></button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-12">
        <div class="freegrid" export-monthly-epa-detail-report data-grid-monthly-epa-detail-report data-grid-data="monthlyReportCtrl.epaDetail" data-grid-expand-height="300"
             data-on-page-changing="monthlyReportCtrl.pageChanging" data-page-option="monthlyReportCtrl.filter"
             data-export-report="monthlyReportCtrl.exportReport" data-hide-columns="monthlyReportCtrl.hideColumns" data-export-pdf="monthlyReportCtrl.exportPdf"></div>
    </div>

    <span us-spinner spinner-key="spinner-1" spinner-start-active="true" spinner-theme="bigBlue"></span>
</div>
