<div class="epa-detail-report" ng-controller="EPADetailReportController as epaDetailReportCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="EPADetailReport"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="form-filter" role="form">
            <div class="form-group">
                <label class="label-form" data-translate="EvaluationPeriod"></label>
                <select class="form-control select-form" ng-model="epaDetailReportCtrl.filter.periodId"
                        ng-options="opt.PeriodId as opt.Name group by opt.Year for opt in epaDetailReportCtrl.periods">
                    <option style="display: none" value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="label-form" data-translate="ScoredBy"></label>
                <div class="select-form">
                    <multi-select-tree-view selected-items="epaDetailReportCtrl.filter.phaseIds"
                                            is-selected-all="true" has-search-box="true"
                                            options="epaDetailReportCtrl.scoredBy" on-select="epaDetailReportCtrl.onSelectPhase"></multi-select-tree-view>
                </div>
            </div>
            <div class="form-group">
                <label class="label-form" data-translate="Team"></label>
                <div class="select-form">
                    <multi-select-tree-view selected-items="epaDetailReportCtrl.filter.teamIds"
                                            is-selected-all="true" has-search-box="true"
                                            options="epaDetailReportCtrl.orgChart" on-select="epaDetailReportCtrl.onSelectTeam"></multi-select-tree-view>
                </div>
            </div>
            <div class="form-group">
                <label class="label-form" data-translate="Category"></label>
                <select class="form-control select-form" ng-model="epaDetailReportCtrl.filter.isLocal">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option value="false">{{"Expat" | translate}}</option>
                    <option value="true">{{"Local" | translate}}</option>
                </select>
            </div>
            <div class="form-group">
                <label class="label-form" data-translate="Employee"></label>
                <input class="form-control input-form" ng-model="epaDetailReportCtrl.searchKeyword"
                       placeholder="Enter full name or nick name" search-auto-complete search-employees="epaDetailReportCtrl.getEmployee()"
                       ng-change="epaDetailReportCtrl.unSelectEmployee()" employee="epaDetailReportCtrl.filter.employee" />
            </div>
            <div class="form-group">
                <label class="label-form"></label>
                <button class="btn btn-primary" ng-click="epaDetailReportCtrl.query(epaDetailReportCtrl.filter)" data-translate="Search"></button>
            </div>
        </form>
    </div>
    <div class="col-sm-12">
        <div class="freegrid" 
             export-epa-detail-report 
             data-grid-epa-detail-report 
             export-comment-summary-report
             export-recommendation-summary-report
             data-grid-data="epaDetailReportCtrl.epaDetail"
             data-grid-expand-height="300"
             data-on-sort-changing="epaDetailReportCtrl.sortChanging"
             data-sort-column-name="epaDetailReportCtrl.filter.sortColumnName"
             data-sort-direction="epaDetailReportCtrl.filter.sortDirection"
             data-page-option="epaDetailReportCtrl.filter"
             data-export-report="epaDetailReportCtrl.exportReport"
             data-export-comment-report="epaDetailReportCtrl.exportCommentReport"
             data-export-recommendation-report="epaDetailReportCtrl.exportRecommendationReport"
             data-hide-columns="epaDetailReportCtrl.hideColumns"></div>
    </div>
</div>
