<div class="kpi-management" ng-controller="KPIController as kpiCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb" ng-if="kpiCtrl.isViewAll">
            <li class="current" data-translate="ManageKPI"></li>
        </ul>
        <ul class="row breadcrumb" ng-if="kpiCtrl.isViewAll == false">
            <li class="current">{{"ManageKPI" | translate}} of "{{kpiCtrl.kpiGroup.Name}}"</li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-inline" role="form" ng-if="kpiCtrl.isViewAll">
            <div class="form-group">
                <label data-translate="Form"></label>
                <select class="form-control lstBox-limit" ng-model="kpiCtrl.filter.targetTypeId" 
                    ng-options="opt.TargetTypeId as opt.Name for opt in kpiCtrl.targetTypes"
                    ng-change="kpiCtrl.getKPIGroupByTargetType(kpiCtrl.filter.targetTypeId)">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label data-translate="Group"></label>
                <select class="form-control lstBox-limit" ng-model="kpiCtrl.filter.kpiGroupId" 
                    ng-options="opt.KPIGroupId as opt.Name for opt in kpiCtrl.kpiGroups">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="control-label" data-translate="Status"></label>
                <select class="form-control" ng-model="kpiCtrl.filter.isActive">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option selected value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
                <label class="control-label" data-translate="Required"></label>
                <select class="form-control" ng-model="kpiCtrl.filter.isRequiredEvaluate">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option selected value="true" data-translate="Required"></option>
                    <option value="false" data-translate="NotRequired"></option>
                </select>
            </div>
            <div class="form-group">
                <button class="button" ng-click="kpiCtrl.query(kpiCtrl.filter)" data-translate="Submit"></button>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table">
                    <th colspan="7">
                        <a class="pull-left button-icon create-button" ng-click="kpiCtrl.createKPI()" ng-if="kpiCtrl.permission == 2">
                            <span class="icon plus"></span>
                            <span class="button-text" data-translate="CreateKPI"></span>
                        </a>
                        <a class="pull-left button-icon back-button" ng-click="kpiCtrl.backToList()" ng-if="kpiCtrl.isViewAll == false">
                            <span class="icon back"></span>
                            <span class="button-text" data-translate="BackToList"></span>
                        </a>
                        <input type="text" ng-model="kpiCtrl.searchKey" ng-change="kpiCtrl.search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th class="text-center" data-translate="SymbolCount"></th>
                    <th class="text-center" data-translate="Group"></th>
                    <th class="text-center" data-translate="KPI"></th>
                    <th class="text-center col-active" data-translate="Active"></th>
                    <th class="text-center col-required" data-translate="Required"></th>
                    <th class="text-center col-description" data-translate="Description"></th>
                    <th class="text-center col-action" data-translate="Action" ng-if="kpiCtrl.permission == 2"></th>
                </tr>
            </thead>
            <tbody class="table-body">
                <tr dir-paginate="kpi in kpiCtrl.filteredItems | itemsPerPage: kpiCtrl.pageSize" current-page="kpiCtrl.currentPage">
                    <td class="text-center" ng-bind="kpiCtrl.getIndex($index, kpiCtrl.currentPage, kpiCtrl.pageSize)"></td>
                    <td>
                        <div ng-show="kpi.KPIGroups.length == 1">
                            <span ng-bind="kpi.KPIGroups[0].Name"></span>
                        </div>
                        <div ng-show="kpi.KPIGroups.length > 1">
                            <ul class="list-kpi-groups">
                                <li class="kpi-group-item" ng-repeat="group in kpi.KPIGroups" ng-bind="group.Name"></li>
                            </ul>
                        </div>
                    </td>
                    <td ng-bind="kpi.Name"></td>
                    <td class="text-center col-active">
                        <input type="checkbox" ng-checked="kpi.IsActive" 
                            ng-disabled="kpiCtrl.permission != 2"
                            ng-click="kpiCtrl.updateStatusKPI(kpi)" />
                    </td>
                    <td class="text-center col-required">
                        <input type="checkbox" ng-checked="kpi.IsRequiredEvaluate" 
                            ng-click="kpiCtrl.updateRequiredEvaluate(kpi)"
                            ng-disabled="kpiCtrl.permission != 2" />
                    </td>
                    <td class="col-description">
                        {{kpi.Description | limitTo: kpi.numLimit > 0 ? kpi.numLimit: kpiCtrl.maxLengthDescription}}
                        <a ng-show="!kpi.showReadMore && (kpi.Description.length >= kpiCtrl.maxLengthDescription)"
                            href="javascript:;" ng-click="kpiCtrl.readMore(kpi)" data-translate="ReadMore"></a>
                        <a ng-show="kpi.showReadMore && (kpi.Description.length >= kpiCtrl.maxLengthDescription)"
                            href="javascript:;" ng-click="kpiCtrl.readLess(kpi)" data-translate="ReadLess"></a>
                    </td>
                    <td class="text-center col-action" ng-if="kpiCtrl.permission == 2">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="kpiCtrl.updateKPI(kpi)" ng-attr-title='{{"Edit" | translate}}'></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="kpiCtrl.deleteKPI(kpi)" ng-attr-title='{{"Delete" | translate}}'></a>
                    </td>
                </tr>
                <tr ng-show="kpiCtrl.filteredItems.length == 0">
                    <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="7" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="kpiCtrl.pageSize"
                                ng-options="entry for entry in kpiCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
