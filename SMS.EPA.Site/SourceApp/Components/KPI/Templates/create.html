<div class="modal-header">
    <div class="popup-header">
        {{"CreateKPI" | translate}}
        <span class="close-popup" ng-click="createKPICtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body kpi-modal-body">
    <form class="form-horizontal col-sm-11" role="form">
        <div class="form-group required">
            <label class="col-sm-4 control-label" data-translate="Group"></label>
            <div class="col-sm-8 field">
                <select class="form-control select-kpi-group" multiple chosen update-trigger
                        options="createKPICtrl.kpiGroups"
                        ng-model="createKPICtrl.currentChosenKPIGroups"
                        data-placeholder="Select the group"
                        ng-options="opt.KPIGroupId as opt.Name for opt in createKPICtrl.kpiGroups"
                        ng-disabled="createKPICtrl.isDisable"></select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-4 control-label" data-translate="Title"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createKPICtrl.kpi.Name" required maxlength="500" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="RequireEvaluate"></label>
            <div class="col-sm-8 field active-label">
                <input type="checkbox" ng-model="createKPICtrl.kpi.IsRequiredEvaluate" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="Description"></label>
            <div class="col-sm-8 field description">
                <textarea type="text" class="form-control" maxlength="2000" ng-model="createKPICtrl.kpi.Description"></textarea>
            </div>
        </div>
        <div class="form-group"> 
            <div class="col-sm-offset-4 col-sm-8">
                <div class="checkbox col-sm-5">
                    <label>
                        <input type="checkbox" ng-model="createKPICtrl.kpi.HasComment" 
                            ng-click="createKPICtrl.changeHasComment()" /> {{"HasComment" | translate}}
                    </label>
                </div>
                <div class="checkbox col-sm-7">
                    <label>
                        <input type="checkbox" ng-model="createKPICtrl.kpi.IsRequiredComment" 
                            ng-disabled="!createKPICtrl.kpi.HasComment" /> {{"RequireComment" | translate}}
                    </label>
                </div>
             </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button class="button" ng-click="createKPICtrl.save(false)" data-translate="Submit"></button>
    <button class="button" ng-click="createKPICtrl.save(true)" data-translate="SubmitAndContinue"></button>
    <button class="btn btn-default customize" ng-click="createKPICtrl.cancel()" data-translate="Cancel"></button>
</div>
