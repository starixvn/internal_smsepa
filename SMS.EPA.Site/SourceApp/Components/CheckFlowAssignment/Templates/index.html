<div class="col-sm-12" ng-controller="CheckFlowAssignmentController as checkFlowCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="CheckAssignment"></li>
        </ul>
    </div>
    <div>
        <form novalidate class="row form-inline filter">
            <div class="form-group">
                <label class="control-label" data-translate="Group">
                </label>
                <select ng-model="checkFlowCtrl.filter.groupId" ng-options="opt.GroupId as opt.GroupName for opt in checkFlowCtrl.groupOptions"
                        class="form-control lstBox-limit">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="control-label" data-translate="Employee"></label>
                <input class="form-control employee-search" ng-model="checkFlowCtrl.searchEmployee"
                       placeholder="Enter full name or nick name" search-auto-complete search-employees="checkFlowCtrl.getEmployee()"
                       ng-change="checkFlowCtrl.unSelectEmployee()" employee="checkFlowCtrl.filter.employee" />
            </div>
            <div class="form-group">
                <label data-translate="Form"></label>
                <select class="form-control lstBox-limit" ng-model="checkFlowCtrl.filter.targetTypeId"
                        ng-options="opt.TargetTypeId as opt.Name for opt in checkFlowCtrl.targetTypes">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <button class="button" ng-click="checkFlowCtrl.query(checkFlowCtrl.filter)" data-translate="Search"></button>
            </div>
        </form>

        <table class="row table table-bordered table-striped" id="data">
            <thead>
                <tr class="header-table">
                    <th colspan="11">
                        <a class="pull-left button-icon create-button" ng-click="checkFlowCtrl.manageSetting()">
                            <span class="icon plus"></span>
                            <span class="button-text" data-translate="ManageFlowSetting"></span>
                        </a>
                        <input class="btnExcel pull-right" export-check-assignment-report ng-click="checkFlowCtrl.exportReport(checkFlowCtrl.filter)" type="button" title="Export to Excel">
                        <input type="text" ng-model="checkFlowCtrl.searchKey" ng-change="checkFlowCtrl.search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th>
                        <input type="checkbox" ng-click="checkFlowCtrl.checkAll(checkFlowCtrl.selectedAll)"
                               ng-model="checkFlowCtrl.selectedAll" />
                    </th>
                    <th data-translate="SymbolCount">
                    </th>
                    <th data-translate="Group">
                    </th>
                    <th data-translate="Employee">
                    </th>
                    <th data-translate="Form">
                    </th>
                    <th data-translate="TargetTemplate">
                    </th>
                    <th data-translate="Step">
                    </th>
                    <th data-translate="Name">
                    </th>
                    <th data-translate="StartDate">
                    </th>
                    <th data-translate="EndDate">
                    </th>
                    <th data-translate="Edit">
                    </th>
                </tr>
            </thead>
            <tbody class="table-body" dir-paginate="employee in checkFlowCtrl.filteredItems | itemsPerPage: checkFlowCtrl.pageSize" current-page="checkFlowCtrl.currentPage">
                <tr ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                    <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                        <input type="checkbox" ng-model="employee.Selected" ng-click="checkFlowCtrl.syncSelectedEmployee(employee.EmployeeId, employee.Selected)" />
                    </td>
                    <td class="text-center" ng-bind="checkFlowCtrl.getIndex($index, checkFlowCtrl.currentPage, checkFlowCtrl.pageSize)" rowspan="{{employee.NumberEvaluators}}"></td>
                    <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                        <span tooltip="{{employee.Group.GroupName}}" ng-bind="employee.Group.GroupCode"></span>
                    </td>
                    <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                        <div ng-bind="employee.FullName"></div>
                        <div ng-bind="employee.Code"></div>
                        <div>({{employee.NickName}})</div>
                        <div ng-bind="employee.JobTitle.JobTitleName"></div>
                    </td>
                    <td class="text-center" ng-bind="employee.TargetTemplate.TargetTypeName" rowspan="{{employee.NumberEvaluators}}"></td>
                    <td ng-bind="employee.TargetTemplate.Name" rowspan="{{employee.NumberEvaluators}}"></td>
                    <td data-translate="Evaluator"></td>
                    <td>
                        <div ng-show="employee.Evaluators && employee.Evaluators.length == 1 && employee.Evaluators[0].EvaluatorInfo.EmployeeId != -1">
                            <span ng-bind="employee.Evaluators[0].EvaluatorInfo.FullName +' ('+ employee.Evaluators[0].EvaluatorInfo.NickName + ')'"></span>
                        </div>
                        <div ng-show="employee.Evaluators && employee.Evaluators.length > 1">
                            <ul>
                                <li ng-repeat="evaluator in employee.Evaluators"
                                    ng-bind="evaluator.EvaluatorInfo.FullName +' ('+ evaluator.EvaluatorInfo.NickName + ')'"></li>
                            </ul>
                        </div>
                    </td>
                    <td ng-bind="employee.Evaluators[0].StartDate | date: vn.dateFormat"></td>
                    <td ng-bind="employee.Evaluators[0].EndDate | date: vn.dateFormat"></td>
                    <td class="text-center" rowspan="{{employee.NumberEvaluators}}">
                        <div class="btn-group">
                            <a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="" ng-click="checkFlowCtrl.editEmployeeSetting(employee)"></a>
                        </div>
                    </td>
                </tr>
                <tr ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                    <td data-translate="Reviewer"></td>
                    <td>
                        <div ng-show="employee.Reviewers && employee.Reviewers.length == 1 && employee.Reviewers[0].EvaluatorInfo.EmployeeId != -1">
                            <span ng-bind="employee.Reviewers[0].EvaluatorInfo.FullName +' ('+ employee.Reviewers[0].EvaluatorInfo.NickName + ')'"></span>
                        </div>
                        <div ng-show="employee.Reviewers && employee.Reviewers.length > 1">
                            <ul>
                                <li ng-repeat="reviewer in employee.Reviewers"
                                    ng-bind="reviewer.EvaluatorInfo.FullName +' ('+ reviewer.EvaluatorInfo.NickName + ')'"></li>
                            </ul>
                        </div>
                    </td>
                    <td ng-bind="employee.Reviewers[0].StartDate | date: vn.dateFormat"></td>
                    <td ng-bind="employee.Reviewers[0].EndDate | date: vn.dateFormat"></td>
                </tr>
                <tr ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
                    <td data-translate="Management"></td>
                    <td>
                        <div ng-show="employee.Managements.length == 1 && employee.Managements[0].EvaluatorInfo.EmployeeId != -1">
                            <span ng-bind="employee.Managements[0].EvaluatorInfo.FullName +' ('+ employee.Managements[0].EvaluatorInfo.NickName + ')'"></span>
                        </div>
                        <div ng-show="employee.Managements.length > 1">
                            <ul>
                                <li ng-repeat="management in employee.Managements"
                                    ng-bind="management.EvaluatorInfo.FullName +' ('+ management.EvaluatorInfo.NickName + ')'"></li>
                            </ul>
                        </div>
                    </td>
                    <td ng-bind="employee.Managements[0].StartDate | date: vn.dateFormat"></td>
                    <td ng-bind="employee.Managements[0].EndDate | date: vn.dateFormat"></td>
                </tr>
            </tbody>
            <tbody ng-show="checkFlowCtrl.filteredItems.length == 0">
                <tr>
                    <td class="empty-result" colspan="11" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="11" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="checkFlowCtrl.pageSize"
                                ng-options="entry for entry in checkFlowCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
