<div id="confirmPopup">
    <div class="modal-header">
        <div class="popup-header">
            {{"EditFlowSetting" | translate}}
            <span class="close-popup" ng-click="editFlowCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form novalidate class="row form-horizontal form-multiLine filter check-assignment-filter" evaluator-chosen>
            <div class="form-group">
                <label class="col-sm-2 control-label" data-translate="TargetTemplate">
                </label>
                <div class="col-sm-3">
                    <select ng-model="editFlowCtrl.employeeOptions.targetTemplateId" ng-options="opt.TargetTemplateId as opt.Name for opt in editFlowCtrl.targetTemplates"
                            class="form-control lstBox-limit">
                        <option value="">-- {{"None" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label" data-translate="Evaluator">
                </label>
                <div class="col-sm-3">
                    <select class="form-control" multiple chosen
                            options="editFlowCtrl.employeeOptions.evaluatorEmployees"
                            ng-model="editFlowCtrl.employeeOptions.evaluator.ids"
                            data-placeholder="Select the evaluator" name="evaluatorSelect"
                            ng-options="opt.EmployeeId as opt.NickName + ' (' + opt.FullName + ')' for opt in editFlowCtrl.employeeOptions.evaluatorEmployees"
                            on-show-dropdown="editFlowCtrl.updateTrigger()"></select>
                </div>
                <label class="col-sm-1 control-label" data-translate="StartDate">
                </label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="editFlowCtrl.employeeOptions.evaluator.startDate" datepicker-popup
                           ng-click="editFlowCtrl.openPopupStartDate($event, editFlowCtrl.evaluatorType.Evaluator)"
                           is-open="editFlowCtrl.calendar.evaluator.startDateOpened" />
                    <calendar-image class="calendar-image" ng-click="editFlowCtrl.openPopupStartDate($event, editFlowCtrl.evaluatorType.Evaluator)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="EndDate">
                </label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="editFlowCtrl.employeeOptions.evaluator.endDate" datepicker-popup
                           ng-click="editFlowCtrl.openPopupEndDate($event, editFlowCtrl.evaluatorType.Evaluator)"
                           is-open="editFlowCtrl.calendar.evaluator.endDateOpened" />
                    <calendar-image class="calendar-image" ng-click="editFlowCtrl.openPopupEndDate($event, editFlowCtrl.evaluatorType.Evaluator)"></calendar-image>
                </div>
                <label class="control-label ng-scope ckc-email" data-translate="Email"></label>
                <input class="ng-pristine ng-untouched ng-valid" type="checkbox" ng-model="editFlowCtrl.employeeOptions.evaluator.hasSendMail">
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label" data-translate="Reviewer">
                </label>
                <div class="col-sm-3">
                    <select class="form-control" multiple chosen
                            options="editFlowCtrl.employeeOptions.reviewerEmployees"
                            ng-model="editFlowCtrl.employeeOptions.reviewer.ids"
                            data-placeholder="Select the reviewer" name="reviewerSelect"
                            ng-options="opt.EmployeeId as opt.NickName + ' (' + opt.FullName + ')' for opt in editFlowCtrl.employeeOptions.reviewerEmployees"
                            on-show-dropdown="editFlowCtrl.updateTrigger()"></select>
                </div>
                <label class="col-sm-1 control-label" data-translate="StartDate">
                </label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="editFlowCtrl.employeeOptions.reviewer.startDate" datepicker-popup
                           ng-click="editFlowCtrl.openPopupStartDate($event, editFlowCtrl.evaluatorType.Reviewer)"
                           is-open="editFlowCtrl.calendar.reviewer.startDateOpened" />
                    <calendar-image class="calendar-image" ng-click="editFlowCtrl.openPopupStartDate($event, editFlowCtrl.evaluatorType.Reviewer)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="EndDate">
                </label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="editFlowCtrl.employeeOptions.reviewer.endDate" datepicker-popup
                           ng-click="editFlowCtrl.openPopupEndDate($event, editFlowCtrl.evaluatorType.Reviewer)"
                           is-open="editFlowCtrl.calendar.reviewer.endDateOpened" />
                    <calendar-image class="calendar-image" ng-click="editFlowCtrl.openPopupEndDate($event, editFlowCtrl.evaluatorType.Reviewer)"></calendar-image>
                </div>
                <label class="control-label ng-scope ckc-email" data-translate="Email"></label>
                <input class="ng-pristine ng-untouched ng-valid" type="checkbox" ng-model="editFlowCtrl.employeeOptions.reviewer.hasSendMail">
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label" data-translate="Management">
                </label>
                <div class="col-sm-3">
                    <select class="form-control" multiple chosen
                            options="editFlowCtrl.employeeOptions.management" employees"
                            ng-model="editFlowCtrl.employeeOptions.management.ids"
                            data-placeholder="Select the management" name="managementSelect"
                            ng-options="opt.EmployeeId as opt.NickName + ' (' + opt.FullName + ')' for opt in editFlowCtrl.employeeOptions.managementEmployees"
                            on-show-dropdown="editFlowCtrl.updateTrigger()"></select>
                </div>
                <label class="col-sm-1 control-label" data-translate="StartDate">
                </label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="editFlowCtrl.employeeOptions.management.startDate" datepicker-popup
                           ng-click="editFlowCtrl.openPopupStartDate($event, editFlowCtrl.evaluatorType.Management)"
                           is-open="editFlowCtrl.calendar.management.startDateOpened" />
                    <calendar-image class="calendar-image" ng-click="editFlowCtrl.openPopupStartDate($event, editFlowCtrl.evaluatorType.Management)"></calendar-image>
                </div>
                <label class="col-sm-1 control-label" data-translate="EndDate">
                </label>
                <div class="col-sm-2">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="editFlowCtrl.employeeOptions.management.endDate" datepicker-popup
                           ng-click="editFlowCtrl.openPopupEndDate($event, editFlowCtrl.evaluatorType.Management)"
                           is-open="editFlowCtrl.calendar.management.endDateOpened" />
                    <calendar-image class="calendar-image" ng-click="editFlowCtrl.openPopupEndDate($event, editFlowCtrl.evaluatorType.Management)"></calendar-image>
                </div>
                <label class="control-label ng-scope ckc-email" data-translate="Email"></label>
                <input class="ng-pristine ng-untouched ng-valid" type="checkbox" ng-model="editFlowCtrl.employeeOptions.management.hasSendMail">
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="button" ng-click="editFlowCtrl.save()" data-translate="OK"></button>
        <button class="btn btn-default customize" ng-click="editFlowCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
