<div class="kpiGroup-management" ng-controller="KPIGroupController as kpiGroupCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="ManageKPIGroup"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-inline" role="form">
            <div class="form-group">
                <label class="control-label" data-translate="Status"></label>
                <select class="form-control" ng-model="kpiGroupCtrl.filter.isActive">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option selected value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
                <button class="btn btn-primary" ng-click="kpiGroupCtrl.query(kpiGroupCtrl.filter)" data-translate="Submit"></button>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table">
                    <th colspan="6">
                        <a class="pull-left button-icon create-button" ng-click="kpiGroupCtrl.createKPIGroup()" ng-if="kpiGroupCtrl.permission == kpiGroupCtrl.policyEnum.Host">
                            <span class="glyphicon glyphicon-plus icon-add"></span>
                            <span class="button-text" data-translate="CreateKPIGroup"></span>
                        </a>
                        <input type="text" ng-model="kpiGroupCtrl.searchKey" ng-change="kpiGroupCtrl.search()"
                               class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th class="text-center" data-translate="SymbolCount"></th>
                    <th class="text-center" data-translate="Group"></th>
                    <th class="text-center" data-translate="KPIs"></th>
                    <th class="text-center col-active" data-translate="Active"></th>
                    <th class="text-center col-description" data-translate="Description"></th>
                    <th class="text-center col-action" data-translate="Action" ng-if="kpiGroupCtrl.permission == kpiGroupCtrl.policyEnum.Host"></th>
                </tr>
            </thead>
            <tbody class="table-body">
                <tr dir-paginate="kpiGroup in kpiGroupCtrl.filteredItems | itemsPerPage: kpiGroupCtrl.pageSize" current-page="kpiGroupCtrl.currentPage">
                    <td class="text-center" ng-bind="kpiGroupCtrl.getIndex($index, kpiGroupCtrl.currentPage, kpiGroupCtrl.pageSize)"></td>
                    <td ng-bind="kpiGroup.Name"></td>
                    <td class="text-center col-number-kpis">
                        <a href="" ng-if="kpiGroup.NumberKPI > 0 && kpiGroupCtrl.permissionOnKPI > 0" ng-click="kpiGroupCtrl.viewKPI(kpiGroup.KPIGroupId)"
                           ng-bind="kpiGroup.NumberKPI" ng-href="{{kpiGroupCtrl.viewKPIUrl}}" class="number-kpi"></a>
                        <span ng-if="kpiGroup.NumberKPI === 0 || kpiGroupCtrl.permissionOnKPI != kpiGroupCtrl.policyEnum.Host" ng-bind="kpiGroup.NumberKPI"></span>
                    </td>
                    <td class="text-center col-active">
                        <input type="checkbox" ng-checked="kpiGroup.IsActive"
                               ng-click="kpiGroupCtrl.updateStatusKPIGroup(kpiGroup)"
                               ng-disabled="kpiGroupCtrl.permission != kpiGroupCtrl.policyEnum.Host" />
                    </td>
                    <td class="col-description" ng-cloak>
                        {{kpiGroup.Description | limitTo: kpiGroup.numLimit > 0 ? kpiGroup.numLimit: kpiGroupCtrl.maxLengthDescription}}
                        <a ng-if="!kpiGroup.showReadMore && (kpiGroup.Description.length >= kpiGroupCtrl.maxLengthDescription)"
                           href="javascript:;" ng-click="kpiGroupCtrl.readMore(kpiGroup)" data-translate="ReadMore"></a>
                        <a ng-if="kpiGroup.showReadMore && (kpiGroup.Description.length >= kpiGroupCtrl.maxLengthDescription)"
                           href="javascript:;" ng-click="kpiGroupCtrl.readLess(kpiGroup)" data-translate="ReadLess"></a>
                    </td>
                    <td class="text-center col-action" ng-if="kpiGroupCtrl.permission == kpiGroupCtrl.policyEnum.Host">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="kpiGroupCtrl.updateKPIGroup(kpiGroup)" ng-attr-title='{{"Edit" | translate}}'></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="kpiGroupCtrl.deleteKPIGroup(kpiGroup)" ng-attr-title='{{"Delete" | translate}}'></a>
                        <a class="glyphicon glyphicon-plus icon-add" href="" ng-if="kpiGroupCtrl.permissionOnKPI == kpiGroupCtrl.policyEnum.Host"
                           ng-click="kpiGroupCtrl.addKPI(kpiGroup)" ng-attr-title='{{"AddKPI" | translate}}'></a>
                    </td>
                </tr>
                <tr ng-show="kpiGroupCtrl.filteredItems.length == 0">
                    <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="6" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="kpiGroupCtrl.pageSize"
                                ng-options="entry for entry in kpiGroupCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
