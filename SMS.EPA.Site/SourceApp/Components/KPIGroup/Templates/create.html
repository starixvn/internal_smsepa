<div class="modal-header">
    <div class="popup-header">
        {{"CreateKPIGroup" | translate}}
        <span class="close-popup" ng-click="createKPIGroupCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body kpiGroup-modal-body">
    <form class="form-horizontal col-sm-11" role="form">
        <div class="form-group required">
            <label class="col-sm-4 control-label" data-translate="Name"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createKPIGroupCtrl.kpiGroup.Name" required maxlength="500" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="Active"></label>
            <div class="col-sm-8 field active-label">
                <input type="checkbox" ng-model="createKPIGroupCtrl.kpiGroup.IsActive" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="Description"></label>
            <div class="col-sm-8 field description">
                <textarea type="text" class="form-control" maxlength="2000" ng-model="createKPIGroupCtrl.kpiGroup.Description"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-click="createKPIGroupCtrl.save()" data-translate="Submit"></button>
    <button class="btn btn-default" ng-click="createKPIGroupCtrl.cancel()" data-translate="Cancel"></button>
</div>
