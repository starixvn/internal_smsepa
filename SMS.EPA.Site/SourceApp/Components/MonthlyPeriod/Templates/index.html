<div class="col-sm-12" ng-controller="MonthlyPeriodController as monthlyPeriodCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="MonthlyPeriod"></li>
        </ul>
    </div>
    <form novalidate class="row form-horizontal filter">
        <div class="form-group">
            <label data-translate="From" class="col-sm-1 control-label"></label>
            <div class="col-sm-2">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="monthlyPeriodCtrl.filter.fromDate"
                       datepicker-popup="MMM, yyyy" datepicker-mode="'month'" datepicker-options="monthlyPeriodCtrl.dateOptions"
                       ng-click="monthlyPeriodCtrl.openPopupFromDate($event)"
                       is-open="monthlyPeriodCtrl.calendar.fromDateOpened" />
                <calendar-image class="calendar-image" ng-click="monthlyPeriodCtrl.openPopupFromDate($event)"></calendar-image>
            </div>
            <label data-translate="To" class="col-sm-1 control-label"></label>
            <div class="col-sm-2">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="monthlyPeriodCtrl.filter.toDate"
                       datepicker-popup="MMM, yyyy" datepicker-mode="'month'" datepicker-options="monthlyPeriodCtrl.dateOptions"
                       ng-click="monthlyPeriodCtrl.openPopupToDate($event)"
                       is-open="monthlyPeriodCtrl.calendar.toDateOpened" />
                <calendar-image class="calendar-image" ng-click="monthlyPeriodCtrl.openPopupToDate($event)"></calendar-image>
            </div>
            <div class="col-sm-1">
                <button class="button" ng-click="monthlyPeriodCtrl.query(monthlyPeriodCtrl.filter)" data-translate="Search"></button>
            </div>
        </div>
    </form>
    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="7">
                    <a class="pull-left button-icon create-button" href="" ng-click="monthlyPeriodCtrl.create()"
                       ng-show="monthlyPeriodCtrl.permission == monthlyPeriodCtrl.policyEnum.Host">
                        <span class="icon plus"></span>
                        <span class="button-text" data-translate="CreateMonthlyPeriod"></span>
                    </a>
                    <input type="text" ng-model="monthlyPeriodCtrl.searchKey" ng-change="monthlyPeriodCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="Name"></th>
                <th data-translate="StartDate"></th>
                <th data-translate="EndDate"></th>
                <th data-translate="TotalEmployees"></th>
                <th data-translate="UnfinishedEPA"></th>
                <th data-translate="Action"></th>
            </tr>
        </thead>
        <tbody>
            <tr dir-paginate="period in monthlyPeriodCtrl.filteredItems | itemsPerPage: monthlyPeriodCtrl.pageSize" current-page="monthlyPeriodCtrl.currentPage">
                <td class="text-center" ng-bind="monthlyPeriodCtrl.getIndex($index, monthlyPeriodCtrl.currentPage, monthlyPeriodCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="period.Name"></td>
                <td class="text-center" ng-bind="period.StartDate | date: monthlyPeriodCtrl.dateFormat"></td>
                <td class="text-center" ng-bind="period.EndDate | date: monthlyPeriodCtrl.dateFormat"></td>
                <td class="text-center">
                    <a href="{{monthlyPeriodCtrl.viewEmployeeSettingUrl}}" ng-click="monthlyPeriodCtrl.viewEmployeeSetting(period, false)">{{period.TotalEmployees}}</a>
                </td>
                <td class="text-center">
                    <a href="{{monthlyPeriodCtrl.viewEmployeeSettingUrl}}" ng-click="monthlyPeriodCtrl.viewEmployeeSetting(period, true)">{{period.TotalEmployeesUnfinished}}</a>
                </td>
                <td class="text-center">
                    <div class="btn-group">
                        <a class="glyphicon glyphicon-edit icon-edit" title="Edit" ng-click="monthlyPeriodCtrl.update(period.PeriodId)"
                           href="{{monthlyPeriodCtrl.updatePeriodUrl}}"></a>
                        <a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" title="Delete" ng-click="monthlyPeriodCtrl.delete(period)"
                           ng-show="monthlyPeriodCtrl.permission == monthlyPeriodCtrl.policyEnum.Host"></a>
                    </div>
                </td>
            </tr>
            <tr ng-show="monthlyPeriodCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot ng-show="monthlyPeriodCtrl.filteredItems.length > 0">
            <tr>
                <td colspan="7" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="monthlyPeriodCtrl.pageSize"
                            ng-options="entry for entry in monthlyPeriodCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
