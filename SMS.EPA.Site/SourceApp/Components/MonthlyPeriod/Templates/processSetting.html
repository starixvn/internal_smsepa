<div ng-controller="UpdateProcessSettingMonthlyPeriodController as processSettingPeriodCtrl">
    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th class="text-center" data-translate="HumanResource"></th>
                <th class="text-center" data-translate="SelfEvaluator"></th>
                <th class="text-center" data-translate="Evaluator"></th>
                <th class="text-center" data-translate="Reviewer"></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-translate="Duration"></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.processSettings">
                    <select ng-model="process.Duration" ng-options="opt for opt in [] | range:6"></select>
                </td>
            </tr>
            <tr>
                <td data-translate="NoticeAtBegin"></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.processSettings">
                    <input type="checkbox" ng-model="process.HasSendMail" />
                </td>
            </tr>
            <tr>
                <td data-translate="RemindDay"></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.processSettings">
                    <select ng-model="process.RemindDay"
                            ng-options="opt for opt in processSettingPeriodCtrl.remindDay"></select>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="btn-box btn-process-save">
        <input type="button" value="Save" class="btn btn-primary" ng-click="processSettingPeriodCtrl.save()" />
    </div>
</div>
