<div class="col-sm-12 monthly-period" ng-controller="UpdateMonthlyPeriodController as updateCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb period-breadcrumb">
            <li class="current" data-translate="UpdateMonthlyPeriod"></li>
        </ul>
        <button ng-click="updateCtrl.backToList()" class="btn btn-cancel">
            <span class="glyphicon glyphicon-menu-left"></span> <span data-translate="BackToList"></span>
        </button>
    </div>
    <div class="target-tabset">
        <tabset id="MonthlyPeriodTab">
            <tab heading="BASIC INFORMATION" class="tab-cursor" active="updateCtrl.dataTab.basicInformation" select="updateCtrl.tabBasicSelect()">
                <div ng-include src="'/SourceApp/Components/MonthlyPeriod/Templates/basicInformation.html'"></div>
            </tab>
            <tab heading="PROCESS SETTING" class="tab-cursor" active="updateCtrl.dataTab.processSetting" select="updateCtrl.tabProcessSettingSelect()">
                <div ng-include src="'/SourceApp/Components/MonthlyPeriod/Templates/processSetting.html'"></div>
            </tab>
            <tab heading="EMPLOYEE SETTING" class="tab-cursor" active="updateCtrl.dataTab.employeeSetting" select="updateCtrl.tabEmployeeSettingSelect()">
                <div ng-include src="'/SourceApp/Components/MonthlyPeriod/Templates/employeeSetting.html'"></div>
            </tab>
        </tabset>
    </div>
</div>
