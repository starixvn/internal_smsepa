<div class="col-sm-12" ng-controller="TargetEmployeeSettingController as targetEmployeeCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="TargetEmployeeSetting"></li>
        </ul>
    </div>
    <div>
        <form novalidate class="row form-inline filter">
            <div class="form-group">
                <label class="control-label" data-translate="Group">
                </label>
                <select ng-model="targetEmployeeCtrl.filter.groupId" ng-options="opt.GroupId as opt.GroupName for opt in targetEmployeeCtrl.groupOptions"
                        class="form-control lstBox-limit">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="control-label" data-translate="Employee"></label>
                <input class="form-control employee-search" ng-model="targetEmployeeCtrl.searchEmployee"
                       placeholder="Enter full name or nick name" search-auto-complete search-employees="targetEmployeeCtrl.getEmployee()"
                       ng-change="targetEmployeeCtrl.unSelectEmployee()" employee="targetEmployeeCtrl.filter.employee" />
            </div>
            <div class="form-group">
                <label data-translate="Form"></label>
                <select class="form-control lstBox-limit" ng-model="targetEmployeeCtrl.filter.targetTypeId"
                        ng-options="opt.TargetTypeId as opt.Name for opt in targetEmployeeCtrl.targetTypes">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <button class="button" ng-click="targetEmployeeCtrl.query(targetEmployeeCtrl.filter)" data-translate="Search"></button>
            </div>
        </form>

        <form novalidate class="row form-inline filter">
            <div class="form-group">
                <label class="control-label" data-translate="TargetTemplate">
                </label>
                <select ng-model="targetEmployeeCtrl.targetEmployeeSetting.targetTemplateId" ng-options="opt.TargetTemplateId as opt.Name for opt in targetEmployeeCtrl.targetTemplates"
                        class="form-control lstBox-limit">
                </select>
            </div>
            <div class="form-group">
                <button class="button" data-translate="Assign" ng-click="targetEmployeeCtrl.assignTargetTemplate()"></button>
            </div>
        </form>

        <table class="row table table-bordered table-striped" id="data">
            <thead>
                <tr class="header-table">
                    <th colspan="8">
                        <input type="text" ng-model="targetEmployeeCtrl.searchKey" ng-change="targetEmployeeCtrl.search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th>
                        <input type="checkbox" ng-click="targetEmployeeCtrl.checkAll(targetEmployeeCtrl.selectedAll)" 
                               ng-model="targetEmployeeCtrl.selectedAll" />
                    </th>
                    <th data-translate="SymbolCount">
                    </th>
                    <th data-translate="Code">
                    </th>
                    <th data-translate="Group">
                    </th>
                    <th data-translate="NickName">
                    </th>
                    <th data-translate="FullName">
                    </th>
                    <th data-translate="Form">
                    </th>
                    <th data-translate="TargetTemplate">
                    </th>
                </tr>
            </thead>
            <tbody class="table-body">
                <tr dir-paginate="employee in targetEmployeeCtrl.filteredItems | itemsPerPage: targetEmployeeCtrl.pageSize" current-page="targetEmployeeCtrl.currentPage">
                    <td class="text-center">
                        <input type="checkbox" ng-model="employee.Selected" ng-click="targetEmployeeCtrl.syncSelectedEmployee(employee.EmployeeId, employee.Selected)"/>
                    </td>
                    <td class="text-center" ng-bind="targetEmployeeCtrl.getIndex($index, targetEmployeeCtrl.currentPage, targetEmployeeCtrl.pageSize)"></td>
                    <td class="text-center" ng-bind="employee.Code"></td>
                    <td class="text-center">
                        <span tooltip="{{employee.Group.GroupName}}" ng-bind="employee.Group.GroupCode"></span>
                    </td>
                    <td class="text-center" ng-bind="employee.NickName"></td>
                    <td ng-bind="employee.FullName"></td>
                    <td class="text-center" ng-bind="employee.TargetTemplate.TargetTypeName"></td>
                    <td ng-bind="employee.TargetTemplate.Name"></td>
                </tr>
                <tr ng-show="targetEmployeeCtrl.filteredItems.length == 0">
                    <td class="empty-result" colspan="8" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="9" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="targetEmployeeCtrl.pageSize"
                                ng-options="entry for entry in targetEmployeeCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
