<div ng-controller="TargetPersonnelSettingController as personnelCtrl">
    <form novalidate class="form-filter">
        <div class="form-group">
            <label class="label-form" data-translate="Section"></label>
            <select class="form-control select-form" ng-model="personnelCtrl.filter.groupId"
                    ng-options="item.DepartmentId as item.Name disable when item.DepartmentId > 0 for item in personnelCtrl.treeDepartment">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="label-form" data-translate="Employee"></label>
            <input class="form-control input-form" type="text" placeholder="full name or nick name"
                   ng-model="personnelCtrl.searchEmployee" search-auto-complete search-employees="personnelCtrl.getEmployee()"
                   ng-change="personnelCtrl.unSelectEmployee()" employee="personnelCtrl.filter.employee" />
        </div>
        <div class="form-group">
            <label class="label-form" data-translate="TargetType"></label>
            <select class="form-control select-form" ng-model="personnelCtrl.filter.targetTypeId"
                    ng-options="opt.TargetTypeId as opt.Name for opt in personnelCtrl.targetTypes">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group"></div>
        <div class="form-group">
            <label class="label-form"></label>
            <div class="checkbox checkbox-form">
                <label>
                    <input type="checkbox" ng-model="personnelCtrl.filter.showAll"> Show all
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="label-form"></label>
            <button class="btn btn-primary" ng-click="personnelCtrl.query(personnelCtrl.filter)" data-translate="Search"></button>
        </div>
    </form>

    <table class="row table table-bordered table-striped target-setting-template" id="data">
        <thead>
            <tr class="header-table">
                <th colspan="10">
                    <div class="pull-left div-target-templatesetting" ng-show="targetCtrl.permission == targetCtrl.policyEnum.Host">
                        <label class="control-label" data-translate="TargetTemplate"></label>
                        <select ng-model="personnelCtrl.targetEmployeeSetting.targetTemplateId"
                                ng-options="opt.TargetTemplateId as opt.Name for opt in personnelCtrl.targetTemplates"
                                class="target-template-setting-select lstBox-limit"></select>
                    </div>
                    <button class="btn btn-primary pull-left btn-assign" data-translate="Assign" ng-click="personnelCtrl.assignTargetTemplate()"
                            ng-show="targetCtrl.permission == targetCtrl.policyEnum.Host"></button>
                    <input class="btnExcel pull-right"
                           ng-click="personnelCtrl.exportReport()"
                           type="button" title="Export to Excel">
                    <input type="text" ng-model="personnelCtrl.searchKey" ng-change="personnelCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th>
                    <input type="checkbox" ng-click="personnelCtrl.checkAll(personnelCtrl.selectedAll)"
                           ng-model="personnelCtrl.selectedAll" />
                </th>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Code"></th>
                <th data-translate="NickName"></th>
                <th data-translate="FullName"></th>
                <th data-translate="Section"></th>
                <th data-translate="Team"></th>
                <th data-translate="TargetType"></th>
                <th data-translate="TargetTemplate"></th>
                <th data-translate="Delete" ng-show="targetCtrl.permission === targetCtrl.policyEnum.Host"></th>
            </tr>
        </thead>
        <tbody class="table-body" current-page="personnelCtrl.currentPage" ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}"
               dir-paginate="employee in personnelCtrl.filteredItems | itemsPerPage: personnelCtrl.pageSize" pagination-id="personnel">
            <tr ng-repeat="targetTemplate in employee.TargetTemplates" ng-show="employee.TargetTemplates.length > 0">
                <td class="text-center" rowspan="{{employee.NumberTargetTemplates}}" ng-show="$first">
                    <input type="checkbox" ng-model="employee.Selected"
                           ng-click="personnelCtrl.syncSelectedEmployee(employee.EmployeeId, employee.Selected)" />
                </td>
                <td class="text-center" ng-bind="personnelCtrl.getIndex($parent.$index, personnelCtrl.currentPage, personnelCtrl.pageSize)"
                    ng-show="$first" rowspan="{{employee.NumberTargetTemplates}}"></td>
                <td class="text-center" ng-bind="employee.Code" ng-show="$first" rowspan="{{employee.NumberTargetTemplates}}"></td>
                <td class="text-center" ng-bind="employee.Nickname" ng-show="$first" rowspan="{{employee.NumberTargetTemplates}}"></td>
                <td ng-bind="employee.FullName" ng-show="$first" rowspan="{{employee.NumberTargetTemplates}}"></td>
                <td ng-show="$first" rowspan="{{employee.NumberTargetTemplates}}" ng-bind="employee.Department"></td>
                <td ng-show="$first" rowspan="{{employee.NumberTargetTemplates}}" ng-bind="employee.Section"></td>
                <td ng-bind="targetTemplate.TargetTypeName"></td>
                <td ng-bind="targetTemplate.Name"></td>
                <td class="text-center" ng-show="targetCtrl.permission === targetCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="personnelCtrl.deleteTargetTemplate(employee, targetTemplate)"
                       ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
            </tr>
            <tr ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}" ng-show="employee.TargetTemplates.length === 0">
                <td class="text-center">
                    <input type="checkbox" ng-model="employee.Selected" ng-click="personnelCtrl.syncSelectedEmployee(employee.EmployeeId, employee.Selected)" />
                </td>
                <td class="text-center" ng-bind="personnelCtrl.getIndex($index, personnelCtrl.currentPage, personnelCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="employee.Code"></td>
                <td class="text-center" ng-bind="employee.Nickname"></td>
                <td ng-bind="employee.FullName"></td>
                <td ng-bind="employee.Department"></td>
                <td ng-bind="employee.Section"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
        <tbody ng-show="personnelCtrl.filteredItems.length === 0">
            <tr>
                <td class="empty-result" colspan="10" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="10" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="personnelCtrl.pageSize"
                            ng-options="entry for entry in personnelCtrl.entries" ng-change="personnelCtrl.currentPage = 1"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <ul uib-pagination total-items="personnelCtrl.filteredItems.length" items-per-page="personnelCtrl.pageSize"
                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="personnelCtrl.currentPage"
                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
