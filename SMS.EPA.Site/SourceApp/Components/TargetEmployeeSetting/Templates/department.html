<div ng-controller="TargetDepartmentSettingController as departmentCtrl">
    <form novalidate class="form-filter">
        <div class="form-group">
            <label class="label-form" data-translate="DepartmentSection"></label>
            <select ng-model="departmentCtrl.filter.departmentId" ng-options="opt.DepartmentId as opt.Name for opt in departmentCtrl.treeDepartment"
                    class="form-control select-form" ng-change="departmentCtrl.updateIsGroup(departmentCtrl.filter.departmentId)">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="label-form" data-translate="TargetType"></label>
            <select class="form-control select-form" ng-model="departmentCtrl.filter.targetTypeId"
                    ng-options="opt.TargetTypeId as opt.Name for opt in departmentCtrl.targetTypes">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="label-form"></label>
            <div class="checkbox checkbox-form">
                <label>
                    <input type="checkbox" ng-model="departmentCtrl.filter.showAll"> Show all
                </label>
            </div>
        </div>
        <div class="form-group">
            <button class="btn btn-primary" ng-click="departmentCtrl.query(departmentCtrl.filter)" data-translate="Search"></button>
        </div>
    </form>

    <table class="row table table-bordered table-striped target-setting-template" id="data">
        <thead>
            <tr class="header-table">
                <th colspan="7">
                    <div class="pull-left div-target-templatesetting" ng-show="targetCtrl.permission == targetCtrl.policyEnum.Host">
                        <label class="control-label" data-translate="TargetTemplate"></label>
                        <select ng-model="departmentCtrl.targetDepartmentSetting.targetTemplateId"
                                ng-options="opt.TargetTemplateId as opt.Name for opt in departmentCtrl.targetTemplates"
                                class="target-template-setting-select lstBox-limit"></select>
                    </div>
                    <button class="btn btn-primary pull-left btn-assign" data-translate="Assign" ng-click="departmentCtrl.assignTargetTemplate()"
                            ng-show="targetCtrl.permission == targetCtrl.policyEnum.Host"></button>
                    <input type="text" ng-model="departmentCtrl.searchKey" ng-change="departmentCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th>
                    <input type="checkbox" ng-click="departmentCtrl.checkAll(departmentCtrl.selectedAll)"
                           ng-model="departmentCtrl.selectedAll" />
                </th>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Department"></th>
                <th>Section/Team</th>
                <th data-translate="TargetType"></th>
                <th data-translate="TargetTemplate"></th>
                <th data-translate="Delete" ng-show="targetCtrl.permission === targetCtrl.policyEnum.Host"></th>
            </tr>
        </thead>
        <tbody class="table-body" dir-paginate="department in departmentCtrl.filteredItems | itemsPerPage: departmentCtrl.pageSize"
               pagination-id="department" current-page="departmentCtrl.currentPage" ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}">
            <tr ng-repeat="targetTemplate in department.TargetTemplates" ng-show="department.TargetTemplates.length > 0">
                <td class="text-center" rowspan="{{department.NumberTargetTemplates}}" ng-show="$first">
                    <input type="checkbox" ng-model="department.Selected" ng-click="departmentCtrl.syncSelectedDepartment(department, department.Selected)" />
                </td>
                <td class="text-center" ng-bind="departmentCtrl.getIndex($parent.$index, departmentCtrl.currentPage, departmentCtrl.pageSize)"
                    ng-show="$first" rowspan="{{department.NumberTargetTemplates}}"></td>
                <td ng-show="$first" rowspan="{{department.NumberTargetTemplates}}" ng-bind="department.Department"></td>
                <td ng-show="$first" rowspan="{{department.NumberTargetTemplates}}" ng-bind="department.Section"></td>
                <td ng-bind="targetTemplate.TargetTypeName"></td>
                <td ng-bind="targetTemplate.Name"></td>
                <td class="text-center" ng-show="targetCtrl.permission === targetCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="departmentCtrl.deleteTargetTemplate(department, targetTemplate)"
                       ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
            </tr>
            <tr ng-show="department.TargetTemplates.length === 0">
                <td class="text-center">
                    <input type="checkbox" ng-model="department.Selected" ng-click="departmentCtrl.syncSelectedDepartment(department, department.Selected)" />
                </td>
                <td class="text-center" ng-bind="departmentCtrl.getIndex($index, departmentCtrl.currentPage, departmentCtrl.pageSize)"></td>
                <td ng-bind="department.Department"></td>
                <td ng-bind="department.Section"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
        <tbody ng-show="departmentCtrl.filteredItems.length === 0">
            <tr>
                <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="7" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="departmentCtrl.pageSize"
                            ng-options="entry for entry in departmentCtrl.entries" ng-change="departmentCtrl.currentPage = 1"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <ul uib-pagination total-items="departmentCtrl.filteredItems.length" items-per-page="departmentCtrl.pageSize"
                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="departmentCtrl.currentPage"
                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
