<div class="col-sm-12" ng-controller="DetailAttendanceSummaryController as detailAttendanceCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="DisciplineSummaryDetail"></li>
        </ul>
    </div>

    <form novalidate class="row form-horizontal filter">
        <div class="form-group">
            <label class="col-sm-1 control-label" data-translate="Department"></label>
            <div class="col-sm-2 field">
                <select class="department-select form-control" ng-model="detailAttendanceCtrl.filter.departmentId"
                        ng-options="opt.DepartmentId as opt.Name for opt in detailAttendanceCtrl.treeDepartment">
                    <option value="">-- Select a Department / Section --</option>
                </select>
            </div>
            <label class="col-sm-1 control-label" data-translate="Category"></label>
            <div class="col-sm-1">
                <select class="form-control" ng-model="detailAttendanceCtrl.filter.isLocal">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option value="false">{{"Expat" | translate}}</option>
                    <option value="true">{{"Local" | translate}}</option>
                </select>
            </div>
            <label class="col-sm-1 control-label" data-translate="Employee"></label>
            <div class="col-sm-1 field">
                <input class="form-control employee-search" ng-model="detailAttendanceCtrl.searchEmployee"
                       placeholder="Enter full name or nick name" search-auto-complete search-employees="detailAttendanceCtrl.getEmployee()"
                       ng-change="detailAttendanceCtrl.unSelectEmployee()" employee="detailAttendanceCtrl.filter.employee" />
            </div>
            <label class="col-sm-1 control-label ignore-status-discipline" data-translate="Ignored Status"></label>
            <div class="col-sm-1">
                <select class="form-control" ng-model="detailAttendanceCtrl.filter.hasIgnored">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option value="true">{{"Ignored" | translate}}</option>
                    <option value="false">{{"NotIgnored" | translate}}</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-1 control-label" data-translate="Reason"></label>
            <div class="col-sm-2 field">
                <select class="form-control" ng-model="detailAttendanceCtrl.filter.reasonId"
                        ng-options="opt.ViolationId as opt.Name for opt in detailAttendanceCtrl.violationOptions">
                    <option value="">-- Select a Reason --</option>
                </select>
            </div>
            <label class="col-sm-1 control-label" data-translate="StartDate"></label>
            <div class="col-sm-1 field">
                <input readonly class="calendar-form-control date-detail-discipline" type="text"
                       ng-model="detailAttendanceCtrl.filter.startDate" datepicker-popup
                       ng-click="detailAttendanceCtrl.openPopupStartDate($event)"
                       is-open="detailAttendanceCtrl.calendar.startDateOpened" />
                <calendar-image class="calendar-image" ng-click="detailAttendanceCtrl.openPopupStartDate($event)"></calendar-image>
            </div>
            <label class="col-sm-1 control-label" data-translate="EndDate"></label>
            <div class="col-sm-1 field">
                <input readonly class="calendar-form-control date-detail-discipline" type="text"
                       ng-model="detailAttendanceCtrl.filter.endDate" datepicker-popup
                       ng-click="detailAttendanceCtrl.openPopupEndDate($event)"
                       is-open="detailAttendanceCtrl.calendar.endDateOpened" />
                <calendar-image class="calendar-image" ng-click="detailAttendanceCtrl.openPopupEndDate($event)"></calendar-image>
            </div>
            <label class="col-sm-1 control-label lb-show-all-discipline" data-translate="ShowAll">
            </label>
            <div class="col-sm-1 field ckc-show-all-discipline">
                <input type="checkbox" ng-model="detailAttendanceCtrl.filter.showAll" />
            </div>
            <div class="col-sm-1">
                <input type="button" value="Search" class="button" ng-click="detailAttendanceCtrl.query(detailAttendanceCtrl.filter)" />
            </div>
        </div>
    </form>

    <span us-spinner spinner-key="spinner-1" spinner-start-active="true" spinner-theme="bigBlue"></span>

    <table class="row table table-bordered table-striped attendance-detail">
        <thead>
            <tr class="header-table">
                <th colspan="19">
                    <a class="pull-left button-icon back-button" ng-click="detailAttendanceCtrl.backToList()" ng-show="detailAttendanceCtrl.fromSummaryPage">
                        <span class="icon back"></span>
                        <span class="button-back-text" data-translate="BackToList"></span>
                    </a>
                    <input class="btnExcel pull-right" export-attendance-detail-report
                           ng-click="detailAttendanceCtrl.exportReport(detailAttendanceCtrl.filter)"
                           type="button" title="Export to Excel">
                    <input type="text" ng-model="detailAttendanceCtrl.searchKey" ng-change="detailAttendanceCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="Nick"></th>
                <th data-translate="Section"></th>
                <th data-translate="Date"></th>
                <th data-translate="Shift"></th>
                <th data-translate="CheckIn"></th>
                <th data-translate="CheckOut"></th>
                <th data-translate="TotalHours"></th>
                <th data-translate="WorkingUnderTime"></th>
                <th data-translate="LateIn"></th>
                <th data-translate="EarlyOut"></th>
                <th data-translate="Absent"></th>
                <th data-translate="UnpaidLeaveShort"></th>
                <th data-translate="UnpaidLeaveAbsentShort"></th>
                <th data-translate="ChangeShift"></th>
                <th data-translate="SystemSubtractScore"></th>
                <th data-translate="ApproverSubtractScore"></th>
                <th data-translate="ApproverComment"></th>
                <th data-translate="EmployeeComment"></th>
            </tr>
        </thead>
        <tbody>
            <tr dir-paginate="employee in detailAttendanceCtrl.filteredItems | itemsPerPage: detailAttendanceCtrl.pageSize"
                pagination-id="detail" current-page="detailAttendanceCtrl.currentPage">
                <td class="width-200">
                    <span ng-bind="employee.Employee.NickName" popover-avatar avatar-src="{{employee.Employee.Avatar}}"></span>
                </td>
                <td class="text-center" ng-bind="employee.Employee.Group.GroupName"></td>
                <td class="text-center width250" ng-bind="employee.WorkDate | date: detailAttendanceCtrl.dateFormat"></td>
                <td class="text-center width180" ng-bind="employee.ShiftName"></td>
                <td class="width-100">
                    <span ng-show="employee.CheckIn.Value" ng-bind="employee.CheckIn.Value | date:detailAttendanceCtrl.timeFormat"></span>
                    <span ng-show="!employee.CheckIn.Value">-</span>
                    <input class="ignore-right" ng-show="employee.CheckIn.HasViolated" ng-model="employee.CheckIn.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.CheckIn)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.CheckIn.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width-100">
                    <span ng-show="employee.CheckOut.Value" ng-bind="employee.CheckOut.Value | date:detailAttendanceCtrl.timeFormat"></span>
                    <span ng-show="!employee.CheckOut.Value">-</span>
                    <input class="ignore-right" ng-show="employee.CheckOut.HasViolated" ng-model="employee.CheckOut.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.CheckOut)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.CheckOut.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width180">
                    <span ng-show="employee.TotalHours.Value" ng-bind="employee.TotalHours.Value"></span>
                    <span ng-show="!employee.TotalHours.Value">-</span>
                </td>
                <td class="width180">
                    <span ng-show="employee.TotalHours.Value && employee.TotalHours.HasViolated">1</span>
                    <span ng-show="!employee.TotalHours.Value || !employee.TotalHours.HasViolated">-</span>
                    <input class="ignore-right" ng-show="employee.TotalHours.HasViolated" ng-model="employee.TotalHours.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.TotalHours)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.TotalHours.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width180">
                    <span ng-show="employee.LateIn.Value" ng-bind="employee.LateIn.Value"></span>
                    <span ng-show="!employee.LateIn.Value">-</span>
                    <input class="ignore-right" ng-show="employee.LateIn.HasViolated" ng-model="employee.LateIn.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.LateIn)"
                           ng-disabled="!employee.LateIn.HasApprovedBy || detailAttendanceCtrl.permission != 2 || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width180">
                    <span ng-show="employee.EarlyOut.Value" ng-bind="employee.EarlyOut.Value"></span>
                    <span ng-show="!employee.EarlyOut.Value">-</span>
                    <input class="ignore-right" ng-show="employee.EarlyOut.HasViolated" ng-model="employee.EarlyOut.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.EarlyOut)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.EarlyOut.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width-100">
                    <span ng-show="employee.Absent.Value" ng-bind="employee.Absent.Value"></span>
                    <span ng-show="!employee.Absent.Value">-</span>
                    <input class="ignore-right" ng-show="employee.Absent.HasViolated" ng-model="employee.Absent.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.Absent)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.Absent.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width-100">
                    <span ng-show="employee.UnpaidLeave.Value" ng-bind="employee.UnpaidLeave.Value"></span>
                    <span ng-show="!employee.UnpaidLeave.Value">-</span>
                    <input class="ignore-right" ng-show="employee.UnpaidLeave.HasViolated" ng-model="employee.UnpaidLeave.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.UnpaidLeave)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.UnpaidLeave.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width-100">
                    <span ng-show="employee.UnpaidLeaveAbsent.Value" ng-bind="employee.UnpaidLeaveAbsent.Value"></span>
                    <span ng-show="!employee.UnpaidLeaveAbsent.Value">-</span>
                    <input class="ignore-right" ng-show="employee.UnpaidLeaveAbsent.HasViolated" ng-model="employee.UnpaidLeaveAbsent.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.UnpaidLeaveAbsent)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.UnpaidLeaveAbsent.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="width-100">
                    <span ng-show="employee.ChangeShift.Value" ng-bind="employee.ChangeShift.Value"></span>
                    <span ng-show="!employee.ChangeShift.Value">-</span>
                    <input class="ignore-right" ng-show="employee.ChangeShift.HasViolated" ng-model="employee.ChangeShift.HasIgnored"
                           ng-click="detailAttendanceCtrl.calculateApproverScore(employee, employee.ChangeShift)"
                           ng-disabled="detailAttendanceCtrl.permission != 2 || !employee.ChangeShift.HasApprovedBy || employee.OutOfDate" type="checkbox"></input>
                </td>
                <td class="text-right width-100">
                    <span class="red" ng-show="employee.SystemSubtractScore > 0">-{{employee.SystemSubtractScore | number: 1}}</span>
                    <span ng-show="employee.SystemSubtractScore == 0">{{employee.SystemSubtractScore | number: 1}}</span>
                </td>
                <td class="text-right width-100">
                    <span class="red" ng-show="employee.ApproverSubtractScore > 0
                          && employee.ApproverSubtractScore <= employee.SystemSubtractScore">
                        -{{employee.ApproverSubtractScore | number: 1}}
                    </span>
                    <span class="red" ng-show="employee.ApproverSubtractScore > 0
                          && employee.ApproverSubtractScore > employee.SystemSubtractScore">
                        -{{employee.SystemSubtractScore | number: 1}}
                    </span>
                    <span ng-show="employee.ApproverSubtractScore == 0">{{employee.ApproverSubtractScore | number: 1}}</span>
                </td>
                <td class="text-center width-100">
                    <span class="glyphicon icon-description"
                          ng-show="employee.ApproverComment.length > 0" tooltip="{{employee.ApproverComment}}"></span>
                </td>
                <td class="text-center width-100">
                    <span class="glyphicon icon-description"
                          ng-show="employee.EmployeeComment.length > 0" tooltip="{{employee.EmployeeComment}}"></span>
                </td>
            </tr>
            <tr ng-show="detailAttendanceCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="19" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="19" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="detailAttendanceCtrl.pageSize"
                            ng-options="entry for entry in detailAttendanceCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls pagination-id="detail" boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
    <div class="col-sm-1" ng-if="detailAttendanceCtrl.permission == 2">
        <input type="button" value="Save" class="button" ng-click="detailAttendanceCtrl.save()" />
    </div>
</div>
