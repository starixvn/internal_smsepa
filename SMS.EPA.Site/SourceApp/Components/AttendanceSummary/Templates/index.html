<div class="col-sm-12" ng-controller="AttendanceSummaryController as attendanceCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="DisciplineSummary"></li>
        </ul>
    </div>

    <form novalidate class="row form-horizontal filter">
        <div class="form-group">
            <label class="col-sm-1 text-right" data-translate="Department"></label>
            <div class="col-sm-3 field">
                <select class="department-select form-control" ng-model="attendanceCtrl.filter.departmentId"
                        ng-options="opt.DepartmentId as opt.Name for opt in attendanceCtrl.treeDepartment">
                    <option value="">-- Select a Department / Section --</option>
                </select>
            </div>
            <label class="col-sm-1 text-right" data-translate="Employee"></label>
            <div class="col-sm-3 field">
                <input class="form-control employee-search" ng-model="attendanceCtrl.searchEmployee"
                       placeholder="Enter full name or nick name" search-auto-complete search-employees="attendanceCtrl.getEmployee()"
                       ng-change="attendanceCtrl.unSelectEmployee()" employee="attendanceCtrl.filter.employee" />
            </div>
            <label class="col-sm-1 text-right" data-translate="Reason"></label>
            <div class="col-sm-2 field">
                <select class="form-control" ng-model="attendanceCtrl.filter.reasonId"
                        ng-options="opt.ViolationId as opt.Name for opt in attendanceCtrl.violationOptions">
                    <option value="">-- Select a Reason --</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-1 text-right" data-translate="StartDate">
            </label>
            <div class="col-sm-3 field">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="attendanceCtrl.filter.startDate" datepicker-popup
                       ng-click="attendanceCtrl.openPopupStartDate($event)"
                       is-open="attendanceCtrl.calendar.startDateOpened" />
                <calendar-image class="calendar-image" ng-click="attendanceCtrl.openPopupStartDate($event)"></calendar-image>
            </div>
            <label class="col-sm-1 text-right" data-translate="EndDate">
            </label>
            <div class="col-sm-3 field">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="attendanceCtrl.filter.endDate" datepicker-popup
                       ng-click="attendanceCtrl.openPopupEndDate($event)"
                       is-open="attendanceCtrl.calendar.endDateOpened" />
                <calendar-image class="calendar-image" ng-click="attendanceCtrl.openPopupEndDate($event)"></calendar-image>
            </div>
            <label class="col-sm-1">
            </label>
            <div class="col-sm-1 btn-box daily-btn-box">
                <input type="button" value="Search" class="button" ng-click="attendanceCtrl.query(attendanceCtrl.filter)" />
            </div>
        </div>
    </form>

    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="17">
                    <a class="pull-left button-icon create-button" href="" ng-click="attendanceCtrl.addOtherViolations()" ng-if="attendanceCtrl.permission == 2">
                        <span class="icon plus"></span>
                        <span class="button-text" data-translate="AddOtherViolations"></span>
                    </a>
                    <input type="text" ng-model="attendanceCtrl.searchKey" ng-change="attendanceCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount">
                </th>
                <th data-translate="Section">
                </th>
                <th data-translate="Code">
                </th>
                <th data-translate="Nick">
                </th>
                <th data-translate="CheckInOut">
                </th>
                <th data-translate="WorkingTime">
                </th>
                <th data-translate="LateIn">
                </th>
                <th data-translate="EarlyOut">
                </th>
                <th data-translate="Absent">
                </th>
                <th data-translate="UnpaidLeaveShort">
                </th>
                <th data-translate="UnpaidLeaveAbsentShort">
                </th>
                <th data-translate="ChangeShift">
                </th>
                <th data-translate="OtherViolations">
                </th>
                <th data-translate="SystemSubtractScore">
                </th>
                <th data-translate="ApproverSubtractScore">
                </th>
                <th data-translate="Action" ng-if="attendanceCtrl.permission >= 1">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr dir-paginate="employee in attendanceCtrl.filteredItems | itemsPerPage: attendanceCtrl.pageSize" current-page="attendanceCtrl.currentPage">
                <td class="text-center" ng-bind="attendanceCtrl.getIndex($index, attendanceCtrl.currentPage, attendanceCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="employee.Group.GroupName"></td>
                <td class="text-center" ng-bind="employee.Employee.Code"></td>
                <td class="text-center">
                    <span ng-bind="employee.Employee.NickName" tooltip="{{employee.Employee.FullName}}"></span>
                </td>
                <td ng-bind="employee.MissingCheckInOut"></td>
                <td ng-bind="employee.WorkingBelowTime"></td>
                <td ng-bind="employee.LateIn"></td>
                <td ng-bind="employee.EarlyOut"></td>
                <td ng-bind="employee.Absent"></td>
                <td ng-bind="employee.UnpaidLeave"></td>
                <td ng-bind="employee.UnpaidLeaveAbsent"></td>
                <td ng-bind="employee.ChangeShift"></td>
                <td>
                    <div ng-show="employee.OtherViolationsScore > 0">
                        <a class="red" href="" ng-click="attendanceCtrl.addOtherViolations(employee)"
                           ng-if="attendanceCtrl.permission == 2 && employee.Permission == 2">
                            -{{employee.OtherViolationsScore | number: 1}}
                        </a>
                        <span class="red" ng-if="employee.Permission == 1 || attendanceCtrl.permission == 1">-{{employee.OtherViolationsScore | number: 1}}</span>
                    </div>
                    <div ng-show="employee.OtherViolationsScore == 0">
                        <a href="" ng-click="attendanceCtrl.addOtherViolations(employee)" ng-if="attendanceCtrl.permission == 2 && employee.Permission == 2">
                            {{employee.OtherViolationsScore | number: 1}}
                        </a>
                        <span ng-if="employee.Permission == 1 || attendanceCtrl.permission == 1">{{employee.OtherViolationsScore | number: 1}}</span>
                    </div>
                </td>
                <td class="red">-{{employee.SystemSubtractScore | number: 1}}</td>
                <td class="red">-{{employee.ApproverSubtractScore | number: 1}}</td>
                <td class="text-center" ng-if="attendanceCtrl.permission >= 1">
                    <a class="glyphicon glyphicon-edit icon-edit" title="View" href="{{attendanceCtrl.attendanceDetailUrl}}" ng-click="attendanceCtrl.adjust(employee)"></a>
                </td>
            </tr>
            <tr ng-show="attendanceCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="17" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="17" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="attendanceCtrl.pageSize"
                            ng-options="entry for entry in attendanceCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
