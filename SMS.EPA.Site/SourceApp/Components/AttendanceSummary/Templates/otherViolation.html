<div class="modal-header">
    <div class="popup-header">
        {{"OtherViolations" | translate}}
        <span>- {{violationCtrl.employee.Employee.NickName}}</span>
        <span class="close-popup" ng-click="violationCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="NickName"></th>
                <th data-translate="ViolationDate"></th>
                <th data-translate="ViolationType"></th>
                <th data-translate="SubtractScore"></th>
                <th data-translate="Comment"></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="violation in violationCtrl.otherViolations">
                <td class="text-center" ng-bind="$index + 1"></td>
                <td class="text-center" ng-bind="violation.NickName"></td>
                <td class="text-center" ng-bind="violation.WorkDate | date: dateFormat"></td>
                <td class="text-center" ng-bind="violation.Name"></td>
                <td class="text-center" ng-bind="violation.Score | number: 1"></td>
                <td class="text-center" ng-bind="violation.Comment"></td>
            </tr>
            <tr ng-show="violationCtrl.otherViolations.length == 0">
                <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
    </table>
</div>
<div class="modal-footer">
    <button class="btn btn-default customize" ng-click="violationCtrl.cancel()" data-translate="Cancel"></button>
</div>
