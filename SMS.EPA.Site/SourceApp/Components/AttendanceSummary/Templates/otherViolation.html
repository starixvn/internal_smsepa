
<div class="modal-header">
    <div class="popup-header">
        {{"OtherViolations" | translate}}
        - {{violationCtrl.employee.NickName}}
        <span class="close-popup" ng-click="violationCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Name">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" maxlength="200" ng-model="violationCtrl.violation.Name" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="WorkDate">
            </label>
            <div class="col-sm-3">
                <input readonly class="calendar-form-control" type="text"
                       ng-model="violationCtrl.violation.WorkDate" datepicker-popup
                       ng-click="violationCtrl.openPopupStartDate($event)" min-date="{{violationCtrl.calendar.minDate}}"
                       is-open="violationCtrl.calendar.startDateOpened" />
                <calendar-image class="calendar-image" ng-click="violationCtrl.openPopupStartDate($event)"></calendar-image>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Score"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" number-dot ng-model="violationCtrl.violation.Score" required />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Comment">
            </label>
            <div class="col-sm-8">
                <textarea type="text" class="form-control" maxlength="2000" ng-model="violationCtrl.violation.Comment"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">
            </label>
            <div class="col-sm-8">
                <button class="button" ng-click="violationCtrl.addViolation(violationCtrl.violation)" data-translate="Add"></button>
            </div>
        </div>
    </form>

    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="headerName">
                <th data-translate="SymbolCount">
                </th>
                <th data-translate="WorkDate">
                </th>
                <th data-translate="Name">
                </th>
                <th data-translate="Score">
                </th>
                <th data-translate="Comment">
                </th>
                <th data-translate="Delete">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr dir-paginate="violation in violationCtrl.filteredItems | itemsPerPage: violationCtrl.pageSize" current-page="violationCtrl.currentPage">
                <td class="text-center" ng-bind="violationCtrl.getIndex($index, violationCtrl.currentPage, violationCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="violation.WorkDate | date: dateFormat"></td>
                <td class="text-center" ng-bind="violation.Name"></td>
                <td class="text-center" ng-bind="violation.Score | number: 1"></td>
                <td class="text-center" ng-bind="violation.Comment"></td>
                <td class="text-center">
                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" title="Delete" ng-click="violationCtrl.delete(violation)"></a>
                </td>
            </tr>
            <tr ng-show="violationCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal-footer">
    <button class="btn btn-default customize" ng-click="violationCtrl.cancel()" data-translate="Cancel"></button>
</div>
