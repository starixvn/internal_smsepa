<div class="department-flow" ng-controller="DepartmentFlowController as deptFlowCtrl">
    <div class="expand-user" title="Show Employee List" ng-show="!deptFlowCtrl.showListEmployee"
         ng-click="deptFlowCtrl.toggleDepartmentDraggableList()">
        <span class="glyphicon glyphicon-user icon-user"></span>
    </div>
    <div class="row">
        <div class="col-sm-3 employee-list" id="employeeList" ng-show="deptFlowCtrl.showListEmployee">
            <div class="row flow-header">
                <span data-translate="Employee"></span>
                <a ng-click="deptFlowCtrl.toggleDepartmentDraggableList()" href="javascript:;"
                   class="pull-right glyphicon glyphicon-arrow-left"></a>
            </div>
            <div class="row">
                <select class="department-select form-control" ng-model="deptFlowCtrl.departmentId"
                        ng-options="opt.DepartmentId as opt.Name for opt in updateCtrl.treeDepartment"
                        ng-change="deptFlowCtrl.getEmployee()">
                    <option style="display: none" value="">-- Select a Department / Section --</option>
                </select>
            </div>
            <div class="row">
                <input type="text" ng-model="deptFlowCtrl.employeeName"
                       class="txt-search search-inline-textbox" placeholder="Enter full name or nick name" />
            </div>
            <ul class="row custom-ul employee-ul list-unstyled">
                <li class="ui-state-highlight" list-draggable=".sortable"
                    ng-repeat="employee in deptFlowCtrl.employees | filter: deptFlowCtrl.employeeName"
                    id="{{employee.EmployeeId}}">
                    {{employee.NickName}} ({{employee.FullName}})
                </li>
            </ul>
        </div>
        <div class="col-sm-9 set-flow">
            <form class="row form-horizontal form-multiLine">
                <div class="form-group">
                    <label class="col-sm-2 control-label" data-translate="DepartmentHasSetting"></label>
                    <div class="col-sm-8 department-name-setting">
                        <span ng-bind="deptFlowCtrl.departmentHasSettingName"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label" data-translate="ApplyToDepartment"></label>
                    <div class="col-sm-3">
                        <select class="sel-department form-control" required ng-model="deptFlowCtrl.department"
                                ng-options="opt as opt.Name for opt in updateCtrl.treeDepartment"
                                ng-change="deptFlowCtrl.getDepartmentFlowById()">
                            <option style="display: none" value="">-- Select a Department / Section --</option>
                        </select>
                    </div>
                </div>
            </form>
            <table class="row table table-bordered table-striped">
                <thead>
                    <tr class="headerName">
                        <th class="col-sm-2 text-center" data-translate="HumanResource"></th>
                        <th class="col-sm-2 text-center" data-translate="SelfEvaluator"></th>
                        <th class="col-sm-2 text-center" data-translate="Evaluator"></th>
                        <th class="col-sm-2 text-center" data-translate="Reviewer"></th>
                        <th class="col-sm-2 text-center" data-translate="Management" ng-show="!deptFlowCtrl.flowTemplate.IsMonthly"></th>
                    </tr>
                </thead>
                <tbody class="table-body">
                    <tr>
                        <td class="col-sm-2 col-human-resource">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="humanResourceList">
                                <li class="alert alert-info nomargin" ng-repeat="humanResource in deptFlowCtrl.humanResources.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(humanResource, deptFlowCtrl.humanResources.employees)"></a>
                                    <img uib-tooltip="{{humanResource.FullName}}" class="img-flow" ng-src="{{humanResource.Avatar}}" />
                                    <p>{{humanResource.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 text-center col-self">
                            <ul class="sortable custom-ul list-unstyled" id="selfList">
                                <li class="alert alert-info nomargin" ng-repeat="self in deptFlowCtrl.selfs.employees">
                                    <img class="img-flow" ng-src="/avatars/avatar.jpg" />
                                    <p>{{self.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 col-evaluator">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="evaluatorList">
                                <li class="alert alert-info nomargin" ng-repeat="evaluator in deptFlowCtrl.evaluators.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(evaluator, deptFlowCtrl.evaluators.employees)"></a>
                                    <img uib-tooltip="{{evaluator.FullName}}" class="img-flow" ng-src="{{evaluator.Avatar}}" />
                                    <p>{{evaluator.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 col-reviewer">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="reviewerList">
                                <li class="alert alert-info nomargin" ng-repeat="reviewer in deptFlowCtrl.reviewers.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(reviewer, deptFlowCtrl.reviewers.employees)"></a>
                                    <img uib-tooltip="{{reviewer.FullName}}" class="img-flow" ng-src="{{reviewer.Avatar}}" />
                                    <p>{{reviewer.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 col-management" ng-show="!deptFlowCtrl.flowTemplate.IsMonthly">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="managementList">
                                <li class="alert alert-info nomargin" ng-repeat="management in deptFlowCtrl.managements.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(management, deptFlowCtrl.managements.employees)"></a>
                                    <img uib-tooltip="{{management.FullName}}" class="img-flow" ng-src="{{management.Avatar}}" />
                                    <p>{{management.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
            <form class="row form-inline department-form" role="form">
                <button class="btn btn-primary" ng-click="deptFlowCtrl.saveDepartmentFlow()"
                        ng-show="updateCtrl.permission == updateCtrl.policyEnum.Host" data-translate="Save"></button>
                <button class="btn btn-delete" ng-click="deptFlowCtrl.deleteDepartmentFlow()" data-translate="Delete"
                        ng-show="deptFlowCtrl.showDeleteButton && updateCtrl.permission == updateCtrl.policyEnum.Host"></button>
            </form>
        </div>
    </div>
</div>
