<div class="department-flow" ng-controller="DepartmentFlowController as deptFlowCtrl">
    <div class="expand-user" title="Show Employee List" ng-if="!deptFlowCtrl.showListEmployee" 
        ng-click="deptFlowCtrl.toggleDepartmentDraggableList()">
        <span class="glyphicon glyphicon-user icon-user"></span>
    </div>
    <div class="row">
        <div class="col-sm-3 employee-list" id="employeeList" ng-if="deptFlowCtrl.showListEmployee">
            <div class="row flow-header">
                <span data-translate="Employee"></span>
                <a ng-click="deptFlowCtrl.toggleDepartmentDraggableList()" href="javascript:;"
                    class="pull-right glyphicon glyphicon-arrow-left"></a>
            </div>
            <div class="row">
                <input type="text" ng-model="deptFlowCtrl.employeeName" class="txt-search" />
            </div>
            <ul class="row custom-ul employee-ul list-unstyled">
                <li class="ui-state-highlight" list-draggable=".sortable" 
                    ng-repeat="employee in flowMngCtrl.employees"
                    id="{{employee.EmployeeId}}">
                    {{employee.NickName}} ({{employee.FullName}})</li>
            </ul>
        </div>
        <div class="col-sm-9">
            <form class="row form-inline department-form">
                <label data-translate="Department"></label>
                <select class="sel-department" required ng-model="deptFlowCtrl.EPAFlow.departmentId"
                    ng-options="opt.DepartmentId as opt.Name for opt in flowMngCtrl.departments"
                    ng-change="deptFlowCtrl.onSelectedDepartment()">
                    <option style="display: none" value="">-- Select a Department / Group --</option>
                </select>
            </form>
            <div class="row">
                <!--<div class="col-sm-2 col">
                    <div class="flow-group self">
                        <div class="flow-header" >
                            <span data-translate="SelfEvaluator"></span>
                        </div>
                        <ul list-sortable class="sortable custom-ul list-unstyled" id="adminList">
                        </ul>
                    </div>
                </div>-->
            </div>
        </div>
    </div>
</div>
