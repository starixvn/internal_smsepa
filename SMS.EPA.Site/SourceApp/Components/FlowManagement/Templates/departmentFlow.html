<div class="department-flow" ng-controller="DepartmentFlowController as deptFlowCtrl">
    <div class="expand-user" title="Show Employee List" ng-if="!deptFlowCtrl.showListEmployee"
         ng-click="deptFlowCtrl.toggleDepartmentDraggableList()">
        <span class="glyphicon glyphicon-user icon-user"></span>
    </div>
    <div class="row">
        <div class="col-sm-3 employee-list" id="employeeList" ng-if="deptFlowCtrl.showListEmployee">
            <div class="row flow-header">
                <span data-translate="Employee"></span>
                <a ng-click="deptFlowCtrl.toggleDepartmentDraggableList()" href="javascript:;"
                   class="pull-right glyphicon glyphicon-arrow-left"></a>
            </div>
            <div class="row">
                <select class="department-select" ng-model="deptFlowCtrl.departmentId"
                        ng-options="opt.DepartmentId as opt.Name for opt in updateCtrl.departments"
                        ng-change="deptFlowCtrl.getEmployee()">
                    <option style="display: none" value="">-- Select a Department / Group --</option>
                </select>
            </div>
            <div class="row">
                <input type="text" ng-model="deptFlowCtrl.employeeName" class="txt-search" />
            </div>
            <ul class="row custom-ul employee-ul list-unstyled">
                <li class="ui-state-highlight" list-draggable=".sortable"
                    ng-repeat="employee in deptFlowCtrl.employees | filter: deptFlowCtrl.employeeName"
                    id="{{employee.EmployeeId}}">
                    {{employee.NickName}} ({{employee.FullName}})
                </li>
            </ul>
        </div>
        <div class="col-sm-9 set-flow">
            <form class="row form-inline department-form">
                <label data-translate="ApplyToDepartment"></label>
                <select class="sel-department" required ng-model="deptFlowCtrl.department"
                        ng-options="opt as opt.Name for opt in updateCtrl.treeDepartment"
                        ng-change="deptFlowCtrl.getDepartmentFlow()">
                    <option style="display: none" value="">-- Select a Department / Group --</option>
                </select>
            </form>
            <table class="row table table-bordered table-striped">
                <thead>
                    <tr class="headerName">
                        <th></th>
                        <th class="col-sm-2 text-center" data-translate="HumanResource"></th>
                        <th class="col-sm-2 text-center" data-translate="SelfEvaluator"></th>
                        <th class="col-sm-2 text-center" data-translate="Evaluator"></th>
                        <th class="col-sm-2 text-center" data-translate="Reviewer"></th>
                        <th class="col-sm-2 text-center" data-translate="Management"></th>
                    </tr>
                </thead>
                <tbody class="table-body">
                    <tr>
                        <td class="col-sm-2" data-translate="Duration"></td>
                        <td class="col-sm-2 text-center col-human-resource">
                            <input class="text-center duration" type="text" ng-model="deptFlowCtrl.humanResources.duration" number-only="number" />
                        </td>
                        <td class="col-sm-2 text-center col-self">
                            <input class="text-center duration" type="text" ng-model="deptFlowCtrl.selfs.duration" number-only="number" />
                        </td>
                        <td class="col-sm-2 text-center col-evaluator">
                            <input class="text-center duration" type="text" ng-model="deptFlowCtrl.evaluators.duration" number-only="number" />
                        </td>
                        <td class="col-sm-2 text-center col-reviewer">
                            <input class="text-center duration" type="text" ng-model="deptFlowCtrl.reviewers.duration" number-only="number" />
                        </td>
                        <td class="col-sm-2 text-center col-management">
                            <input class="text-center duration" type="text" ng-model="deptFlowCtrl.managements.duration" number-only="number" />
                        </td>
                    </tr>
                    <tr>
                        <td class="col-sm-2" data-translate="Email"></td>
                        <td class="col-sm-2 text-center col-human-resource">
                            <input type="checkbox" ng-model="deptFlowCtrl.humanResources.hasSendMail" ng-checked="deptFlowCtrl.humanResources.hasSendMail" />
                        </td>
                        <td class="col-sm-2 text-center col-self">
                            <input type="checkbox" ng-model="deptFlowCtrl.selfs.hasSendMail" ng-checked="deptFlowCtrl.selfs.hasSendMail" />
                        </td>
                        <td class="col-sm-2 text-center col-evaluator">
                            <input type="checkbox" ng-model="deptFlowCtrl.evaluators.hasSendMail" ng-checked="deptFlowCtrl.evaluators.hasSendMail" />
                        </td>
                        <td class="col-sm-2 text-center col-reviewer">
                            <input type="checkbox" ng-model="deptFlowCtrl.reviewers.hasSendMail" ng-checked="deptFlowCtrl.reviewers.hasSendMail" />
                        </td>
                        <td class="col-sm-2 text-center col-management">
                            <input type="checkbox" ng-model="deptFlowCtrl.managements.hasSendMail" ng-checked="deptFlowCtrl.managements.hasSendMail" />
                        </td>
                    </tr>
                    <tr>
                        <td class="col-sm-2"></td>
                        <td class="col-sm-2 col-human-resource">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="humanResourceList">
                                <li class="alert alert-info nomargin" ng-repeat="humanResource in deptFlowCtrl.humanResources.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(humanResource, deptFlowCtrl.humanResources.employees)"></a>
                                    <img tooltip="{{humanResource.FullName}}" class="img-flow"
                                         src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                    <p>{{humanResource.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 text-center col-self">
                            <ul class="sortable custom-ul list-unstyled" id="selfList">
                                <li class="alert alert-info nomargin" ng-repeat="self in deptFlowCtrl.selfs.employees">
                                    <img tooltip="{{self.FullName}}" class="img-flow"
                                         src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                    <p>{{self.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 col-evaluator">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="evaluatorList">
                                <li class="alert alert-info nomargin" ng-repeat="evaluator in deptFlowCtrl.evaluators.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(evaluator, deptFlowCtrl.evaluators.employees)"></a>
                                    <img tooltip="{{evaluator.FullName}}" class="img-flow"
                                         src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                    <p>{{evaluator.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 col-reviewer">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="reviewerList">
                                <li class="alert alert-info nomargin" ng-repeat="reviewer in deptFlowCtrl.reviewers.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(reviewer, deptFlowCtrl.reviewers.employees)"></a>
                                    <img tooltip="{{reviewer.FullName}}" class="img-flow"
                                         src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                    <p>{{reviewer.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                        <td class="col-sm-2 col-management">
                            <ul list-sortable class="sortable custom-ul list-unstyled" id="managementList">
                                <li class="alert alert-info nomargin" ng-repeat="management in deptFlowCtrl.managements.employees">
                                    <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                       ng-click="deptFlowCtrl.removeItemFromList(management, deptFlowCtrl.managements.employees)"></a>
                                    <img tooltip="{{management.FullName}}" class="img-flow"
                                         src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                    <p>{{management.NickName}}</p>
                                </li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
            <form class="row form-inline department-form" role="form">
                <button class="button" ng-click="deptFlowCtrl.saveDepartmentFlow()" data-translate="Save"></button>
                <button class="button" ng-click="deptFlowCtrl.deleteDepartmentFlow()" data-translate="Delete" ng-if="deptFlowCtrl.showDeleteButton"></button>
            </form>
        </div>
    </div>
</div>
