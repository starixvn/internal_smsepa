<div class="col-sm-12" ng-controller="UpdateFlowTemplateController as updateCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb float-left">
            <li class="current" data-translate="EditFlowTemplate"></li>
        </ul>
        <button ng-click="updateCtrl.backToList()" class="btn btn-cancel">
            <span class="glyphicon glyphicon-menu-left"></span> <span data-translate="BackToList"></span>
        </button>
    </div>
    <div class="target-tabset">
        <uib-tabset id="FlowTemplateTab" active="updateCtrl.dataTab">
            <uib-tab heading="GENERAL INFORMATION" class="tab-cursor" index="1" select="updateCtrl.dataTab = 1">
                <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/generalInformation.html'"></div>
            </uib-tab>
            <uib-tab heading="DEPARTMENT / SECTION" class="tab-cursor" index="2" select="updateCtrl.dataTab = 2">
                <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/departmentFlow.html'"></div>
            </uib-tab>
            <uib-tab heading="PERSONAL" class="tab-cursor" index="3" select="updateCtrl.dataTab = 3">
                <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/personalFlow.html'"></div>
            </uib-tab>
            <uib-tab heading="RESULT SETTING" class="tab-cursor" index="4" select="updateCtrl.dataTab = 4">
                <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/resultSetting.html'"></div>
            </uib-tab>
        </uib-tabset>
    </div>
</div>
