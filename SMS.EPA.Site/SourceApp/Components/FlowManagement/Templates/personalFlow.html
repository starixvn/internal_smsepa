<div class="personal-flow" ng-controller="PersonalFlowController as personalFlowCtrl">
    <div class="row">
        <div class="row boxtitle" data-translate="PersonalFlow">
        </div>
        <div class="row">
            <form class="row form-inline department-form">
                <select class="sel-department departmentList" required ng-model="personalFlowCtrl.department"
                        ng-options="opt as opt.Name for opt in flowMngCtrl.treeDepartment"
                        ng-change="personalFlowCtrl.onSelectedDepartment()">
                    <option style="display: none" value="">-- Select a Department / Group --</option>
                </select>
            </form>
            <div class="row">
                <div class="col-sm-3 personal">
                    <select class="flow-personal" ng-model="personalFlowCtrl.fromModel" multiple
                            ng-options="e.EmployeeId as e.NickName + ' (' + e.FullName + ')' for e in personalFlowCtrl.defaultSettingFlowEmployees"></select>
                </div>
                <div class="col-sm-1 buttons">
                    <a title="Move Right" class="button glyphicon glyphicon-arrow-right"
                       ng-click="personalFlowCtrl.moveItem(personalFlowCtrl.fromModel, personalFlowCtrl.defaultSettingFlowEmployees, personalFlowCtrl.personalSettingFlowEmployees)">
                    </a>
                    <a title="Move Left" class="button glyphicon glyphicon-arrow-left"
                       ng-click="personalFlowCtrl.moveItem(personalFlowCtrl.toModel, personalFlowCtrl.personalSettingFlowEmployees, personalFlowCtrl.defaultSettingFlowEmployees)">
                    </a>
                    <a title="Move Right All" class="button glyphicon glyphicon-fast-forward"
                       ng-click="personalFlowCtrl.moveAll(personalFlowCtrl.defaultSettingFlowEmployees, personalFlowCtrl.personalSettingFlowEmployees)">
                    </a>
                    <a title="Move Left All" class="button glyphicon glyphicon-fast-backward"
                       ng-click="personalFlowCtrl.moveAll(personalFlowCtrl.personalSettingFlowEmployees, personalFlowCtrl.defaultSettingFlowEmployees)">
                    </a>
                </div>
                <div class="col-sm-3 personal">
                    <select class="flow-personal" ng-model="personalFlowCtrl.toModel" multiple
                            ng-change="personalFlowCtrl.getPersonalFlow(personalFlowCtrl.toModel)"
                            ng-options="e.EmployeeId as e.NickName +' (' + e.FullName + ')'  for e in personalFlowCtrl.personalSettingFlowEmployees"></select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="row boxtitle" data-translate="EPAProcessing">
            </div>
            <div class="row">
                <div class="expand-user" title="Show Employee List" ng-if="!personalFlowCtrl.showListEmployee"
                     ng-click="personalFlowCtrl.toggleDepartmentDraggableList()">
                    <span class="glyphicon glyphicon-user icon-user"></span>
                </div>
                <div class="row">
                    <div class="col-sm-3 employee-list" id="employeeList" ng-if="personalFlowCtrl.showListEmployee">
                        <div class="row flow-header">
                            <span data-translate="Employee"></span>
                            <a ng-click="personalFlowCtrl.toggleDepartmentDraggableList()" href="javascript:;"
                               class="pull-right glyphicon glyphicon-arrow-left"></a>
                        </div>
                        <div class="row">
                            <input type="text" ng-model="personalFlowCtrl.employeeName" class="txt-search" />
                        </div>
                        <ul class="row custom-ul employee-ul list-unstyled">
                            <li class="ui-state-highlight" list-draggable=".sortable"
                                ng-repeat="employee in flowMngCtrl.employees | filter: personalFlowCtrl.employeeName"
                                id="{{employee.EmployeeId}}">
                                {{employee.NickName}} ({{employee.FullName}})
                            </li>
                        </ul>
                    </div>
                    <div class="col-sm-9 set-flow">
                        <table class="row table table-bordered table-striped">
                            <thead>
                                <tr class="headerName">
                                    <th></th>
                                    <th class="col-sm-2 text-center" data-translate="SelfEvaluator"></th>
                                    <th class="col-sm-2 text-center" data-translate="Evaluator"></th>
                                    <th class="col-sm-2 text-center" data-translate="Reviewer"></th>
                                    <th class="col-sm-2 text-center" data-translate="Management"></th>
                                    <th class="col-sm-2 text-center" data-translate="HumanResource"></th>
                                </tr>
                            </thead>
                            <tbody class="table-body">
                                <tr>
                                    <td class="col-sm-2" data-translate="StartDate"></td>
                                    <td class="col-sm-2 col-self">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.selfs.startDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupStartDate($event, deptFlowCtrl.calendar.selfs)"
                                               is-open="personalFlowCtrl.calendar.selfs.startDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.selfs)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-evaluator">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.evaluators.startDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupStartDate($event, deptFlowCtrl.calendar.evaluators)"
                                               is-open="personalFlowCtrl.calendar.evaluators.startDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.evaluators)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-reviewer">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.reviewers.startDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.reviewers)"
                                               is-open="personalFlowCtrl.calendar.reviewers.startDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.reviewers)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-management">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.managements.startDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.managements)"
                                               is-open="personalFlowCtrl.calendar.managements.startDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.managements)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-human-resource">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.humanResources.startDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.humanResources)"
                                               is-open="personalFlowCtrl.calendar.humanResources.startDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupStartDate($event, personalFlowCtrl.calendar.humanResources)"></calendar-image>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="col-sm-2" data-translate="EndDate"></td>
                                    <td class="col-sm-2 col-self">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.selfs.endDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.selfs)"
                                               is-open="personalFlowCtrl.calendar.selfs.endDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.selfs)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-evaluator">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.evaluators.endDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.evaluators)"
                                               is-open="personalFlowCtrl.calendar.evaluators.endDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.evaluators)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-reviewer">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.reviewers.endDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.reviewers)"
                                               is-open="personalFlowCtrl.calendar.reviewers.endDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.reviewers)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-management">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.managements.endDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.managements)"
                                               is-open="personalFlowCtrl.calendar.managements.endDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.managements)"></calendar-image>
                                    </td>
                                    <td class="col-sm-2 col-human-resource">
                                        <input readonly class="calendar-form-control" type="text"
                                               ng-model="personalFlowCtrl.humanResources.endDate" datepicker-popup="{{flowMngCtrl.dateFormat}}"
                                               ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.humanResources)"
                                               is-open="personalFlowCtrl.calendar.humanResources.endDateOpened" />
                                        <calendar-image class="calendar-image" ng-click="personalFlowCtrl.openPopupEndDate($event, personalFlowCtrl.calendar.humanResources)"></calendar-image>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="col-sm-2" data-translate="Email"></td>
                                    <td class="col-sm-2 text-center col-self">
                                        <input type="checkbox" ng-model="personalFlowCtrl.selfs.hasSendMail" ng-checked="personalFlowCtrl.selfs.hasSendMail" />
                                    </td>
                                    <td class="col-sm-2 text-center col-evaluator">
                                        <input type="checkbox" ng-model="personalFlowCtrl.evaluators.hasSendMail" ng-checked="personalFlowCtrl.evaluators.hasSendMail" />
                                    </td>
                                    <td class="col-sm-2 text-center col-reviewer">
                                        <input type="checkbox" ng-model="personalFlowCtrl.reviewers.hasSendMail" ng-checked="personalFlowCtrl.reviewers.hasSendMail" />
                                    </td>
                                    <td class="col-sm-2 text-center col-management">
                                        <input type="checkbox" ng-model="personalFlowCtrl.managements.hasSendMail" ng-checked="personalFlowCtrl.managements.hasSendMail" />
                                    </td>
                                    <td class="col-sm-2 text-center col-human-resource">
                                        <input type="checkbox" ng-model="personalFlowCtrl.humanResources.hasSendMail" ng-checked="personalFlowCtrl.humanResources.hasSendMail" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="col-sm-2"></td>
                                    <td class="col-sm-2 text-center col-self">
                                        <ul class="sortable custom-ul list-unstyled" id="selfList">
                                            <li class="alert alert-info nomargin" ng-repeat="self in personalFlowCtrl.selfs.employees">
                                                <img tooltip="{{self.FullName}}" class="img-flow"
                                                     src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                                <p>{{self.NickName}}</p>
                                            </li>
                                        </ul>
                                    </td>
                                    <td class="col-sm-2 col-evaluator">
                                        <ul list-sortable class="sortable custom-ul list-unstyled" id="evaluatorList">
                                            <li class="alert alert-info nomargin" ng-repeat="evaluator in personalFlowCtrl.evaluators.employees">
                                                <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                                   ng-click="personalFlowCtrl.removeItemFromList(evaluator, personalFlowCtrl.evaluators.employees)"></a>
                                                <img tooltip="{{evaluator.FullName}}" class="img-flow"
                                                     src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                                <p>{{evaluator.NickName}}</p>
                                            </li>
                                        </ul>
                                    </td>
                                    <td class="col-sm-2 col-reviewer">
                                        <ul list-sortable class="sortable custom-ul list-unstyled" id="reviewerList">
                                            <li class="alert alert-info nomargin" ng-repeat="reviewer in personalFlowCtrl.reviewers.employees">
                                                <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                                   ng-click="personalFlowCtrl.removeItemFromList(reviewer, personalFlowCtrl.reviewers.employees)"></a>
                                                <img tooltip="{{reviewer.FullName}}" class="img-flow"
                                                     src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                                <p>{{reviewer.NickName}}</p>
                                            </li>
                                        </ul>
                                    </td>
                                    <td class="col-sm-2 col-management">
                                        <ul list-sortable class="sortable custom-ul list-unstyled" id="managementList">
                                            <li class="alert alert-info nomargin" ng-repeat="management in personalFlowCtrl.managements.employees">
                                                <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                                   ng-click="personalFlowCtrl.removeItemFromList(management, personalFlowCtrl.managements.employees)"></a>
                                                <img tooltip="{{management.FullName}}" class="img-flow"
                                                     src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                                <p>{{management.NickName}}</p>
                                            </li>
                                        </ul>
                                    </td>
                                    <td class="col-sm-2 col-human-resource">
                                        <ul list-sortable class="sortable custom-ul list-unstyled" id="humanResourceList">
                                            <li class="alert alert-info nomargin" ng-repeat="humanResource in personalFlowCtrl.humanResources.employees">
                                                <a href="javascript:;" class="glyphicon glyphicon-remove icon-close"
                                                   ng-click="personalFlowCtrl.removeItemFromList(humanResource, personalFlowCtrl.humanResources.employees)"></a>
                                                <img tooltip="{{humanResource.FullName}}" class="img-flow"
                                                     src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y" />
                                                <p>{{humanResource.NickName}}</p>
                                            </li>
                                        </ul>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <form class="row form-inline department-form" role="form">
                            <button class="button" ng-click="personalFlowCtrl.savePersonalFlow()" data-translate="Save"></button>
                            <button class="button" ng-click="personalFlowCtrl.deletePersonalFlow()" data-translate="Delete" ng-if="personalFlowCtrl.showDeleteButton"></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
