<div class="flow-management" ng-controller="FlowTemplateController as flowTemplateCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="FlowTemplateManagement"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-inline" role="form">
            <div class="form-group">
                <label data-translate="TargetType"></label>
                <select class="form-control lstBox-limit" ng-model="flowTemplateCtrl.filter.targetTypeId"
                        ng-options="opt.TargetTypeId as opt.Name for opt in flowTemplateCtrl.targetTypes">
                    <option value="">-- {{"All" | translate}} --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="control-label" data-translate="Status"></label>
                <select class="form-control" ng-model="flowTemplateCtrl.filter.isActive">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option selected value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
                <button class="btn btn-primary" ng-click="flowTemplateCtrl.query(flowTemplateCtrl.filter)" data-translate="Submit"></button>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table">
                    <th colspan="6">
                        <a class="pull-left button-icon create-button" ng-show="flowTemplateCtrl.permission == flowTemplateCtrl.policyEnum.Host"
                           href="" ng-click="flowTemplateCtrl.createFlowTemplate()">
                            <span class="glyphicon glyphicon-plus icon-add"></span>
                            <span class="button-text" data-translate="CreateFlowTemplate"></span>
                        </a>
                        <input type="text" ng-model="flowTemplateCtrl.searchKey" ng-change="flowTemplateCtrl.search()"
                               class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th class="text-center" data-translate="SymbolCount"></th>
                    <th data-translate="Name"></th>
                    <th data-translate="TargetType"></th>
                    <th class="text-center col-active" data-translate="Active"></th>
                    <th class="text-center col-description" data-translate="Description"></th>
                    <th class="text-center col-action" data-translate="Action" ng-show="flowTemplateCtrl.permission == flowTemplateCtrl.policyEnum.Host"></th>
                </tr>
            </thead>
            <tbody class="table-body">
                <tr dir-paginate="flowTemplate in flowTemplateCtrl.filteredItems | itemsPerPage: flowTemplateCtrl.pageSize" current-page="flowTemplateCtrl.currentPage">
                    <td class="text-center" ng-bind="flowTemplateCtrl.getIndex($index, flowTemplateCtrl.currentPage, flowTemplateCtrl.pageSize)"></td>
                    <td ng-bind="flowTemplate.Name"></td>
                    <td ng-bind="flowTemplate.TargetType.Name"></td>
                    <td class="text-center col-active">
                        <input type="checkbox" ng-checked="flowTemplate.IsActive" ng-disabled="flowTemplateCtrl.permission != flowTemplateCtrl.policyEnum.Host"
                               ng-click="flowTemplateCtrl.updateStatusFlowTemplate(flowTemplate)" />
                    </td>
                    <td class="col-description">
                        {{flowTemplate.Description | limitTo: flowTemplate.numLimit > 0 ? flowTemplate.numLimit: flowTemplateCtrl.maxLengthDescription}}
                        <a ng-show="!flowTemplate.showReadMore && (flowTemplate.Description.length >= flowTemplateCtrl.maxLengthDescription)"
                           href="javascript:;" ng-click="flowTemplateCtrl.readMore(flowTemplate)" data-translate="ReadMore"></a>
                        <a ng-show="kpiGroup.showReadMore && (flowTemplate.Description.length >= flowTemplateCtrl.maxLengthDescription)"
                           href="javascript:;" ng-click="flowTemplateCtrl.readLess(flowTemplate)" data-translate="ReadLess"></a>
                    </td>
                    <td class="text-center col-action" ng-show="flowTemplateCtrl.permission === flowTemplateCtrl.policyEnum.Host">
                        <a class="glyphicon glyphicon-edit icon-edit" href=""
                           ng-click="flowTemplateCtrl.updateFlowTemplate(flowTemplate)" ng-attr-title='{{"Edit" | translate}}'></a>
                        <a class="glyphicon glyphicon-remove icon-remove" href=""
                           ng-click="flowTemplateCtrl.deleteFlowTemplate(flowTemplate)" ng-attr-title='{{"Delete" | translate}}'></a>
                    </td>
                </tr>
                <tr ng-show="flowTemplateCtrl.filteredItems.length == 0">
                    <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="6" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="flowTemplateCtrl.pageSize"
                                ng-options="entry for entry in flowTemplateCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <ul uib-pagination total-items="flowTemplateCtrl.filteredItems.length" items-per-page="flowTemplateCtrl.pageSize"
                                boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="flowTemplateCtrl.currentPage"
                                class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
