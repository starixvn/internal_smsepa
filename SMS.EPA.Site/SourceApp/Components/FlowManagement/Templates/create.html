<div ng-controller="CreateFlowTemplateController as createCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="CreateFlowTemplate"></li>
        </ul>
    </div>
    <div>
        <form class="col-sm-6 form-horizontal common-form" novalidate>
            <div class="form-group required">
                <label class="col-sm-3 control-label" data-translate="Name"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="createCtrl.flowTemplate.Name" required maxlength="200" />
                </div>
            </div>
            <div class="form-group top-buffer required">
                <label class="col-sm-3 control-label" data-translate="TargetType"></label>
                <div class="col-sm-9">
                    <select class="form-control" ng-model="createCtrl.flowTemplate.TargetTypeId"
                            ng-options="opt.TargetTypeId as opt.Name for opt in createCtrl.targetTypes">
                        <option style="display: none" value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="form-group top-buffer">
                <label class="col-sm-3 control-label" data-translate="Active"></label>
                <div class="col-sm-9 field active-div">
                    <input type="checkbox" ng-model="createCtrl.flowTemplate.IsActive" />
                </div>
            </div>
            <div class="form-group top-buffer">
                <label class="col-sm-3 control-label" data-translate="Description"></label>
                <div class="col-sm-9">
                    <textarea class="form-control custom-texarea" ng-model="createCtrl.flowTemplate.Description" maxlength="500"></textarea>
                </div>
            </div>
            <div class="form-group top-buffer">
                <div class="col-sm-offset-5">
                    <button class="button" ng-click="createCtrl.save(createCtrl.flowTemplate)" ng-show="createCtrl.permission == createCtrl.policyEnum.Host" data-translate="Submit"></button>
                    <button class="btn btn-default customize" ng-click="createCtrl.cancel()" data-translate="Cancel"></button>
                </div>
            </div>
        </form>
    </div>
</div>
