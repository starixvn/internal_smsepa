<input type="checkbox" class="host-only-read" ng-if="data.IsReadOnly" />

<div class="text-center" ng-if="data.IsReadOnly == false && !data.ParentFunctionId">
    <input id="funcHost{{data.FunctionId}}" name="funcHost" pid="{{data.ParentFunctionId}}"
           value="{{data.FunctionId}}" ng-model="data.IsHost" assign-permission type="checkbox" />
</div>

<input id="funcHost{{data.FunctionId}}" name="funcHost" pid="{{data.ParentFunctionId}}" ng-if="data.IsReadOnly == false && data.ParentFunctionId"
       value="{{data.FunctionId}}" ng-model="data.IsHost" assign-permission type="checkbox" />

<div class="child-check-box" ng-repeat="data in data.ChildFunctions"
     ng-include src="'/SourceApp/Components/Role/Templates/treeHostCheckbox.html'">
</div>
