<div>
    <div class="modal-header">
        <div class="popup-header">
            {{"ChangePassword" | translate}}<span class="close-popup" ng-click="changePasswordEmployeeCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal form-multiLine">
        <input ng-hide="true" type="password" />
        <div class="form-group required">
            <label class="col-sm-5 text-right control-label">
                {{"OldPassword" | translate}}</label>
            <div class="col-sm-6 field">
                <input type="password" class="form-control" maxlength="100" data-ng-model="changePasswordEmployeeCtrl.password.oldPassword" />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-5 text-right control-label">
                {{"NewPassword" | translate}}</label>
            <div class="col-sm-6 field">
                <input type="password" class="form-control" maxlength="100" data-ng-model="changePasswordEmployeeCtrl.password.newPassword" />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-5 text-right control-label">
                {{"ConfirmPassword" | translate}}</label>
            <div class="col-sm-6 field">
                <input type="password" class="form-control" maxlength="100" data-ng-model="changePasswordEmployeeCtrl.password.confirmPassword" />
            </div>
        </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="button" data-translate="Submit" data-ng-click="changePasswordEmployeeCtrl.save(changePasswordEmployeeCtrl.password)"
            ng-disabled="disabledSubmitButton">
        </button>
        <button class="btn btn-default customize" data-ng-click="changePasswordEmployeeCtrl.cancel()" data-translate="Cancel">
        </button>
    </div>
</div>
