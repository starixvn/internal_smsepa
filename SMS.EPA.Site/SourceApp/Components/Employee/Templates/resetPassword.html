<div>
    <div class="modal-header">
        <div class="popup-header">
            {{"ResetPassword" | translate}}
            <span class="close-popup" ng-click="resetPasswordCtrl.cancel()"></span>
        </div>
    </div>

    <div class="modal-body">
        Are you sure you want to reset password of <b>{{resetPasswordCtrl.employee.NickName}}</b> to default password <b>{{resetPasswordCtrl.defaultPassword}}</b>?
    </div>

    <div class="modal-footer">
        <button class="button" ng-click='resetPasswordCtrl.save()' data-translate="OK"></button>
        <button class="btn btn-default customize" ng-click="resetPasswordCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
