<div class="modal-header">
    <div class="popup-header">
        {{"CreateUser" | translate}}
        <span class="close-popup" ng-click="createEmployeeCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="UserName">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createEmployeeCtrl.employee.Username" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="NickName">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createEmployeeCtrl.employee.NickName" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="FullName">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createEmployeeCtrl.employee.FullName" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Password">
            </label>
            <div class="col-sm-8 field">
                <input type="password" class="form-control" ng-model="createEmployeeCtrl.employee.Password" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Team">
            </label>
            <div class="col-sm-8 field">
                <multi-select-tree-view selected-items="createEmployeeCtrl.employee.GroupId"
                                        single-selection="true"
                                        options="createEmployeeCtrl.orgChart" on-select="createEmployeeCtrl.onSelectTeam"></multi-select-tree-view>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Email">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createEmployeeCtrl.employee.Email" required />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-3" data-translate="Category"></label>
            <div class="col-sm-8 field">
                <select class="form-control" ng-model="createEmployeeCtrl.employee.IsLocal">
                    <option value="true">{{"Local" | translate}}</option>
                    <option value="false">{{"Expat" | translate}}</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="JobTitle">
            </label>
            <div class="col-sm-8 field">
                <select ng-model="createEmployeeCtrl.employee.JobTitleId"
                        ng-options="jobTitle.JobTitleId as jobTitle.JobTitleName for jobTitle in createEmployeeCtrl.jobTitleOptions"
                        required class="form-control">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="JobLevel">
            </label>
            <div class="col-sm-8 field">
                <select ng-model="createEmployeeCtrl.employee.JobLevelId"
                        ng-options="jobLevel.JobLevelId as jobLevel.Name for jobLevel in createEmployeeCtrl.jobLevelOptions"
                        required class="form-control">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" data-translate="Submit" ng-click="createEmployeeCtrl.save()"></button>
    <button class="btn btn-cancel" ng-click="createEmployeeCtrl.cancel()" data-translate="Cancel"></button>
</div>
