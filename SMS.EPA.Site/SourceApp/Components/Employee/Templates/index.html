<div ng-controller="EmployeeController as employeeCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="UserManagement"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row form-horizontal filter">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Keyword"></label>
                <div class="col-sm-2">
                    <input class="form-control" type="text" ng-model="employeeCtrl.filter.query" placeholder="full name or nick name" />
                </div>
                <label class="col-sm-2 control-label" data-translate="DepartmentSection"></label>
                <div class="col-sm-2 field">
                    <select class="department-select form-control" ng-model="employeeCtrl.filter.departmentId"
                            ng-options="opt.DepartmentId as opt.Name for opt in employeeCtrl.treeDepartment">
                        <option value="">-- Select a Department / Section --</option>
                    </select>
                </div>
                <label class="col-sm-1 control-label" data-translate="Category"></label>
                <div class="col-sm-2">
                    <select class="form-control" ng-model="employeeCtrl.filter.isLocal">
                        <option value="">-- {{"All" | translate}} --</option>
                        <option value="false">{{"Expat" | translate}}</option>
                        <option value="true">{{"Local" | translate}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-4 col-sm-offset-1">
                    <label>
                        <input type="checkbox" ng-model="employeeCtrl.filter.isSpecialUser"> {{"IsSpecialUser" | translate}}
                    </label>
                    <label>
                        <input type="checkbox" ng-model="employeeCtrl.filter.isDisabledUser"> {{"IsDisabledUser" | translate}}
                    </label>
                    <label>
                        <input type="checkbox" ng-model="employeeCtrl.filter.hasMonthlyEPA"> {{"HasMonthlyEPA" | translate}}
                    </label>
                </div>
                <div class="col-sm-1">
                    <button class="btn btn-primary" ng-click="employeeCtrl.queryEmployee(employeeCtrl.filter)" data-translate="Submit"></button>
                </div>
            </div>
        </form>
        <table class="row table table-bordered table-striped" id="data">
            <thead>
                <tr class="header-table">
                    <th colspan="13">
                        <a class="pull-left button-icon create-button" ng-click="employeeCtrl.createEmployee()"
                           ng-if="employeeCtrl.permission == employeeCtrl.policyEnum.Host">
                            <span class="glyphicon glyphicon-plus icon-add"></span>
                            <span class="button-text" data-translate="CreateUser"></span>
                        </a>
                        <input class="btnExcel pull-right" export-employee-info-report
                               ng-click="employeeCtrl.exportReport(employeeCtrl.filter)"
                               type="button" title="Export to Excel">
                        <input type="text" ng-model="employeeCtrl.searchKey" ng-change="employeeCtrl.search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="Code"></th>
                    <th data-translate="UserName"></th>
                    <th data-translate="NickName"></th>
                    <th data-translate="FullName"></th>
                    <th data-translate="JobTitle"></th>
                    <th data-translate="Department"></th>
                    <th data-translate="Section"></th>
                    <th data-translate="ShortSpecialUser"></th>
                    <th data-translate="Roles"></th>
                    <th data-translate="MonthlyEPA"></th>
                    <th data-translate="Action" ng-if="employeeCtrl.permission === employeeCtrl.policyEnum.Host"></th>
                    <th class="col-reset-password" data-translate="ResetPassword" ng-if="employeeCtrl.permission === employeeCtrl.policyEnum.Host"></th>
                </tr>
            </thead>
            <tbody class="table-body">
                <tr dir-paginate="employee in employeeCtrl.filteredItems | itemsPerPage: employeeCtrl.pageSize" current-page="employeeCtrl.currentPage">
                    <td class="text-center" ng-bind="employeeCtrl.getIndex($index, employeeCtrl.currentPage, employeeCtrl.pageSize)"></td>
                    <td class="text-center" ng-bind="employee.Code"></td>
                    <td ng-bind="employee.Username"></td>
                    <td class="text-center" ng-bind="employee.NickName"></td>
                    <td ng-bind="employee.FullName"></td>
                    <td ng-bind="employee.JobTitle.JobTitleName"></td>
                    <td ng-bind="employee.Department.Name"></td>
                    <td class="text-center">
                        <span uib-tooltip="{{employee.Group.GroupName}}" ng-bind="employee.Group.GroupCode"></span>
                    </td>
                    <td class="text-center">
                        <div ng-if="employee.IsSpecialUser">
                            <a href="" ng-click="employeeCtrl.updateEmployee(employee)" data-translate="Yes"
                               ng-if="employeeCtrl.permission === employeeCtrl.policyEnum.Host"></a>
                            <span data-translate="Yes" ng-if="employeeCtrl.permission !== employeeCtrl.policyEnum.Host"></span>
                        </div>
                        <span data-translate="No" ng-if="!employee.IsSpecialUser"></span>
                    </td>
                    <td class="authority-employee-role">
                        <span ng-repeat="role in employee.Roles">
                            {{role.RoleCode}}<span ng-if="!$last">,</span>
                        </span>
                    </td>
                    <td class="text-center">
                        <input type="checkbox" ng-checked="employee.HasMonthlyEPA" ng-disabled="employeeCtrl.permission !== employeeCtrl.policyEnum.Host"
                               ng-click="employeeCtrl.updateHasMonthlyEPA(employee)" />
                    </td>
                    <td class="text-center authority-employee-action" ng-if="employeeCtrl.permission === employeeCtrl.policyEnum.Host">
                        <a class="glyphicon glyphicon-edit icon-edit" href="" title="Assign role to user" ng-click="employeeCtrl.assignRole(employee)" />
                    </td>
                    <td class="text-center col-reset-password" ng-if="employeeCtrl.permission == employeeCtrl.policyEnum.Host">
                        <a class="glyphicon glyphicon-refresh icon-refresh" href="" title="Reset Password"
                           ng-if="employee.IsSpecialUser" ng-click="employeeCtrl.resetPassword(employee)" />
                        <a class="glyphicon glyphicon-ban-circle icon-ban-circle disabled" href="" ng-if="!employee.IsSpecialUser"></a>
                    </td>
                </tr>
                <tr ng-show="employeeCtrl.filteredItems.length === 0">
                    <td class="empty-result" colspan="13" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="13" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="employeeCtrl.pageSize"
                                ng-options="entry for entry in employeeCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <ul uib-pagination total-items="employeeCtrl.filteredItems.length" items-per-page="employeeCtrl.pageSize"
                                boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="employeeCtrl.currentPage"
                                class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
