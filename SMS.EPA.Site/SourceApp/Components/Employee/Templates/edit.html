<div class="modal-header">
    <div class="popup-header">
        {{"EditUser" | translate}}
        <span class="close-popup" ng-click="employeeCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Code">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="employeeCtrl.employee.Code" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="NickName">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="employeeCtrl.employee.NickName" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="FullName">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="employeeCtrl.employee.FullName" required />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Username">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="employeeCtrl.employee.Username" required />
            </div>
        </div>
        <!--<div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Password">
            </label>
            <div class="col-sm-8 field">
                <input type="password" class="form-control" ng-model="employeeCtrl.employee.Password" required disabled/>
            </div>
        </div>-->
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Team">
            </label>
            <div class="col-sm-8 field">
                <select ng-model="employeeCtrl.employee.GroupId" ng-options="group.GroupId as group.GroupName for group in employeeCtrl.groupOptions"
                    required class="form-control">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="JobTitle">
            </label>
            <div class="col-sm-8 field">
                <select ng-model="employeeCtrl.employee.JobTitleId" ng-options="jobTitle.JobTitleId as jobTitle.JobTitleName for jobTitle in employeeCtrl.jobTitleOptions"
                    required class="form-control">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label side-dish-active-label" data-translate="Enabled">
            </label>
            <div class="col-sm-8 field employee-active-div">
                <input type="checkbox" ng-model="employeeCtrl.employee.Enabled" />
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="button" data-translate="Submit" ng-click="employeeCtrl.save(employeeCtrl.employee)"></button>
    <button class="btn btn-default customize" ng-click="employeeCtrl.cancel()" data-translate="Cancel"></button>
</div>
