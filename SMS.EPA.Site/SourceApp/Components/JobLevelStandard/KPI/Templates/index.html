<div class="col-sm-12 kpi-management" ng-controller="JobLevelStandardKPIController as kpiCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li class="current">Job Level Standard Manage KPI</li>
        </ul>
    </div>
    <form novalidate class="form-filter" role="form">
        <div class="form-group">
            <label class="label-form" data-translate="Status"></label>
            <select class="form-control select-form" ng-model="kpiCtrl.filter.isActive">
                <option value="">-- {{"All" | translate}} --</option>
                <option selected value="true" data-translate="Active"></option>
                <option value="false" data-translate="InActive"></option>
            </select>
        </div>
        <div class="form-group">
            <button class="btn btn-primary" ng-click="kpiCtrl.query(kpiCtrl.filter)" data-translate="Submit"></button>
        </div>
    </form>
    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="7">
                    <a class="pull-left button-icon create-button" ng-click="kpiCtrl.createKPI()" ng-if="kpiCtrl.permission === kpiCtrl.policyEnum.Host">
                        <span class="glyphicon glyphicon-plus icon-add"></span>
                        <span class="button-text" data-translate="CreateKPI"></span>
                    </a>
                    <input type="text" ng-model="kpiCtrl.searchKey" ng-change="kpiCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th class="text-center" data-translate="SymbolCount"></th>
                <th class="text-center" data-translate="KPI"></th>
                <th class="text-center col-active" data-translate="Active"></th>
                <th class="text-center col-action" data-translate="Action" ng-if="kpiCtrl.permission === kpiCtrl.policyEnum.Host"></th>
            </tr>
        </thead>
        <tbody class="table-body">
            <tr dir-paginate="kpi in kpiCtrl.filteredItems | itemsPerPage: kpiCtrl.pageSize" current-page="kpiCtrl.currentPage">
                <td class="text-center" ng-bind="kpiCtrl.getIndex($index, kpiCtrl.currentPage, kpiCtrl.pageSize)"></td>
                <td ng-bind="kpi.Name"></td>
                <td class="text-center col-active">
                    <input type="checkbox" ng-checked="kpi.IsActive"
                           ng-disabled="kpiCtrl.permission !== kpiCtrl.policyEnum.Host" ng-click="kpiCtrl.updateStatusKPI(kpi)" />
                </td>
                <td class="text-center col-action" ng-if="kpiCtrl.permission === kpiCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" href="" ng-click="kpiCtrl.updateKPI(kpi)" ng-attr-title='{{"Edit" | translate}}'></a>
                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-click="kpiCtrl.deleteKPI(kpi)" ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
            </tr>
            <tr ng-show="kpiCtrl.filteredItems.length === 0">
                <td class="empty-result" colspan="4" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="kpiCtrl.pageSize"
                            ng-options="entry for entry in kpiCtrl.entries" ng-change="kpiCtrl.currentPage = 1"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <ul uib-pagination total-items="kpiCtrl.filteredItems.length" items-per-page="kpiCtrl.pageSize"
                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="kpiCtrl.currentPage"
                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
