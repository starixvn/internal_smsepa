<div class="modal-header">
    <div class="popup-header">
        Add comment
        <span class="close-popup" ng-click="commentCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Comment"></label>
            <div class="col-sm-10 field">
                <textarea  type="text" class="form-control comment-assessment" maxlength="2000" ng-model="commentCtrl.comment"></textarea>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" data-translate="Submit" ng-click="commentCtrl.save(commentCtrl.period)"></button>
    <button class="btn btn-cancel" ng-click="commentCtrl.cancel()" data-translate="Cancel"></button>
</div>
