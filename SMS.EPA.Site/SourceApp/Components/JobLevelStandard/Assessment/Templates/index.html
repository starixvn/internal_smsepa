<div class="col-sm-12" ng-controller="AssessmentController as assessmentCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li data-translate="JobLevelStandard"></li>
            <li class="current">Assessment</li>
        </ul>
    </div>
    <form novalidate class="form-filter" ng-show="assessmentCtrl.periods.length > 0">
        <div class="form-group">
            <label class="label-form" data-translate="Period"></label>
            <select class="form-control select-form" ng-model="assessmentCtrl.filter.periodId"
                    ng-options="opt.PeriodId as opt.Name for opt in assessmentCtrl.periods">
            </select>
        </div>
        <div class="form-group">
            <label class="label-form" data-translate="Team"></label>
            <div class="select-form">
                <multi-select-tree-view selected-items="assessmentCtrl.filter.teamIds"
                                        is-selected-all="true"
                                        options="assessmentCtrl.orgChart" on-select="assessmentCtrl.onSelectTeam"></multi-select-tree-view>
            </div>
        </div>
        <div class="form-group">
            <button class="btn btn-primary" data-translate="Search"
                    ng-click="assessmentCtrl.query()" ng-disabled="assessmentCtrl.periods.length === 0"></button>
        </div>
    </form>
    <table class="row table table-bordered table-striped table-job-level-assessment">
        <thead>
            <tr class="header-table">
                <th colspan="{{10 + (assessmentCtrl.kpis.length > 0 ? assessmentCtrl.kpis.length * 2 + 6 : 0)}}">
                    <input type="text" class="search-inline-textbox search pull-right"
                           ng-model="assessmentCtrl.searchKey" ng-change="assessmentCtrl.search()" />
                </th>
            </tr>
            <tr class="headerName">
                <th rowspan="{{assessmentCtrl.kpis.length > 0 ? 3 : 2}}" data-translate="SymbolCount"></th>
                <th rowspan="{{assessmentCtrl.kpis.length > 0 ? 2 : 1}}" colspan="9">Employee Info</th>
                <th ng-if="assessmentCtrl.kpis.length > 0" colspan="{{assessmentCtrl.kpis.length * 2}}">
                    Job Level Standards (Assessment by Section Head/Direct Superior)
                </th>
                <th ng-if="assessmentCtrl.kpis.length > 0" colspan="3" rowspan="2">Review by Unit Head</th>
                <th ng-if="assessmentCtrl.kpis.length > 0" rowspan="3">Remark</th>
                <th ng-if="assessmentCtrl.kpis.length > 0" rowspan="3">Status</th>
                <th class="col-action" ng-if="assessmentCtrl.kpis.length > 0" rowspan="3">Action</th>
            </tr>
            <tr ng-if="assessmentCtrl.kpis.length > 0">
                <th ng-repeat="kpi in assessmentCtrl.kpis" ng-bind="kpi.Name" colspan="2"></th>
            </tr>
            <tr>
                <th data-translate="Code"></th>
                <th class="width-60" data-translate="FullName"></th>
                <th data-translate="Nickname"></th>
                <th>DOC</th>
                <th data-translate="Department"></th>
                <th data-translate="Section"></th>
                <th data-translate="Team"></th>
                <th>Current Job Level</th>
                <th>Requirement min score</th>
                <th ng-repeat-start="kpi in assessmentCtrl.kpis" class="col-level">Level</th>
                <th ng-repeat-end class="col-weight">Weight</th>
                <th ng-if="assessmentCtrl.kpis.length > 0">Total Weight</th>
                <th ng-if="assessmentCtrl.kpis.length > 0">System Propose</th>
                <th ng-if="assessmentCtrl.kpis.length > 0">New Job Level</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="assessment in assessmentCtrl.filteredItems">
                <td class="text-center" ng-bind="$index + 1"></td>
                <td class="text-center" ng-bind="assessment.Code"></td>
                <td ng-bind="assessment.FullName"></td>
                <td ng-bind="assessment.Nickname"></td>
                <td class="text-center" ng-bind="assessment.JoinedDate | date: assessmentCtrl.dateFormat"></td>
                <td ng-bind="assessment.Department"></td>
                <td ng-bind="assessment.Section"></td>
                <td ng-bind="assessment.Team"></td>
                <td class="text-center" ng-bind="assessment.CurrentJobLevel"></td>
                <td class="text-center" ng-bind="assessment.RequirementMinScore"></td>
                <td ng-repeat-start="kpi in assessmentCtrl.kpis" class="col-input col-level">
                    <input type="text" class="text-center form-control" ng-if="$first"
                           ng-disabled="!assessment.IsHost || assessment.CurrentProcessId !== assessmentCtrl.process.Evaluator || !assessment.IsEdit"
                           ng-repeat="akpi in assessment.KPIs | filter: {KPIId: kpi.KPIId}" ng-model="akpi.Level"
                           numeric decimals="0" min="0" max="5" autocomplete="off" />
                </td>
                <td ng-repeat-end class="col-input col-weight">
                    <input type="text" class="text-center form-control" ng-if="$first"
                           ng-disabled="!assessment.IsHost || assessment.CurrentProcessId !== assessmentCtrl.process.Evaluator || !assessment.IsEdit"
                           ng-repeat="akpi in assessment.KPIs | filter: {KPIId: kpi.KPIId}" ng-model="akpi.Weight"
                           numeric decimals="2" min="0" max="100" autocomplete="off" ng-change="assessmentCtrl.inputWeight(assessment)" />
                </td>
                <td class="text-center" ng-bind="assessment.TotalWeight"></td>
                <td class="text-center" ng-class="assessment.SystemPropose < 0 ? 'red' : ''" ng-bind="assessment.SystemPropose"></td>
                <td class="text-center" ng-bind="assessment.NewJobLevel"
                    ng-class="assessment.SystemPropose > 0 && assessment.CurrentJobLevelId != assessment.NewJobLevelId ? 'red' : ''"></td>
                <td ng-bind="assessment.Remark"></td>
                <td class="text-center">
                    <span ng-show="assessment.StatusId === assessmentCtrl.status.Pending">Pending</span>
                    <span ng-show="assessment.StatusId === assessmentCtrl.status.Verified">Verified</span>
                    <span ng-show="assessment.StatusId === assessmentCtrl.status.Approved">Approved</span>
                </td>
                <td class="text-center col-action">
                    <div class="btn-group">
                        <button class="btn btn-primary glyphicon glyphicon-edit" title="Edit" ng-click="assessmentCtrl.edit(assessment)"
                                ng-if="assessment.IsHost && assessment.CurrentProcessId === assessmentCtrl.process.Evaluator && (assessment.StatusId === null || assessment.StatusId === assessmentCtrl.status.Pending) && !assessment.IsEdit"
                                ng-disabled="assessmentCtrl.isEditing && assessmentCtrl.selectedAssessment && assessmentCtrl.selectedAssessment.EmployeeId !== assessment.EmployeeId">
                        </button>
                        <button class="btn btn-primary glyphicon glyphicon-ok" title="Save"
                                ng-click="assessmentCtrl.save(assessment)" ng-show="assessment.IsEdit"></button>
                        <button class="btn btn-cancel glyphicon glyphicon-remove" title="Cancel"
                                ng-click="assessmentCtrl.cancel(assessment)" ng-show="assessment.IsEdit"></button>
                        <button class="btn btn-primary" data-translate="Verify"
                                ng-click="assessmentCtrl.verify(assessment)"
                                ng-if="assessment.IsHost && assessment.CurrentProcessId === assessmentCtrl.process.Employee && assessment.StatusId === assessmentCtrl.status.Pending"></button>
                        <button class="btn btn-primary" data-translate="Approve"
                                ng-click="assessmentCtrl.approve(assessment)"
                                ng-if="assessment.IsHost && assessment.CurrentProcessId === assessmentCtrl.process.Management && assessment.StatusId === assessmentCtrl.status.Verified"></button>
                    </div>
                </td>
            </tr>
            <tr ng-show="assessmentCtrl.kpis.length === 0">
                <td class="empty-result" colspan="{{10 + (assessmentCtrl.kpis.length > 0 ? assessmentCtrl.kpis.length * 2 + 6 : 0)}}" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
    </table>
</div>
