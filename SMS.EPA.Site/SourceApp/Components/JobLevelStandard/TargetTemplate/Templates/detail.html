<div class="col-sm-12 detail-target-template job-level-standard-template" ng-controller="JLSTemplateDetailController as detailCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li data-translate="JobLevelStandard"></li>
            <li>
                <a href="javascript:;" ng-click="detailCtrl.back()" data-translate="Template"></a>
            </li>
            <li class="current" data-translate="Detail"></li>
        </ul>
    </div>
    <div class="panel panel-default">
        <div class="panel-heading" data-toggle="collapse" data-target=".targetTemplateInfo">
            <h4 class="panel-title text-uppercase">Template Information</h4>
        </div>
        <div class="panel-collapse collapse in targetTemplateInfo">
            <div class="panel-body information">
                <div class="row line">
                    <div class="col-sm-6">
                        <strong class="col-sm-4 lab" data-translate="Name"></strong>
                        <div class="col-sm-8 lab" ng-bind="detailCtrl.targetTemplate.Name"></div>
                    </div>
                </div>
                <div class="row line">
                    <div class="col-sm-6">
                        <strong class="col-sm-4 lab" data-translate="CreatedBy"></strong>
                        <div class="col-sm-8 lab">
                            {{detailCtrl.targetTemplate.CreatedFullName}} ({{detailCtrl.targetTemplate.CreatedNickName}})
                        </div>
                    </div>
                    <div class="col-sm-6" ng-show="detailCtrl.targetTemplate.ModifiedNickName !== null">
                        <strong class="col-sm-4 lab" data-translate="LastModifiedBy"></strong>
                        <div class="col-sm-8 lab">
                            {{detailCtrl.targetTemplate.ModifiedFullName}} ({{detailCtrl.targetTemplate.ModifiedNickName}})
                        </div>
                    </div>
                </div>
                <div class="row line">
                    <div class="col-sm-6">
                        <strong class="col-sm-4 lab" data-translate="CreatedDate"></strong>
                        <div class="col-sm-8 lab" ng-bind="detailCtrl.targetTemplate.CreatedDate | date: detailCtrl.dateFormat"></div>
                    </div>
                    <div class="col-sm-6" ng-show="detailCtrl.targetTemplate.ModifiedDate !== null">
                        <strong class="col-sm-4 lab" data-translate="LastModifiedDate"></strong>
                        <div class="col-sm-8 lab" ng-bind="detailCtrl.targetTemplate.ModifiedDate | date: detailCtrl.dateFormat"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="panel panel-default">
        <div class="panel-heading" data-toggle="collapse" data-target=".kpiList">
            <h4 class="panel-title text-uppercase" data-translate="KPIList"></h4>
        </div>
        <div class="panel-collapse collapse in kpiList">
            <div class="panel-body kpi-content">
                <div class="col-sm-12 no-padding" ng-repeat="item in detailCtrl.kpis | filter: KPIName">
                    <ul class="col-sm-12 list-unstyled kpi-list">
                        <li>
                            <span class="glyphicon glyphicon-ok item-list-icon">
                            </span>{{item.Name}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
