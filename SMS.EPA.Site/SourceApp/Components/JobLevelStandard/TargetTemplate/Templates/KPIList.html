<div ng-controller="JLSKPIListController as kpiListCtrl">
    <form class="form-horizontal project-form" novalidate>
        <div class="line top-buffer">
            <div>
                <table class="table table-bordered table-striped table-hover" id="tblKPI">
                    <thead>
                        <tr>
                            <th>
                                <input type="checkbox" ng-model="kpiListCtrl.SelectedAll" ng-click="kpiListCtrl.checkAll(kpiListCtrl.SelectedAll)" />
                            </th>
                            <th></th>
                            <th data-translate="KPIName"></th>
                            <th data-translate="Weight"></th>
                            <th class="middle-align" data-translate="Priority"></th>
                        </tr>
                    </thead>
                    <tbody class="kpiItemBody" list-sortable>
                        <tr class="row-header unsortable">
                            <td class="text-center row-highlight"></td>
                            <td class="row-highlight"></td>
                            <td class="text-center row-highlight"></td>
                            <td class="text-center row-highlight">
                                <a href="javascript:;" ng-click="kpiListCtrl.scoreSpread(kpiListCtrl.kpiList)">Spread</a>
                            </td>
                            <td class="text-center row-highlight"></td>
                        </tr>
                        <tr class="row-data" ng-repeat="item in kpiListCtrl.kpiList | filter: Name">
                            <td class="text-center" item-id="{{item.KPIId}}">
                                <input class="check-group" type="checkbox" value="{{item.Name}}" ng-model="item.IsSelected" ng-click="kpiListCtrl.check(item)" />
                            </td>
                            <td class="text-center" ng-bind="$index + 1"></td>
                            <td ng-bind="item.Name"></td>
                            <td class="width-100 text-center">
                                <input type="text" class="weight-form-control text-center"
                                       ng-model="item.Weight" name="weight" epa-number-dot ng-show="item.IsSelected" />
                            </td>
                            <td class="text-center priority-limit">
                                <a href="javascript:;" title="Top" class="glyphicon glyphicon-open kpiTop" move-kpi-row> | </a>
                                <a href="javascript:;" title="Move Up" class="glyphicon glyphicon-arrow-up kpiUp" move-kpi-row> | </a>
                                <a href="javascript:;" title="Move Down" class="glyphicon glyphicon-arrow-down kpiDown" move-kpi-row> | </a>
                                <a href="javascript:;" title="Bottom" class="glyphicon glyphicon-save kpiBottom" move-kpi-row></a>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr ng-show="kpiListCtrl.kpiList.length == 0">
                            <td class="empty-result" colspan="5" data-translate="EmptyResult"></td>
                        </tr>
                    </tfoot>
                </table>
                <div class="col-sm-offset-5 top-buffer">
                    <button class="btn btn-primary" get-data data-translate="Submit" type="submit"></button>
                </div>
            </div>
        </div>
    </form>
</div>
