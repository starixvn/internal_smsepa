<div class="col-sm-12 job-level-standard-template" ng-controller="UpdateJLSTemplateController as updateCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb">
            <li data-translate="JobLevelStandard"></li>
            <li>
                <a href="javascript:;" ng-click="updateCtrl.backToList()" data-translate="Template"></a>
            </li>
            <li class="current" data-translate="Edit"></li>
        </ul>
    </div>
    <div class="target-tabset">
        <uib-tabset id="TargetTemplateTab" active="updateCtrl.dataTab">
            <uib-tab heading="GENERAL INFORMATION" class="tab-cursor" index="1" select="updateCtrl.dataTab = 1">
                <div ng-include src="'/SourceApp/Components/JobLevelStandard/TargetTemplate/Templates/generalInformation.html'"></div>
            </uib-tab>
            <uib-tab heading="KPI LIST" class="tab-cursor" index="2" select="updateCtrl.dataTab = 2">
                <div ng-include src="'/SourceApp/Components/JobLevelStandard/TargetTemplate/Templates/KPIList.html'"></div>
            </uib-tab>
        </uib-tabset>
    </div>
</div>
