<div ng-controller="SectionTemplateSettingController as sectionCtrl">
    <form novalidate class="form-filter">
        <div class="form-group">
            <label class="label-form" data-translate="DepartmentSection"></label>
            <select ng-model="sectionCtrl.filter.departmentId" ng-options="opt.DepartmentId as opt.Name disable when opt.Disable for opt in sectionCtrl.treeDepartment"
                    class="form-control select-form">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="label-form"></label>
            <div class="checkbox checkbox-form">
                <label>
                    <input type="checkbox" ng-model="sectionCtrl.filter.showAll"> Show all
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="label-form"></label>
            <button class="btn btn-primary" ng-click="sectionCtrl.query()" data-translate="Search"></button>
        </div>
    </form>

    <table class="row table table-bordered table-striped target-setting-template" id="data">
        <thead>
            <tr class="header-table">
                <th colspan="10">
                    <div class="pull-left div-target-templatesetting" ng-show="targetCtrl.permission == targetCtrl.policyEnum.Host">
                        <label class="control-label" data-translate="TargetTemplate"></label>
                        <select ng-model="sectionCtrl.templateSetting.templateId"
                                ng-options="opt.TemplateId as opt.Name for opt in sectionCtrl.templates"
                                class="target-template-setting-select lstBox-limit"></select>
                    </div>
                    <button class="btn btn-primary pull-left btn-assign" data-translate="Assign" ng-click="sectionCtrl.assignTargetTemplate()"
                            ng-show="targetCtrl.permission == targetCtrl.policyEnum.Host"></button>
                    <input class="btnExcel pull-right"
                           ng-click="sectionCtrl.exportReport()"
                           type="button" title="Export to Excel">
                    <input type="text" ng-model="sectionCtrl.searchKey" ng-change="sectionCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th>
                    <input type="checkbox" ng-click="sectionCtrl.checkAll(sectionCtrl.selectedAll)"
                           ng-model="sectionCtrl.selectedAll" />
                </th>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Unit"></th>
                <th data-translate="Department"></th>
                <th data-translate="Section"></th>
                <th data-translate="Template"></th>
                <th data-translate="Delete" ng-show="targetCtrl.permission === targetCtrl.policyEnum.Host"></th>
            </tr>
        </thead>
        <tbody class="table-body" current-page="sectionCtrl.currentPage" ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}"
               dir-paginate="employee in sectionCtrl.filteredItems | itemsPerPage: sectionCtrl.pageSize" pagination-id="personnel">
            <tr>
                <td class="text-center">
                    <input type="checkbox" ng-model="employee.Selected"
                           ng-click="sectionCtrl.syncSelected(employee.ObjectId, employee.Selected)" />
                </td>
                <td class="text-center" ng-bind="sectionCtrl.getIndex($index, sectionCtrl.currentPage, sectionCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="employee.UnitName"></td>
                <td ng-bind="employee.DepartmentName"></td>
                <td ng-bind="employee.SectionName"></td>
                <td ng-bind="employee.Template"></td>
                <td class="text-center" ng-show="targetCtrl.permission === targetCtrl.policyEnum.Host">
                    <a class="glyphicon glyphicon-remove icon-remove" href="" ng-show="sectionCtrl.showDeleteBtn(employee.Template)" ng-click="sectionCtrl.deleteTemplateSetting(employee)"
                       ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
            </tr>
        </tbody>
        <tbody ng-show="sectionCtrl.filteredItems.length === 0">
            <tr>
                <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="7" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="sectionCtrl.pageSize"
                            ng-options="entry for entry in sectionCtrl.entries" ng-change="sectionCtrl.currentPage = 1"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <ul uib-pagination total-items="sectionCtrl.filteredItems.length" items-per-page="sectionCtrl.pageSize"
                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="sectionCtrl.currentPage"
                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
