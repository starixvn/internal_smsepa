<div class="modal-header">
    <div class="popup-header">
        Add Employee Setting
        <span class="close-popup" ng-click="addEmployeeSettingCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Employee"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" maxlength="100"
                       ng-model="addEmployeeSettingCtrl.searchEmployee"
                       search-auto-complete search-employees="addEmployeeSettingCtrl.getEmployee()"
                       ng-change="addEmployeeSettingCtrl.unSelectEmployee()" employee="addEmployeeSettingCtrl.selectedEmployee"
                       placeholder="Nickname or full name" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Team"></label>
            <div class="col-sm-8 field">
                <multi-select-tree-view selected-items="addEmployeeSettingCtrl.teamIds"
                                        is-selected-all="false"
                                        options="addEmployeeSettingCtrl.orgChart"></multi-select-tree-view>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" ng-click="addEmployeeSettingCtrl.save()" data-translate="Submit"></button>
    <button class="btn btn-cancel" ng-click="addEmployeeSettingCtrl.cancel()" data-translate="Cancel"></button>
</div>
