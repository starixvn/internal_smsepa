<div class="modal-header">
    <div class="popup-header">
        {{"Create" | translate}}
        <span class="close-popup" ng-click="createPeriodCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="row form-horizontal" role="form">
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Name"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" maxlength="200" ng-model="createPeriodCtrl.period.Name" required />
            </div>
        </div>
    </form>

    <table class="row table table-bordered table-striped">
        <thead>
            <tr>
                <th data-translate="SymbolCount"></th>
                <th>Evaluator / Reviewer</th>
                <th data-translate="Employee"></th>
                <th data-translate="Management"></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-translate="FromDate"></td>
                <td>
                    <p class="input-group calendar-input-group">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="createPeriodCtrl.period.Settings[0].FromDate" uib-datepicker-popup
                               ng-click="createPeriodCtrl.openFromDate($event, 1)" min-date="{{createPeriodCtrl.calendar.minDate}}"
                               is-open="createPeriodCtrl.calendar.fromDateEvaluatorOpened" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default" ng-click="createPeriodCtrl.openFromDate($event, 1)">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </td>
                <td>
                    <p class="input-group calendar-input-group">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="createPeriodCtrl.period.Settings[1].FromDate" uib-datepicker-popup
                               ng-click="createPeriodCtrl.openFromDate($event, 2)" min-date="{{createPeriodCtrl.calendar.minDate}}"
                               is-open="createPeriodCtrl.calendar.fromDateEmployeeOpened" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default" ng-click="createPeriodCtrl.openFromDate($event, 2)">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </td>
                <td>
                    <p class="input-group calendar-input-group">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="createPeriodCtrl.period.Settings[2].FromDate" uib-datepicker-popup
                               ng-click="createPeriodCtrl.openFromDate($event, 3)" min-date="{{createPeriodCtrl.calendar.minDate}}"
                               is-open="createPeriodCtrl.calendar.fromDateManagementOpened" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default" ng-click="createPeriodCtrl.openFromDate($event, 3)">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </td>
            </tr>
            <tr>
                <td data-translate="ToDate"></td>
                <td>
                    <p class="input-group calendar-input-group">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="createPeriodCtrl.period.Settings[0].ToDate" uib-datepicker-popup
                               ng-click="createPeriodCtrl.openToDate($event, 1)" min-date="{{createPeriodCtrl.calendar.minDate}}"
                               is-open="createPeriodCtrl.calendar.toDateEvaluatorOpened" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default" ng-click="createPeriodCtrl.openToDate($event, 1)">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </td>
                <td>
                    <p class="input-group calendar-input-group">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="createPeriodCtrl.period.Settings[1].ToDate" uib-datepicker-popup
                               ng-click="createPeriodCtrl.openToDate($event, 2)" min-date="{{createPeriodCtrl.calendar.minDate}}"
                               is-open="createPeriodCtrl.calendar.toDateEmployeeOpened" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default" ng-click="createPeriodCtrl.openToDate($event, 2)">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </td>
                <td>
                    <p class="input-group calendar-input-group">
                        <input readonly class="calendar-form-control" type="text"
                               ng-model="createPeriodCtrl.period.Settings[2].ToDate" uib-datepicker-popup
                               ng-click="createPeriodCtrl.openToDate($event, 3)" min-date="{{createPeriodCtrl.calendar.minDate}}"
                               is-open="createPeriodCtrl.calendar.toDateManagementOpened" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default" ng-click="createPeriodCtrl.openToDate($event, 3)">
                                <i class="glyphicon glyphicon-calendar"></i>
                            </button>
                        </span>
                    </p>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" data-translate="Submit" ng-click="createPeriodCtrl.save(createPeriodCtrl.period)"></button>
    <button class="btn btn-cancel" ng-click="createPeriodCtrl.cancel()" data-translate="Cancel"></button>
</div>
