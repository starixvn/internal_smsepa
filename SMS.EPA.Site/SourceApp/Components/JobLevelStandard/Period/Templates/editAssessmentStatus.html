<div class="modal-header">
    <div class="popup-header">
        Edit Assessment Status
        <span class="close-popup" ng-click="editAssessmentStatusCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Employee"></label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" disabled
                       ng-model="editAssessmentStatusCtrl.employee" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Status"></label>
            <div class="col-sm-8 field">
                <select class="form-control select-form" ng-model="editAssessmentStatusCtrl.statusId"
                        ng-options="opt.StatusId as opt.Name for opt in editAssessmentStatusCtrl.assessmentStatusOptions">
                </select>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" ng-click="editAssessmentStatusCtrl.save()" data-translate="Submit"></button>
    <button class="btn btn-cancel" ng-click="editAssessmentStatusCtrl.cancel()" data-translate="Cancel"></button>
</div>
