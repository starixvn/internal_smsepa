<div ng-controller="JobLevelStandardPeriodEmployeeSettingController as employeeSettingCtrl" class="period-employee-setting">
    <form class="form-filter">
        <div class="form-group">
            <label class="label-form" data-translate="Team"></label>
            <div class="select-form">
                <multi-select-tree-view selected-items="employeeSettingCtrl.filter.teamIds"
                                        is-selected-all="true"
                                        options="employeeSettingCtrl.orgChart" on-select="employeeSettingCtrl.onSelectTeam"></multi-select-tree-view>
            </div>
        </div>
        <div class="form-group">
            <label class="label-form" data-translate="Category"></label>
            <select class="form-control select-form" ng-model="employeeSettingCtrl.filter.isLocal">
                <option value="">-- {{"All" | translate}} --</option>
                <option value="false">{{"Expat" | translate}}</option>
                <option value="true">{{"Local" | translate}}</option>
            </select>
        </div>
        <div class="form-group">
            <label class="label-form" data-translate="Status"></label>
            <select class="form-control select-form" ng-model="employeeSettingCtrl.filter.statusId"
                    ng-options="opt.StatusId as opt.Name for opt in employeeSettingCtrl.assessmentStatusOptions">
                <option value="">-- {{"All" | translate}} --</option>
            </select>
        </div>
        <div class="form-group">
            <label class="label-form"></label>
            <div class="checkbox checkbox-form">
                <label>
                    <input type="checkbox" ng-model="employeeSettingCtrl.filter.isExcluded" /> Show Excluded
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="label-form"></label>
            <div class="btn-group">
                <button class="btn btn-primary" ng-click="employeeSettingCtrl.query()" data-translate="Search"></button>
                <button class="btn btn-primary" ng-click="employeeSettingCtrl.addEmployee()"
                        ng-if="employeeSettingCtrl.permission === employeeSettingCtrl.policy.Host">
                    Add Employee
                </button>
            </div>
        </div>
    </form>
    <table class="row table table-bordered table-striped" id="data">
        <thead>
            <tr class="header-table">
                <th colspan="12">
                    <input type="text" ng-model="employeeSettingCtrl.searchKey" ng-change="employeeSettingCtrl.search()"
                           class="search-inline-textbox search pull-right" />
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="Department"></th>
                <th data-translate="Section"></th>
                <th data-translate="Team"></th>
                <th class="width-140" data-translate="Employee"></th>
                <th class="width-60" data-translate="Step"></th>
                <th class="width-140" data-translate="Name"></th>
                <th class="width-60" data-translate="FromDate"></th>
                <th class="width-60" data-translate="ToDate"></th>
                <th class="width-40">Status</th>
                <th class="width-40" data-translate="Include"></th>
                <th data-translate="Action" ng-if="employeeSettingCtrl.permission === employeeSettingCtrl.policy.Host"></th>
            </tr>
        </thead>
        <tbody class="table-body" dir-paginate="employee in employeeSettingCtrl.filteredItems | itemsPerPage: employeeSettingCtrl.pageSize"
               current-page="employeeSettingCtrl.currentPage">
            <tr ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}">
                <td class="text-center" rowspan="3"
                    ng-bind="employeeSettingCtrl.getIndex($index, employeeSettingCtrl.currentPage, employeeSettingCtrl.pageSize)"></td>
                <td rowspan="3" ng-bind="employee.Department"></td>
                <td rowspan="3" ng-bind="employee.Section"></td>
                <td rowspan="3" ng-bind="employee.Team"></td>
                <td rowspan="3">{{employee.FullName}} ({{employee.Nickname}})</td>
                <td>Evaluator/Reviewer</td>
                <td>
                    <div ng-repeat="evaluator in employee.Evaluators">
                        - {{evaluator.FullName}} ({{evaluator.Nickname}})
                    </div>
                </td>
                <td class="text-center" ng-bind="employee.Evaluators[0].FromDate | date: employeeSettingCtrl.dateFormat"></td>
                <td class="text-center" ng-bind="employee.Evaluators[0].ToDate | date: employeeSettingCtrl.dateFormat"></td>
                <td class="text-center" rowspan="3">
                    <div ng-if="employeeSettingCtrl.permission !== employeeSettingCtrl.policy.Host">
                        <span ng-show="employee.StatusId === employeeSettingCtrl.assessmentStatus.Pending">Pending</span>
                        <span ng-show="employee.StatusId === employeeSettingCtrl.assessmentStatus.Verified">Verified</span>
                        <span ng-show="employee.StatusId === employeeSettingCtrl.assessmentStatus.Approved">Approved</span>
                    </div>
                    <div ng-if="employeeSettingCtrl.permission === employeeSettingCtrl.policy.Host">
                        <a href="javascript:;" ng-click="employeeSettingCtrl.editAssessmentStatus(employee)">
                            <span ng-show="employee.StatusId === employeeSettingCtrl.assessmentStatus.Pending">Pending</span>
                            <span ng-show="employee.StatusId === employeeSettingCtrl.assessmentStatus.Verified">Verified</span>
                            <span ng-show="employee.StatusId === employeeSettingCtrl.assessmentStatus.Approved">Approved</span>
                        </a>
                    </div>
                </td>
                <td class="text-center" rowspan="3">
                    <input type="checkbox" ng-checked="!employee.IsExcluded" ng-click="employeeSettingCtrl.editStatus(employee)"
                           ng-disabled="employeeSettingCtrl.permission !== employeeSettingCtrl.policy.Host" />
                </td>
                <td class="text-center" rowspan="3" ng-if="employeeSettingCtrl.permission === employeeSettingCtrl.policy.Host">
                    <a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="" ng-click="employeeSettingCtrl.edit(employee)"></a>
                </td>
            </tr>
            <tr ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}">
                <td data-translate="Employee"></td>
                <td></td>
                <td class="text-center" ng-bind="employee.Employee.FromDate | date: employeeSettingCtrl.dateFormat"></td>
                <td class="text-center" ng-bind="employee.Employee.ToDate | date: employeeSettingCtrl.dateFormat"></td>
            </tr>
            <tr ng-class="{oddRow: $index % 2 === 0, evenRow: $index % 2 !== 0}">
                <td data-translate="Management"></td>
                <td>
                    <div ng-repeat="management in employee.Managements">
                        - {{management.FullName}} ({{management.Nickname}})
                    </div>
                </td>
                <td class="text-center" ng-bind="employee.Managements[0].FromDate | date: employeeSettingCtrl.dateFormat"></td>
                <td class="text-center" ng-bind="employee.Managements[0].ToDate | date: employeeSettingCtrl.dateFormat"></td>
            </tr>
        </tbody>
        <tbody ng-show="employeeSettingCtrl.filteredItems.length === 0">
            <tr>
                <td class="empty-result" colspan="12" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="12" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry form-control" ng-model="employeeSettingCtrl.pageSize"
                            ng-options="entry for entry in employeeSettingCtrl.entries" ng-change="employeeSettingCtrl.currentPage = 1"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <ul uib-pagination total-items="employeeSettingCtrl.filteredItems.length" items-per-page="employeeSettingCtrl.pageSize"
                            boundary-links="true" max-size="5" boundary-link-numbers="true" ng-model="employeeSettingCtrl.currentPage"
                            class="pagination-sm" previous-text="&lsaquo;" next-text="&rsaquo;" first-text="&laquo;" last-text="&raquo;"></ul>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
