<div class="modal-header">
    <div class="popup-header">
        {{"Update" | translate}}
        <span class="close-popup" ng-click="updateFeedbackSettingCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Employee"></label>
            <div class="col-sm-8 bold" style="padding-top: 7px;" ng-bind="updateFeedbackSettingCtrl.feedbackSetting.employee"></div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label required-label" data-translate="FromDate"></label>
            <div class="col-sm-3">
                <p class="input-group calendar-input-group">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="updateFeedbackSettingCtrl.feedbackSetting.fromDate" uib-datepicker-popup
                           ng-click="updateFeedbackSettingCtrl.openFromDate($event)"
                           is-open="updateFeedbackSettingCtrl.calendar.fromDateOpened" />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="updateFeedbackSettingCtrl.openFromDate($event)">
                            <i class="glyphicon glyphicon-calendar"></i>
                        </button>
                    </span>
                </p>
            </div>
            <label class="col-sm-2 control-label required-label" data-translate="ToDate"></label>
            <div class="col-sm-3">
                <p class="input-group calendar-input-group">
                    <input readonly class="calendar-form-control" type="text"
                           ng-model="updateFeedbackSettingCtrl.feedbackSetting.toDate" uib-datepicker-popup
                           ng-click="updateFeedbackSettingCtrl.openToDate($event)"
                           is-open="updateFeedbackSettingCtrl.calendar.toDateOpened" />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="updateFeedbackSettingCtrl.openToDate($event)">
                            <i class="glyphicon glyphicon-calendar"></i>
                        </button>
                    </span>
                </p>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" data-translate="Submit" ng-click="updateFeedbackSettingCtrl.save()"></button>
    <button class="btn btn-cancel" ng-click="updateFeedbackSettingCtrl.cancel()" data-translate="Cancel"></button>
</div>
