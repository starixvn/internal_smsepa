<form class="col-sm-11 form-horizontal common-form" novalidate>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Code"></label>
        <div class="col-sm-8">
            <input class="form-control" type="text" ng-model="deptCtrl.newDepartment.Code" maxlength="200"
                   placeholder="Department Code" />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Name"></label>
        <div class="col-sm-8">
            <input class="form-control" type="text" ng-model="deptCtrl.newDepartment.Name" maxlength="200"
                   placeholder="Department Name" />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Parent Node"></label>
        <div class="col-sm-8">
            <select disabled class="form-control" ng-model="deptCtrl.newDepartment.ParentId"
                    ng-options="dept.DepartmentId as dept.Name for dept in deptCtrl.exclusiveDepartment">
                <option style="display: none" value="">-- Select a Parent Node --</option>
            </select>
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Manager"></label>
        <div class="col-sm-8">
            <input class="form-control" type="text" ng-model="deptCtrl.searchKey"
                   search-auto-complete search-employees="deptCtrl.getEmployee()" ng-change="deptCtrl.unSelectEmployee()"
                   employee="deptCtrl.newDepartment.Manager" maxlength="200" placeholder="Manager" />
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-3">
            <button class="button" ng-click="deptCtrl.createDepartment(deptCtrl.newDepartment)" data-translate="Submit"></button>
            <button class="btn btn-default customize" ng-click="deptCtrl.cancel()" data-translate="Cancel"></button>
        </div>
    </div>
</form>
