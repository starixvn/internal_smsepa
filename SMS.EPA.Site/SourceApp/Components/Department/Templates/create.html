<form class="col-sm-11 form-horizontal common-form" novalidate>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Code"></label>
        <div class="col-sm-8">
            <input class="form-control" type="text" ng-model="deptCtrl.newNode.Code" maxlength="200"
                   placeholder="Department Code" />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Name"></label>
        <div class="col-sm-8">
            <input class="form-control" type="text" ng-model="deptCtrl.newNode.Name" maxlength="200"
                   placeholder="Department Name" />
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Parent Node"></label>
        <div class="col-sm-8">
            <select class="form-control" ng-model="deptCtrl.newNode.DepartmentId"
                    ng-options="dept.DepartmentId as dept.Name for dept in deptCtrl.departments">
                <option style="display: none" value="">-- Select a Parent Node --</option>
            </select>
        </div>
    </div>
    <div class="form-group required">
        <label class="col-sm-3 control-label" data-translate="Manager"></label>
        <div class="col-sm-8">
            <input class="form-control" type="text" ng-model="deptCtrl.searchKey" search-auto-complete
                   search-employees="deptCtrl.searchEmployees" ng-change="deptCtrl.getEmployee(deptCtrl.searchKey)"
                   employee="deptCtrl.newNode.Manager" maxlength="200" placeholder="Manager" id="txtManager" />
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-3">
            <button class="button" ng-click="deptCtrl.create(newNode)" data-translate="Submit"></button>
            <button class="btn btn-default customize" ng-click="deptCtrl.cancel()" data-translate="Cancel"></button>
        </div>
    </div>
</form>
