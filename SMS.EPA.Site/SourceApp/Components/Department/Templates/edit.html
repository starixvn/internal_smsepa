<form class="col-sm-11 form-horizontal common-form" novalidate>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="Code"></label>
        <div class="col-sm-8">
            <input class="form-control" disabled type="text" ng-model="deptCtrl.deptSelected.Code"
                   maxlength="200" placeholder="Department Code" />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="Name"></label>
        <div class="col-sm-8">
            <input class="form-control" disabled type="text" ng-model="deptCtrl.deptSelected.Name"
                   maxlength="200" placeholder="Department Name" />
        </div>
    </div>
    <div class="form-group" ng-if="deptCtrl.deptSelected.ParentId != null">
        <label class="col-sm-3 control-label" data-translate="Parent Node"></label>
        <div class="col-sm-8">
            <select disabled class="form-control" ng-model="deptCtrl.deptSelected.ParentId"
                    ng-options="dept.DepartmentId as dept.Name for dept in deptCtrl.exclusiveDepartment">
                <option style="display: none" value="">-- Select a Parent Node --</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="Manager"></label>
        <div class="col-sm-5">
            <input disabled class="form-control" type="text" ng-model="deptCtrl.searchKey"
                   search-auto-complete search-employees="deptCtrl.getEmployee()" ng-change="deptCtrl.unSelectEmployee()"
                   employee="deptCtrl.deptSelected.Manager" maxlength="200" placeholder="Manager" />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="IsDisabled"></label>
        <div class="col-sm-8">
            <input disabled type="checkbox" ng-model="deptCtrl.deptSelected.IsActive" ng-checked="!deptCtrl.deptSelected.IsActive" />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="CreatedDate"></label>
        <div class="col-sm-8">
            <input readonly disabled type="text" class="form-control custom-date" ng-model="deptCtrl.deptSelected.CreatedDate"
                   placeholder="Start Date" datepicker-popup="{{deptCtrl.dateFormat}}" />
        </div>
    </div>
    <div class="form-group" ng-if="deptCtrl.isDisabled">
        <label class="col-sm-3 control-label" data-translate="ModifiedDate"></label>
        <div class="col-sm-8">
            <input readonly disabled type="text" class="form-control custom-date" ng-model="deptCtrl.deptSelected.ModifiedDate"
                   placeholder="End Date" datepicker-popup="{{deptCtrl.dateFormat}}" />
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-3">
            <button class="btn btn-default customize" ng-click="deptCtrl.cancel()" data-translate="Cancel"></button>
        </div>
    </div>
</form>
