<form class="col-sm-11 form-horizontal common-form" novalidate>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="Code"></label>
        <div class="col-sm-8">
            <input class="form-control" disabled type="text" ng-model="deptCtrl.deptSelected.Code"
                   maxlength="200" placeholder="Department Code" />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="Name"></label>
        <div class="col-sm-8">
            <input class="form-control" disabled type="text" ng-model="deptCtrl.deptSelected.Name"
                   maxlength="200" placeholder="Department Name" />
        </div>
    </div>
    <div class="form-group" ng-if="deptCtrl.deptSelected.ParentId != null">
        <label class="col-sm-3 control-label" data-translate="Parent Node"></label>
        <div class="col-sm-8">
            <select disabled class="form-control" ng-model="deptCtrl.deptSelected.ParentId"
                    ng-options="dept.DepartmentId as dept.Name for dept in deptCtrl.departments">
                <option style="display: none" value="">-- None --</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="Manager"></label>
        <div class="col-sm-5">
            <input disabled class="form-control" type="text" ng-model="deptCtrl.manager" />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-3 control-label" data-translate="IsDisabled"></label>
        <div class="col-sm-8">
            <input disabled type="checkbox" ng-model="deptCtrl.deptSelected.IsActive" ng-checked="!deptCtrl.deptSelected.IsActive" />
        </div>
    </div>
    <div class="form-group">
        <div class="text-center">
            <button class="btn btn-cancel" ng-click="deptCtrl.cancel()" data-translate="Cancel"></button>
        </div>
    </div>
</form>
