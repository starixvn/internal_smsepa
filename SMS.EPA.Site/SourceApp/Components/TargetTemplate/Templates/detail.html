<div class="col-sm-12" ng-controller="DetailTargetTemplateController as detailCtrl">
    <div class="sub-header">
        <ul class="breadcrumb">
            <li class="current" data-translate="TargetTemplateDetail"></li>
        </ul>
    </div>
    <form class="common-form kpi-list-form" novalidate>
    <div>
        <div class="boxtitle first tab-header" data-translate="TargetTemplateInformation">
        </div>
        <div class="boxcontent information">
            <div class="col-sm-6 line">
                <label class="col-sm-4 label-bold" data-translate="Name">
                </label>
                <div class="col-sm-8 target-template-information">
                    <span ng-bind="detailCtrl.targetTemplate.Name"></span>
                </div>
            </div>
            <div class="col-sm-6 line">
                <label class="col-sm-4 label-bold" data-translate="TargetType">
                </label>
                <div class="col-sm-8 target-template-information">
                    <span ng-bind="detailCtrl.targetTemplate.TargetTypeName"></span>
                </div>
            </div>
            <div class="col-sm-6 line">
                <label class="col-sm-4 label-bold" data-translate="CreatedBy">
                </label>
                <div class="col-sm-8 target-template-information">
                    <span>{{detailCtrl.targetTemplate.CreatedFullName}} ({{detailCtrl.targetTemplate.CreatedNickName}})</span>
                </div>
            </div>
            <div class="col-sm-6 line">
                <label class="col-sm-4 label-bold" data-translate="LastModifiedBy">
                </label>
                <div class="col-sm-8 target-template-information">
                    <span>{{detailCtrl.targetTemplate.ModifiedFullName}} ({{detailCtrl.targetTemplate.ModifiedNickName}})</span>
                </div>
            </div>
            <div class="col-sm-6 line">
                <label class="col-sm-4 label-bold" data-translate="CreatedDate">
                </label>
                <div class="col-sm-8 target-template-information">
                    <span ng-bind="detailCtrl.targetTemplate.CreatedDate | date: detailCtrl.dateFormat"></span>
                </div>
            </div>
            <div class="col-sm-6 line">
                <label class="col-sm-4 label-bold" data-translate="LastModifiedDate">
                </label>
                <div class="col-sm-8 target-template-information">
                    <span ng-bind="detailCtrl.targetTemplate.ModifiedDate | date: detailCtrl.dateFormat"></span>
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-2 label-bold" data-translate="Description">
                </label>
                <div class="col-sm-6 target-template-information">
                    <span class="positive-margin" ng-bind="detailCtrl.targetTemplate.Description"></span>
                </div>
            </div>
        </div>
        <div class="boxtitle tab-header" data-translate="KPIList">
        </div>
        <div class="col-sm-12 boxcontent kpi-content">
            <div class="col-sm-6 no-padding" ng-repeat="group in detailCtrl.kpiList | filter: KPIName" ng-class="{'self-clear': $index % 2 == 0}">
                <ul class="col-sm-12 list-unstyled kpi-list">
                    <li class="title-list"><strong>{{ group.Name }}</strong> <strong ng-show="group.KPIs.length > 0">
                        ({{ group.Weight }})</strong> </li>
                    <li ng-repeat="item in group.KPIs | filter: KPIName"><span class="glyphicon glyphicon-ok item-list-icon">
                    </span>{{item.Name}} <span ng-show="!group.IsSpreadKPI">({{item.Weight}})</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="action-button text-center">
        <button class="btn btn-default customize" ng-click="detailCtrl.back()" data-translate="Back">
        </button>
    </div>
    </form>
</div>
