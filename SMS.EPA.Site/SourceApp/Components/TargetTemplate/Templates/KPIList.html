<div ng-controller="KPIListController as kpiListCtrl">
    <form class="form-horizontal common-form project-form" novalidate>
    <div class="first boxtitle">
        <a class="button" title="Manage KPI Group" ng-click="kpiListCtrl.addKPIGroup()">
            <span class="glyphicon glyphicon-cog icon-setting"></span> {{"ManageKPIGroupTargetTemplate" | translate}}</a>
        <input class="search-textbox pull-right" placeholder="filter kpi..." type="text" ng-model="KPIName" />
    </div>
    <div class="boxcontent">
        <div class="line top-buffer">
            <div>
                <table class="table table-bordered table-striped table-hover" id="tblKPI">
                    <thead>
                        <th>
                            <input type="checkbox" ng-model="kpiListCtrl.SelectedAll" ng-click="kpiListCtrl.checkAll(kpiListCtrl.SelectedAll)" />
                        </th>
                        <th data-translate="KPIName">
                        </th>
                        <th data-translate="Weight">
                        </th>
                        <th class="middle-align" data-translate="Priority">
                        </th>
                    </thead>
                    <tbody ng-repeat="group in kpiListCtrl.kpiList | filter: KPIName" class="kpiItemBody" list-sortable>
                        <tr class="row-header unsortable">
                            <td class="text-center row-highlight">
                                <input type="checkbox" ng-model="group.GroupSelected" ng-click="kpiListCtrl.checkAllGroup(group.GroupSelected, group)" />
                            </td>
                            <td class="criteria-title row-highlight group-header">
                                <span>{{ group.Name}} ({{group.Weight}}%)</span> <a
                                    class="glyphicon glyphicon-remove icon-remove left-buffer" title="Remove Group"
                                    ng-click="kpiListCtrl.removeKPIGroup(group)" href="javascript:;"></a>
                            </td>
                            <td class="text-center row-highlight">
                                <a ng-show="!group.IsSpreadKPI" href="javascript:;" ng-click="kpiListCtrl.scoreSpread(group)">Spread</a>
                            </td>
                            <td class="text-center row-highlight">
                            </td>
                        </tr>
                        <tr class="row-data" ng-repeat="item in group.KPIs | filter: KPIName">
                            <td class="text-center" item-id="{{item.KPIId}}" group-id="{{group.KPIGroupId}}">
                                <input class="check-group" type="checkbox" value="{{item.Name}}" ng-model="item.Selected" />
                            </td>
                            <td ng-bind="item.Name">
                            </td>
                            <td class="width-100 text-center">
                                <input type="text" class="weight-form-control text-center" ng-show="!group.IsSpreadKPI && item.Selected"
                                    ng-model="item.Weight" percentage />
                                <span ng-show="group.IsSpreadKPI && !item.Selected">-</span> 
                                <span ng-show="group.IsSpreadKPI && item.Selected" class="glyphicon glyphicon-ok item-list-icon"></span>
                            </td>
                            <td class="text-center priority-limit">
                                <a ng-click="setPriority($event)" href="javascript:;" title="Top" class="glyphicon glyphicon-open kpiTop">
                                    | </a><a ng-click="setPriority($event)" href="javascript:;" title="Move Up" class="glyphicon glyphicon-arrow-up kpiUp">
                                        | </a><a ng-click="setPriority($event)" href="javascript:;" title="Move Down" class="glyphicon glyphicon-arrow-down kpiDown">
                                            | </a><a ng-click="setPriority($event)" href="javascript:;" title="Bottom" class="glyphicon glyphicon-save kpiBottom">
                                            </a>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr ng-show="lstKPI == ''">
                            <td class="empty-result" colspan="4" data-translate="EmptyResult">
                            </td>
                        </tr>
                    </tfoot>
                </table>
                <div class="col-sm-offset-5 top-buffer">
                    <button class="button" ng-disabled="editTargetTemplate.$invalid" ng-click="update(editTemplate)"
                        data-translate="Submit">
                    </button>
                    <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
                    </button>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
