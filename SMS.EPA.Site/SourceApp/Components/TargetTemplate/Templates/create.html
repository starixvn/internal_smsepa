<div class="modal-header">
    <div class="popup-header">
        {{"CreateTargetTemplate" | translate}}
        <span class="close-popup" ng-click="createTargetTemplateCtrl.cancel()"></span>
    </div>
</div>
<div class="modal-body">
    <form class="form-horizontal" role="form">
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Name">
            </label>
            <div class="col-sm-8 field">
                <input type="text" class="form-control" ng-model="createTargetTemplateCtrl.targetTemplate.Name" required maxlength="200" />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="TargetType"></label>
            <div class="col-sm-8 field">
                <select class="form-control" ng-options="targetType.TargetTypeId as targetType.Name for targetType in createTargetTemplateCtrl.targetTypes"
                        ng-model="createTargetTemplateCtrl.targetTemplate.TargetTypeId" required name="targetType"
                        ng-change="createTargetTemplateCtrl.handleChangeTargetType()">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="ScoreRatingType"></label>
            <div class="col-sm-8">
                <select class="form-control" ng-options="scoreType.ScoreRatingTypeId as scoreType.Name for scoreType in createTargetTemplateCtrl.scoreRatingTypeOptions"
                        ng-model="createTargetTemplateCtrl.targetTemplate.ScoreRatingTypeId" required
                        ng-disabled="createTargetTemplateCtrl.targetTemplate.TargetTypeId == createTargetTemplateCtrl.targetTypeEnum.Feedback360">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="RatingType"></label>
            <div class="col-sm-8">
                <select class="form-control" ng-options="type.RatingTypeId as type.Name for type in createTargetTemplateCtrl.ratingTypes"
                        ng-model="createTargetTemplateCtrl.targetTemplate.RatingTypeId" required
                        ng-disabled="createTargetTemplateCtrl.targetTemplate.TargetTypeId == createTargetTemplateCtrl.targetTypeEnum.Feedback360">
                    <option value="">-- {{"Select" | translate}} --</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Active"></label>
            <div class="col-sm-8 field active-label">
                <input ng-model="createTargetTemplateCtrl.targetTemplate.IsActive" type="checkbox" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Description"></label>
            <div class="col-sm-8 field">
                <textarea class="form-control custom-texarea" ng-model="createTargetTemplateCtrl.targetTemplate.Description" maxlength="2000"></textarea>
            </div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-primary" data-translate="Submit" ng-click="createTargetTemplateCtrl.save(createTargetTemplateCtrl.targetTemplate)"></button>
    <button class="btn btn-cancel" ng-click="createTargetTemplateCtrl.cancel()" data-translate="Cancel"></button>
</div>
