<div class="col-sm-12" ng-controller="UpdateTargetTemplateController as updateCtrl">
    <div class="sub-header">
        <ul class="row breadcrumb float-left">
            <li class="current" data-translate="EditTargetTemplate"></li>
        </ul>
        <button ng-click="updateCtrl.backToList()" class="btn btn-cancel">
            <span class="glyphicon glyphicon-menu-left"></span> <span data-translate="BackToList"></span>
        </button>
    </div>
    <div class="target-tabset">
        <tabset id="TargetTemplateTab">
            <tab heading="GENERAL INFORMATION" class="tab-cursor" active="updateCtrl.dataTab.information" select="updateCtrl.tabInfoSelect()">
                <div ng-include src="'/SourceApp/Components/TargetTemplate/Templates/generalInformation.html'"></div>
            </tab>
            <tab heading="TARGET KPI LIST" class="tab-cursor" active="updateCtrl.dataTab.kpi" select="updateCtrl.tabKPISelect()">
                <div ng-include src="'/SourceApp/Components/TargetTemplate/Templates/KPIList.html'"></div>
            </tab>
        </tabset>
    </div>
</div>
