<div ng-controller="TargetTemplateController as targetTemplateCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="TargetTemplateManagement"></li>
        </ul>
    </div>
    <div class="col-sm-12">
        <form novalidate class="row filter form-inline" role="form">
            <div class="form-group">
                <label class="control-label" data-translate="Status"></label>
                <select class="form-control" ng-model="targetTemplateCtrl.filter.isActive">
                    <option value="">-- {{"All" | translate}} --</option>
                    <option selected value="true" data-translate="Active"></option>
                    <option value="false" data-translate="InActive"></option>
                </select>
            </div>
            <div class="form-group">
                <button class="button" ng-click="targetTemplateCtrl.query(targetTemplateCtrl.filter)" data-translate="Submit"></button>
            </div>
        </form>
        <table class="row table table-bordered table-striped">
            <thead>
                <tr class="header-table">
                    <th colspan="7">
                        <a class="pull-left button-icon create-button" href="" ng-href="{{targetTemplateCtrl.createTargetTemplateUrl}}" ng-click="targetTemplateCtrl.create()" 
                            ng-if="targetTemplateCtrl.permission == 2">
                            <span class="icon plus"></span>
                            <span class="button-text" data-translate="CreateTargetTemplate"></span>
                        </a>
                        <input type="text" ng-model="targetTemplateCtrl.searchKey" ng-change="targetTemplateCtrl.search()" class="search-inline-textbox search pull-right">
                    </th>
                </tr>
                <tr class="headerName">
                    <th data-translate="SymbolCount">
                    </th>
                    <th data-translate="Name">
                    </th>
                    <th data-translate="TargetType">
                    </th>
                    <th data-translate="Description">
                    </th>
                    <th data-translate="KPIs">
                    </th>
                    <th data-translate="Active">
                    </th>
                    <th data-translate="Action" ng-if="targetTemplateCtrl.permission == 2">
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr dir-paginate="targetTemplate in targetTemplateCtrl.filteredItems | itemsPerPage: targetTemplateCtrl.pageSize" current-page="targetTemplateCtrl.currentPage">
                    <td class="text-center" ng-bind="targetTemplateCtrl.getIndex($index, targetTemplateCtrl.currentPage, targetTemplateCtrl.pageSize)">
                    </td>
                    <td class="column-limit">
                        <a href="{{targetTemplateCtrl.detailTargetTemplateUrl}}" ng-click="targetTemplateCtrl.detail(targetTemplate)" ng-bind="targetTemplate.Name"></a>
                    </td>
                    <td class="text-center" ng-bind="targetTemplate.TargetTypeName">
                    </td>
                    <td class="col-description">
                        {{targetTemplate.Description | limitTo: targetTemplate.numLimit > 0 ? targetTemplate.numLimit: targetTemplateCtrl.maxLengthDescription}}
                        <a ng-show="!targetTemplate.showReadMore && (targetTemplate.Description.length >= targetTemplateCtrl.maxLengthDescription)"
                            href="javascript:;" ng-click="targetTemplateCtrl.readMore(targetTemplate)" data-translate="ReadMore"></a>
                        <a ng-show="targetTemplate.showReadMore && (targetTemplate.Description.length >= targetTemplateCtrl.maxLengthDescription)"
                            href="javascript:;" ng-click="targetTemplateCtrl.readLess(targetTemplate)" data-translate="ReadLess"></a>
                    </td>
                    <td class="text-center">
                        <a href="{{targetTemplateCtrl.updateTargetTemplateUrl}}" ng-if="targetTemplateCtrl.permission == 2"
                            ng-click="targetTemplateCtrl.update(targetTemplate, true)" ng-bind="targetTemplate.KPIs"></a>
                        <span ng-if="targetTemplateCtrl.permission == 1" ng-bind="targetTemplate.KPIs"></span>
                    </td>
                    <td class="text-center">
                        <input type="checkbox" ng-checked="targetTemplate.IsActive" ng-click="targetTemplateCtrl.confirmActive(targetTemplate)" 
                                ng-disabled="targetTemplateCtrl.permission != 2"/>
                    </td>
                    <td class="target-template-action text-center" ng-if="targetTemplateCtrl.permission == 2">
                        <div class="btn-group">
                            <a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="{{targetTemplateCtrl.updateTargetTemplateUrl}}" 
                                    ng-click="targetTemplateCtrl.update(targetTemplate)"></a>
                            <a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" title="Delete" ng-click="targetTemplateCtrl.deleteTargetTemplate(targetTemplate)"></a>
                        </div>
                    </td>
                </tr>
                <tr ng-show="targetTemplateCtrl.filteredItems.length == 0">
                    <td class="empty-result" colspan="7" data-translate="EmptyResult">
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="9" class="paging">
                        <span data-translate="Show"></span>
                        <select class="dropdown-entry form-control" ng-model="targetTemplateCtrl.pageSize"
                                ng-options="entry for entry in targetTemplateCtrl.entries"></select>
                        <span data-translate="entries"></span>
                        <div class="pull-right custom-paging">
                            <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                        </div>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
