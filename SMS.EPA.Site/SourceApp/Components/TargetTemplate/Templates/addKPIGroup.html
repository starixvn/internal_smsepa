<div class="modal-addKPIGroup" id="modal-addKPIGroup">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="KPIGroup"></span><span class="close-popup" ng-click="addKPIGroupCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <table class="table table-bordered table-striped table-hover" id="tblKPIGroup">
            <thead>
                <tr>
                    <th class="middle-align">
                        <input type="checkbox" ng-model="addKPIGroupCtrl.selectedAll" ng-click="addKPIGroupCtrl.checkAll(addKPIGroupCtrl.selectedAll)" />
                    </th>
                    <th class="middle-align" data-translate="Name"></th>
                    <th class="middle-align" data-translate="Weight"></th>
                    <th class="spread-weight-max middle-align" data-translate="SpreadWeight"></th>
                    <th class="middle-align" data-translate="Priority"></th>
                </tr>
            </thead>
            <tbody list-sortable>
                <tr ng-repeat="group in addKPIGroupCtrl.kpiGroups" title="Drag to sort table rows">
                    <td class="text-center" data-id="{{group.KPIGroupId}}">
                        <input class="check-group" type="checkbox" ng-model="group.Selected" ng-click="addKPIGroupCtrl.check(group)" />
                    </td>
                    <td class="kpigroup-column-max" ng-bind="group.Name"></td>
                    <td class="width-100 text-center">
                        <span ng-show="group.selected == false" ng-bind="group.Weight"></span>
                        <input type="text" class="weight-form-control text-center" name="weight" ng-model="group.Weight" ng-show="group.Selected == true" epa-number-dot />
                    </td>
                    <td class="width-100 text-center">
                        <input type="checkbox" name="spread" ng-model="group.IsSpreadKPI" ng-show="group.Selected" ng-disabled="group.HasKPIOptional" />
                    </td>
                    <td class="text-center">
                        <a href="javascript:;" title="Top" class="glyphicon glyphicon-open top" move-group-row> | </a>
                        <a href="javascript:;" title="Move Up" class="glyphicon glyphicon-arrow-up up" move-group-row> | </a>
                        <a href="javascript:;" title="Move Down" class="glyphicon glyphicon-arrow-down down" move-group-row> | </a>
                        <a href="javascript:;" title="Bottom" class="glyphicon glyphicon-save bottom" move-group-row></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modal-footer error-message">
        <span class="pull-left" data-translate="UncheckKPIGroupWarning"></span>
        <button class="btn btn-primary" get-group-weight data-translate="OK"></button>
        <button class="btn btn-cancel" ng-click="addKPIGroupCtrl.cancel()" data-translate="Cancel"></button>
    </div>
</div>
