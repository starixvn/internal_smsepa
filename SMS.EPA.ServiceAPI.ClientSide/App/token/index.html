<div ng-controller="tokenController as vm">
    <h3><strong>{{vm.Title}}</strong></h3>
    <div class="form-group">
        <label>App Id</label>
        <input type="text" class="form-control" ng-model="vm.loginModel.appId" placeholder="Application Id">
    </div>
    <button type="button" class="btn btn-default" ng-click="vm.requestToken()">Request</button>
    <button type="button" class="btn btn-default" ng-show="vm.token.accessToken" ng-click="vm.deleteToken()">Delete Token</button>
    <div ng-show="vm.token.accessToken">
        <p><strong>Token:</strong> {{vm.token.accessToken}}</p>
        <p><strong>Expire in:</strong> {{vm.token.expiresIn}}</p>
    </div>
</div>
