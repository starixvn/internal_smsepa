<div ng-controller="departmentController as vm">
    <h3><strong>{{vm.title}}</strong></h3>
    <div class="form-group">
        <label>Department Id</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel.DepartmentId" placeholder="Department Id">
    </div>
    <div class="form-group">
        <label>Code</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel.Code" placeholder="Code">
    </div>
    <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel[0].Name" placeholder="Department Name">
    </div>
    <div class="form-group">
        <label>Parent Id</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel[0].ParentId" placeholder="Parent Id">
    </div>
    <div class="form-group">
        <label>Manager Id</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel[0].ManagerId" placeholder="Manager Id">
    </div>
    <div class="form-group">
        <label>Department Level</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel[0].DepartmentLevel" placeholder="Department Level">
    </div>
    <div class="form-group">
        <label>Is Deleted</label>
        <input type="checkbox" class="form-control" ng-model="vm.departmentModel[0].IsDeleted">
    </div>
    <div class="form-group">
        <label>Modified Date</label>
        <input type="text" class="form-control" ng-model="vm.departmentModel[0].ModifiedDate" placeholder="Modified Date">
    </div>
    <button type="submit" class="btn btn-default" ng-click="vm.insert()">Request</button>

    <div ng-show="vm.result.code!=0">
        <p><strong>Status Code:</strong>{{vm.result.code}}</p>
        <p><strong>Message:</strong><span class="alert-warning">{{vm.result.message}}</span></p>
    </div>
</div>
